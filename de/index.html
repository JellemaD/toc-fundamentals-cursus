n-Constraints: Productive und Protective (Sprint) werden für den Constraint gebraucht; Protective und Excess bilden die Idle Capacity.\"></p>\n\n<p>Das Dictionary sagt über die <em>protective capacity</em>, dass Non-Constraints sie brauchen, um die „Bank“ (den Bestand) vor dem Constraint oder der CCR wieder aufzubauen und die Liefertreue zu schützen. Manche Practitioner meinen, auch der Constraint selbst solle etwas Protective Capacity für positive Überraschungen haben, etwa unerwartete Zusatznachfrage eines wichtigen Kunden.</p>\n<p>Zwei Zusammenhänge, die die Prüfung gern testet:</p>\n<ul>\n<li><strong>Mehr Protective Capacity bedeutet kleinere Puffer.</strong> Wenn Non-Constraints schnell aufholen können, muss der Zeitpuffer vor dem Constraint nicht so groß sein. Das verkürzt die Lead Time.</li>\n<li><strong>Weniger Schwankung bedeutet weniger benötigte Protective Capacity.</strong> Verringern Sie Murphy, brauchen Sie weniger Reserve.</li>\n</ul>\n<p>Die traditionelle Sicht betrachtet alle Idle Capacity als Verschwendung, die abgebaut werden muss. Die TOC sagt: Ein Teil davon, die Protective Capacity, ist lebenswichtig. Nur die Excess Capacity dürfen Sie abbauen, und selbst die nutzen Sie besser für zusätzlichen Verkauf.</p>\n<p>Sprint Capacity ist das Synonym für Protective Capacity: die Kapazität, um zu „sprinten“ und nach einer Störung aufzuholen.</p>\n<h2 id=\"27-activation-versus-utilization\">2.7 Activation versus Utilization</h2>\n<p>Diese Unterscheidung stammt direkt aus <em>The Goal</em> und ist eine feste Prüfungsfrage.</p>\n<p><em>Activation</em> (Aktivierung) bedeutet schlicht, eine Ressource arbeiten zu lassen. <em>Utilization</em> (Nutzung) bedeutet in der TOC: Aktivierung, die produktiv zum Erreichen des Goals beiträgt. Englischer Kern von Utilization: \"activation of a resource that productively contributes to reaching the goal.\"</p>\n<p>Der Unterschied: Ein Non-Constraint, der den ganzen Tag läuft, ist zu 100 Prozent aktiviert. Kann der Constraint aber nur 60 Prozent dieser Ausbringung verarbeiten, ist der Non-Constraint nur zu 60 Prozent genutzt. Die übrigen 40 Prozent erzeugen nur Bestand.</p>\n<p><em>Over activation</em> (Überaktivierung) ist das Aktivieren einer Ressource über das hinaus, was nötig ist, um mit dem Constraint Schritt zu halten, oder, nach einer Störung, über das hinaus, was nötig ist, um den Bestand vor dem Constraint wieder aufzubauen. Beispiel aus dem Dictionary: Eine Ressource mit 7 Stunden Kapazität pro Schicht muss normalerweise 5,5 Stunden produzieren, um mit dem Constraint Schritt zu halten. Mehr als 5,5 Stunden ist Over Activation, es sei denn, nach einer Störung muss aufgeholt werden.</p>\n<p>In der TOC werden Non-Constraints bis zu dem Niveau aktiviert, das nötig ist, um den Constraint vollständig auszuschöpfen. Die Folge von Over Activation: zusätzlicher WIP und zusätzliche Fertigware. Das kostet Geld (Investment), verlängert die Lead Times und verstopft die Fabrik.</p>\n<h2 id=\"28-garbage-time-und-die-stunde-des-bottlenecks\">2.8 Garbage Time und die Stunde des Bottlenecks</h2>\n<p><em>Garbage time</em> (Abfallzeit) ist der informelle Begriff für Zeit, die ein Bottleneck für Arbeit aufwendet, die entweder gar nicht getan werden sollte oder von einem Non-Bottleneck erledigt werden sollte. Beispiele:</p>\n<ul>\n<li>Teile bearbeiten, die später aussortiert werden (die Qualitätskontrolle hätte vor dem Bottleneck liegen müssen).</li>\n<li>Für den Bestand statt für Aufträge produzieren.</li>\n<li>Einen Arbeitsgang ausführen, den auch eine ältere, langsamere Maschine hätte erledigen können.</li>\n</ul>\n<h3 id=\"eine-am-bottleneck-verlorene-stunde\">Eine am Bottleneck verlorene Stunde</h3>\n<p>Zwei berühmte Regeln von Jonah aus <em>The Goal</em>:</p>\n<ol>\n<li><strong>Eine am Bottleneck verlorene Stunde ist eine für das gesamte System verlorene Stunde.</strong> Der Bottleneck bestimmt den Throughput. Jede Stunde, in der er nicht produziert, kommt nie zurück. Der verlorene Throughput ist nicht der Kostensatz dieser Maschinenstunde, sondern der Throughput des gesamten Systems in dieser Stunde.</li>\n<li><strong>Eine an einem Non-Bottleneck gesparte Stunde ist eine Illusion (a mirage).</strong> Ein Non-Bottleneck hat bereits Idle Capacity. Eine gesparte Stunde fügt Idle Capacity hinzu, keinen Throughput.</li>\n</ol>\n<p>Rechenbeispiel: Eine Fabrik erzeugt 10.000 Euro Throughput pro Stunde. Der Bottleneck steht wegen einer vermeidbaren Umrüstung eine Stunde still. Verlust: 10.000 Euro, auch wenn die Maschine selbst nur 50 Euro pro Stunde kostet. Dieselbe Umrüstung an einem Non-Bottleneck kostet keinen Throughput. Darum trifft die TOC Batch-Entscheidungen an Bottlenecks (große Batches, wenige Umrüstungen) anders als an Non-Bottlenecks (kleine Batches, viele Umrüstungen).</p>\n<h2 id=\"29-mini-fall-das-labor\">2.9 Mini-Fall: das Labor</h2>\n<p>Ein medizinisches Labor hat vier Stationen: Annahme, Zentrifuge, Analysegerät, Berichtswesen. Kapazitäten pro Stunde: 60, 80, 40, 100 Proben. Nachfrage: 50 pro Stunde.</p>\n<ul>\n<li>Das Analysegerät (40) ist ein <strong>Bottleneck</strong>: Kapazität kleiner als Nachfrage.</li>\n<li>Alle werden nach Effizienz gemessen. Die Annahme verarbeitet 60 pro Stunde (Over Activation). Vor dem Analysegerät stauen sich pro Stunde 20 Proben.</li>\n<li>Falsch etikettierte Proben fallen erst nach dem Analysegerät auf. Jede fehlerhafte Probe hat Zeit des Analysegeräts verbraucht: Garbage Time.</li>\n</ul>\n<p>TOC-Maßnahmen: Etikettenkontrolle vor dem Analysegerät (Exploit), Annahme zurück auf 40 pro Stunde (Subordinate), erst danach ein zweites Analysegerät (Elevate). Die Zentrifuge (80) hat 40 Productive Capacity, der Rest ist Protective plus Excess. Diese Reserve nicht abbauen: Nach einer Störung muss die Zentrifuge schnell aufholen können, damit das Analysegerät nicht ausgehungert wird.</p>\n<h2 id=\"prufungsfallen\">Prüfungsfallen</h2>\n<ul>\n<li><strong>Bottleneck versus CCR.</strong> Bottleneck: Kapazität kleiner oder gleich der Nachfrage. CCR: im Durchschnitt genug Kapazität, aber so knapp, dass Schwankungen den Throughput schädigen können. Eine Fabrik kann eine CCR haben, während der Markt der Constraint ist.</li>\n<li><strong>Constraint versus Bottleneck.</strong> Constraint ist der umfassendere Begriff (kann Markt, Critical Chain, Ressource sein). Bottleneck betrifft nur Ressourcen mit zu wenig Kapazität.</li>\n<li><strong>Misnomers.</strong> Policy, Measures, Material und Management (Bedeutung 1) Constraints sind laut Dictionary keine Constraints; sie behindern Exploit und Subordinate. Der Market Constraint ist dagegen echt.</li>\n<li><strong>Dummy Constraint beseitigen, Strategic Constraint behalten.</strong> Zwei entgegengesetzte Maßnahmen, beide richtig.</li>\n<li><strong>Activation ist nicht Utilization.</strong> Eine laufende Ressource ist aktiviert; nur was zum Goal beiträgt, ist Nutzung. Over Activation erzeugt Bestand, keinen Throughput.</li>\n<li><strong>Idle Capacity ist nicht gleich Excess Capacity.</strong> Idle besteht aus Protective plus Excess. Nur Excess ist wirklich überschüssig.</li>\n<li><strong>Eine an einem Non-Bottleneck gesparte Stunde ist kein Gewinn.</strong> Nur Stunden am Bottleneck zählen für das System.</li>\n</ul>\n<h2 id=\"zusammenfassung\">Zusammenfassung</h2>\n<ul>\n<li>Ein Constraint ist der Faktor, der die Systemleistung letztlich begrenzt; indem Sie ihn ausschöpfen, sich ihm unterordnen oder ihn erweitern, erreichen Sie mehr vom Goal.</li>\n<li>Jedes System hat mindestens einen Constraint, aber selten mehr als einige wenige.</li>\n<li>Echte Constraints: interne Kapazität (Bottleneck), Markt, strategisch gewählter Constraint. Dummy Constraints sind echt, müssen aber immer beseitigt werden.</li>\n<li>Misnomers laut Dictionary: Policy, Measures, Material und (schlechtes) Management. Sie behindern Exploit und Subordinate.</li>\n<li>Bottleneck Resource: Kapazität &lt;= Nachfrage. CCR: Kapazität gerade ausreichend, aber anfällig. Non-Bottleneck: Kapazität &gt; Nachfrage.</li>\n<li>Ein Wandering Bottleneck springt häufig; ein Temporary Bottleneck ist kurz; ein Permanent Bottleneck bleibt trotz zusätzlicher Mittel (zum Beispiel IT und Vertrieb im Dienstleistungsbereich).</li>\n<li>Dependent Events plus Statistical Fluctuations führen dazu, dass sich Schwankungen in einer Kette akkumulieren (Streichholzspiel, Herbie). Deshalb ist die Ausbringung einer Kette niedriger als der Durchschnitt der Schritte.</li>\n<li>Eine Balanced Plant (alle Kapazitäten gleich der Nachfrage) scheitert deshalb. Die TOC gleicht den Flow aus, nicht die Kapazität.</li>\n<li>Kapazität eines Non-Constraints: Productive (für den Constraint nötig) plus Idle; Idle besteht aus Protective (Sprint; Aufholen nach Murphy) plus Excess.</li>\n<li>Mehr Protective Capacity ermöglicht kleinere Puffer und kürzere Lead Times; weniger Schwankung verringert den Bedarf an Protective Capacity.</li>\n<li>Activation heißt, eine Ressource laufen zu lassen; Utilization ist Aktivierung, die zum Goal beiträgt. Over Activation erzeugt nur Bestand.</li>\n<li>Eine am Bottleneck verlorene Stunde ist eine für das gesamte System verlorene Stunde; eine an einem Non-Bottleneck gesparte Stunde ist eine Illusion. Garbage Time ist Bottleneck-Zeit für Arbeit, die nicht oder anderswo hätte erledigt werden sollen.</li>\n</ul>", "q": [{"n": 1, "q": "Welche Definition von <em>constraint</em> entspricht dem TOCICO Dictionary?", "opts": {"A": "Jede Ressource, die zu weniger als 100 Prozent genutzt wird", "B": "Der Faktor, der die Leistung des Systems letztlich begrenzt", "C": "Jede Richtlinie, die die Produktion verlangsamt", "D": "Die teuerste Maschine im System"}, "gebied": 1, "a": "B", "e": "Das ist die Definition aus dem Dictionary. A verwechselt Constraint mit Idle Capacity. C beschreibt einen Policy Constraint, den das Dictionary einen Misnomer nennt. D verwechselt Hebelwirkung mit Umfang."}, {"n": 2, "q": "Eine Ressource hat eine Kapazität von 105 Stück pro Tag bei einer Nachfrage von 100, hat aber viele Störungen, durch die der Throughput regelmäßig sinkt. Um welche Art von Ressource handelt es sich?", "opts": {"A": "Bottleneck Resource", "B": "Capacity-Constrained Resource (CCR)", "C": "Non-Constraint ohne weiteren Handlungsbedarf", "D": "Dummy Constraint"}, "gebied": 1, "a": "B", "e": "Die Kapazität reicht im Durchschnitt aus (105 &gt; 100), aber Schwankungen bedrohen den Throughput, wenn die Ressource nicht sorgfältig gesteuert wird: die Definition einer CCR. A erfordert Kapazität &lt;= Nachfrage. C ignoriert das Risiko. D betrifft die Kosten, nicht die Kapazität."}, {"n": 3, "q": "Welchen der folgenden Begriffe nennt das Dictionary einen \"misnomer\" (falsche Bezeichnung)?", "opts": {"A": "Market Constraint", "B": "Policy Constraint", "C": "Strategic Constraint", "D": "Interactive Constraints"}, "gebied": 1, "a": "B", "e": "Der Policy Constraint (wie Measures, Material und Management Constraint) ist laut Dictionary ein Misnomer: Schlechte Richtlinien behindern Exploit und Subordinate, sind aber nicht der Constraint. A, C und D sind echte Constraint-Begriffe."}, {"n": 4, "q": "Was ist der richtige Unterschied zwischen <em>activation</em> und <em>utilization</em>?", "opts": {"A": "Activation gilt für Maschinen, Utilization für Menschen", "B": "Activation heißt, eine Ressource arbeiten zu lassen; Utilization ist Aktivierung, die produktiv zum Goal beiträgt", "C": "Utilization ist immer höher als Activation", "D": "Es gibt keinen Unterschied; es sind Synonyme"}, "gebied": 1, "a": "B", "e": "Activation heißt, arbeiten zu lassen; Utilization ist Aktivierung, die zum Goal beiträgt. A und C sind erfunden. D ist falsch; gerade die Unterscheidung ist der Kern."}, {"n": 5, "q": "Was lehrt das Streichholzspiel (match-bowl game) aus <em>The Goal</em>?", "opts": {"A": "Durchschnitte einzelner Schritte sagen die Ausbringung einer Kette richtig voraus", "B": "Schwankungen in einer Kette abhängiger Ereignisse akkumulieren sich und senken die Ausbringung unter den Durchschnitt", "C": "Hohe Würfe gleichen niedrige Würfe vollständig aus", "D": "Mehr Schalen in der Reihe erhöhen die Ausbringung"}, "gebied": 1, "a": "B", "e": "Weil ein Junge nie mehr weitergeben kann, als er hat, werden niedrige Würfe nicht ausgeglichen, und hohe Würfe gehen verloren; Schwankungen akkumulieren sich. A und C sind genau das, was das Spiel widerlegt. D ist falsch; mehr Schritte verstärken den Effekt."}, {"n": 6, "q": "Warum lehnt die TOC eine <em>balanced plant</em> ab?", "opts": {"A": "Weil eine Balanced Plant zu viel Excess Capacity hat", "B": "Weil bei Dependent Events und Statistical Fluctuations verlorene Ausbringung nie aufgeholt wird, wenn niemand Reserve hat", "C": "Weil Lean eine Balanced Plant vorschreibt", "D": "Weil eine Balanced Plant keine Drum haben kann"}, "gebied": 1, "a": "B", "e": "Ohne Reservekapazität wird jeder Verlust durch Schwankungen endgültig. A ist das Gegenteil. C ist kein Grund für die TOC. D ist nicht der Grund; die Frage ist, ob die Fabrik den Flow schützen kann."}, {"n": 7, "q": "<em>Idle capacity</em> an einem Non-Constraint besteht aus:", "opts": {"A": "Productive Capacity und Excess Capacity", "B": "Protective Capacity und Excess Capacity", "C": "Sprint Capacity und Productive Capacity", "D": "Nur Excess Capacity"}, "gebied": 1, "a": "B", "e": "Idle Capacity = Protective + Excess. Productive Capacity gehört nicht zu Idle. C vermischt Sprint (= Protective) mit Productive. D vergisst Protective."}, {"n": 8, "q": "Eine Fabrik erzeugt 8.000 Euro Throughput pro Stunde. Der Bottleneck steht wegen einer vermeidbaren Umrüstung eine Stunde still. Die Maschine kostet 40 Euro pro Stunde. Wie hoch ist der Verlust für das System?", "opts": {"A": "40 Euro", "B": "8.000 Euro", "C": "8.040 Euro", "D": "Nichts, denn die Umrüstung war nötig"}, "gebied": 1, "a": "B", "e": "Eine am Bottleneck verlorene Stunde ist eine für das gesamte System verlorene Stunde: 8.000 Euro Throughput. A ist die Cost-World-Antwort. C zählt doppelt. D übersieht, dass die Umrüstung vermeidbar war."}, {"n": 9, "q": "Was muss laut Dictionary immer mit einem <em>dummy constraint</em> geschehen?", "opts": {"A": "Als Strategic Constraint behalten", "B": "Mit einem Puffer schützen", "C": "Beseitigen", "D": "In den Markt verlagern"}, "gebied": 1, "a": "C", "e": "Das Dictionary: Dummy Constraints müssen immer beseitigt werden, weil sie im Verhältnis zum Rest des Systems billig sind. A ist das Gegenteil. B und D sind keine Maßnahmen für einen Dummy Constraint."}, {"n": 10, "q": "Welche Aussage über <em>protective capacity</em> ist richtig?", "opts": {"A": "Mehr Protective Capacity erfordert größere Puffer", "B": "Protective Capacity ist Verschwendung, die abgebaut werden muss", "C": "Mehr Protective Capacity ermöglicht kleinere Puffer und kürzere Lead Times", "D": "Nur der Constraint braucht Protective Capacity"}, "gebied": 1, "a": "C", "e": "Mehr Protective Capacity bedeutet, dass Non-Constraints schneller aufholen, also kleinere Puffer und kürzere Lead Times. A ist umgekehrt. B ist das traditionelle Missverständnis. D ist falsch; gerade Non-Constraints brauchen Protective Capacity."}]}, {"id": "ch03", "num": 3, "title": "Die Five Focusing Steps und POOGI", "part": 1, "partShort": "Teil 1", "partLong": "TOC Fundamentals Concepts", "gebied": 1, "html": "<h2 id=\"lernziele\">Lernziele</h2>\n<p>Nach diesem Kapitel können Sie:</p>\n<ul>\n<li>Die <em>five focusing steps</em> (fünf Fokussierungsschritte) in der richtigen Reihenfolge nennen und für jeden Schritt erklären, was er umfasst.</li>\n<li>Konkrete Maßnahmen als Identify, Exploit, Subordinate oder Elevate erkennen.</li>\n<li>Erklären, warum Elevate erst nach Exploit und Subordinate kommt.</li>\n<li>Die <em>prerequisite steps</em> und die <em>seven focusing steps</em> einordnen und wissen, für welche Organisationen sie gedacht sind.</li>\n<li>Erklären, was <em>inertia</em> (Trägheit) in Schritt 5 bedeutet und warum die TOC davor warnt.</li>\n<li>Die Verbindung zwischen den Five Focusing Steps, Puffern, der <em>drum</em> (Trommel), dem <em>Pareto principle</em> und <em>policies, measurements and behaviors</em> (PMBs) herstellen.</li>\n</ul>\n<h2 id=\"31-die-five-focusing-steps-auf-einen-blick\">3.1 Die Five Focusing Steps auf einen Blick</h2>\n<p>Die <em>five focusing steps</em> (5FS; fünf Fokussierungsschritte) sind ein systematisches Vorgehen in fünf Schritten, um die Fähigkeit eines Systems, Goal Units zu erzeugen, fortlaufend zu verbessern. Das Dictionary formuliert sie so:</p>\n<table>\n<thead>\n<tr>\n<th>Schritt</th>\n<th>Englisch (wörtlich)</th>\n<th>Deutsch</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>IDENTIFY the system's constraint(s)</td>\n<td>Identifizieren Sie den oder die Constraints des Systems</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Decide how to EXPLOIT the system's constraint(s)</td>\n<td>Entscheiden Sie, wie Sie den oder die Constraints ausschöpfen</td>\n</tr>\n<tr>\n<td>3</td>\n<td>SUBORDINATE everything else to the above decision</td>\n<td>Ordnen Sie alles andere dieser Entscheidung unter</td>\n</tr>\n<tr>\n<td>4</td>\n<td>ELEVATE the system's constraint(s)</td>\n<td>Erweitern Sie die Kapazität des oder der Constraints</td>\n</tr>\n<tr>\n<td>5</td>\n<td>WARNING!!!! If in the previous steps a constraint has been broken, go back to step 1, but do not allow INERTIA to cause a system's constraint</td>\n<td>Wurde ein Constraint durchbrochen, gehen Sie zurück zu Schritt 1, aber lassen Sie die Trägheit nicht zum Constraint werden</td>\n</tr>\n</tbody>\n</table>\n<p>Englischer Kern: \"A systematic five-step approach used to continually improve a system's ability to produce goal units.\"</p>\n<p>Die 5FS sind einer der drei <em>processes of ongoing improvement</em> (POOGI; Prozesse der fortlaufenden Verbesserung) der TOC, neben der Change Question Sequence und dem Buffer Management (siehe Kapitel 1).</p>\n<p>Achten Sie auf den genauen Wortlaut von Schritt 2: nicht \"exploit\", sondern \"<strong>decide how to</strong> exploit\". Es ist ein Entscheidungsschritt. Schritt 3 verweist auf \"the above decision\": die Entscheidung aus Schritt 2. Prüfungen testen solche Details.</p>\n<h2 id=\"32-schritt-1-identify\">3.2 Schritt 1: Identify</h2>\n<p><em>Identify</em> (identifizieren) ist der Prozess, in dem Sie bestimmen, welcher Faktor das Erreichen des Ziels derzeit am stärksten begrenzt. Englischer Kern: \"determining what factor is currently most limiting attainment of the goal.\"</p>\n<p>Wie finden Sie den Constraint in der Praxis?</p>\n<ul>\n<li><strong>Wo staut sich die Arbeit?</strong> Vor einem Bottleneck wächst die Warteschlange (Herbie: Die Jungen vor ihm laufen davon, der Abstand wächst).</li>\n<li><strong>Worum wird am meisten gekämpft?</strong> Um die Ressource, bei der jeder seinem Auftrag Vorrang geben will.</li>\n<li><strong>Wo wird am häufigsten gewartet?</strong> Warten Kunden, weil das Werk nicht liefern kann, liegt der Constraint intern. Wartet das Werk auf Aufträge, ist der Markt der Constraint.</li>\n<li><strong>Belastungsanalyse.</strong> Vergleichen Sie je Ressource die benötigten Stunden (Nachfrage mal Bearbeitungszeit) mit den verfügbaren Stunden. Die Ressource mit dem höchsten Prozentsatz ist der Kandidat.</li>\n</ul>\n<p>Eine Falle: Richtlinien können eine Ressource wie einen Bottleneck aussehen lassen, obwohl sie keiner ist. Das Dictionary nennt Batch-Richtlinien, „Process Batch gleich Transfer Batch“, die Steuerung nach Effizienz und das Monatsend-Syndrom. Solche Ressourcen haben nach Schritt 2 und 3 reichlich Kapazität. Deshalb ist Schritt 1 nie endgültig: Sie identifizieren den Constraint so, wie er <strong>jetzt</strong> ist.</p>\n<p>Beispiel: In einem Softwareunternehmen bleiben alle Projekte in der Testabteilung hängen. Die Testabteilung ist der Kandidat für den Constraint. Bei näherem Hinsehen erhält sie jedoch die gesamte Arbeit am letzten Tag des Sprints (Batch-Richtlinie). Bei gleichmäßiger Zufuhr hat sie genug Kapazität. Der echte Constraint liegt dann möglicherweise anderswo, zum Beispiel im Markt oder bei den Architekten.</p>\n<h2 id=\"33-schritt-2-exploit\">3.3 Schritt 2: Exploit</h2>\n<p><em>Exploit</em> (ausschöpfen) bedeutet bei einem internen Ressourcen-Constraint: mehr Goal Units erzielen durch Maßnahmen, die den Constraint bestmöglich nutzen. Englischer Kern: \"get more goal units by taking actions that make the best use of the constraint.\"</p>\n<p>Das Schlüsselwort lautet <strong>ohne große Investition</strong>. Bei Exploit geht es darum, das Vorhandene klug zu nutzen. Das Dictionary nennt die Maßnahmen aus <em>The Goal</em> an der NCX-10 sowie allgemeine Maßnahmen:</p>\n<table>\n<thead>\n<tr>\n<th>Maßnahme</th>\n<th>Warum sie wirkt</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Den Constraint während Mittagspause, Pausen und Schichtwechsel besetzen</td>\n<td>Jede Stillstandsstunde am Constraint ist ein Verlust für das System</td>\n</tr>\n<tr>\n<td>Qualitätskontrolle <strong>vor</strong> den Constraint legen</td>\n<td>Sonst verschwenden fehlerhafte Teile Constraint-Zeit (Garbage Time)</td>\n</tr>\n<tr>\n<td>Einen Plan (Drum) für den Constraint erstellen</td>\n<td>Der Constraint arbeitet an den richtigen Aufträgen in der richtigen Reihenfolge</td>\n</tr>\n<tr>\n<td>Rüstzeiten am Constraint verkürzen (SMED)</td>\n<td>Mehr produktive Stunden</td>\n</tr>\n<tr>\n<td>Total Productive Maintenance am Constraint</td>\n<td>Weniger Störungen an der Stelle, an der sie am meisten kosten</td>\n</tr>\n<tr>\n<td>Arbeit auf andere Ressourcen oder alte Maschinen verlagern (Offload)</td>\n<td>Nur Arbeit, die wirklich auf den Constraint muss, bleibt dort</td>\n</tr>\n<tr>\n<td>Nur produzieren, was verkauft wird</td>\n<td>Keine Constraint-Zeit für Lagerbestand aufwenden</td>\n</tr>\n<tr>\n<td>Bei einem Market Constraint: ein <em>unrefusable offer</em> (unwiderstehliches Angebot)</td>\n<td>Mehr Aufträge aus dem bestehenden Markt gewinnen</td>\n</tr>\n</tbody>\n</table>\n<p>Beachten Sie, dass „Offload“ (Arbeit vom Constraint wegnehmen) in der Literatur mal unter Exploit und mal unter Elevate eingeordnet wird. Das Dictionary nennt bei <em>elevate</em> das Zurückholen alter Maschinen, die dasselbe können wie die NCX-10. Der Unterschied: Verlagerung auf vorhandene Kapazität ohne Investition ist Exploit; Kapazität hinzufügen (alte Maschinen zurückkaufen, kostenpflichtig auslagern) ist Elevate.</p>\n<h3 id=\"exploit-bei-einem-market-constraint\">Exploit bei einem Market Constraint</h3>\n<p>Ist der Markt der Constraint, bedeutet Exploit: Holen Sie das Maximum aus der bestehenden Nachfrage. Liefern Sie zu 100 Prozent pünktlich, verlieren Sie keinen einzigen Auftrag durch schlechten Service und machen Sie ein Angebot, das der Kunde nicht ablehnen kann (zum Beispiel schnelle und zuverlässige Lieferung). Es ist ein Missverständnis, dass die 5FS nur für Fabriken gelten.</p>\n<h2 id=\"34-schritt-3-subordinate\">3.4 Schritt 3: Subordinate</h2>\n<p><em>Subordinate</em> (unterordnen) ist der dritte Schritt: Ordnen Sie alles andere der Exploit-Entscheidung unter. Das Dictionary bezeichnet die Unterordnung als entscheidend für die volle Ausschöpfung und unterscheidet zwei Komponenten:</p>\n<ol>\n<li>Alle Non-Constraint-Ressourcen werden so gesteuert, dass der Constraint <strong>immer genau das hat, was er braucht, wann er es braucht</strong>.</li>\n<li>Alle Non-Constraint-Ressourcen dürfen <strong>nicht mehr Arbeit verarbeiten, als</strong> für den Constraint <strong>nötig ist</strong>.</li>\n</ol>\n<p>Englischer Kern: \"Subordinate everything else to the above decision.\"</p>\n<p>Komponente 1 betrifft das Versorgen: Der Constraint darf nie ausgehungert (Starvation) oder blockiert werden (Blockage). Komponente 2 betrifft das Bremsen: keine Over Activation, keine Bestandsberge.</p>\n<p>Beispiel aus dem Dictionary: Non-Bottleneck-Ressourcen müssen die lokale Effizienz ignorieren und kleinere Batches fahren, damit der Constraint nicht ausgehungert wird.</p>\n<h3 id=\"warum-subordinate-der-schwierigste-schritt-ist\">Warum Subordinate der schwierigste Schritt ist</h3>\n<p>Schritt 3 berührt Verhalten und Messgrößen. Ein Bediener, der immer nach Output beurteilt wurde, muss jetzt manchmal stillstehen. Ein Verkäufer, der nach Umsatz beurteilt wird, muss manchmal einen Auftrag ablehnen, der den Constraint überlastet. Ein Einkäufer, der nach dem Preis beurteilt wird, muss manchmal teurer einkaufen, damit der Constraint nicht warten muss. Unterordnung verlangt, dass die Organisation den Constraint über die lokale Leistung stellt.</p>\n<h3 id=\"unterordnung-und-puffer\">Unterordnung und Puffer</h3>\n<p>Puffer sind das wichtigste Instrument der Unterordnung. Ein <em>buffer</em> (Puffer) ist ein Schutz gegen Unsicherheit in Form von Zeit, Bestand oder Kapazität. In Drum-Buffer-Rope (Teil 3) schützt ein <em>constraint buffer</em> (ein Zeitpuffer vor dem Constraint) vor dem Aushungern: Material wird so viel früher freigegeben, dass der Constraint immer Arbeit hat, auch wenn irgendwo stromaufwärts etwas schiefgeht. Das <em>rope</em> (Seil) koppelt die Materialfreigabe an das Tempo des Constraints, sodass Non-Constraints nicht mehr verarbeiten als nötig. Beides sind konkrete Formen von \"subordinate everything else\".</p>\n<p>Die <em>protective capacity</em> (Schutzkapazität) auf Non-Constraints (Kapitel 2) ist ebenfalls Unterordnung: Non-Constraints halten Reserven, um den Puffer vor dem Constraint nach einer Störung (Murphy) wieder aufzufüllen.</p>\n<h3 id=\"die-drum\">Die Drum</h3>\n<p>Die <em>drum</em> (Trommel) ist in der Produktion der Plan des Constraints, der „Trommelschlag“ der Organisation. Englischer Kern: \"the schedule of the constraint, the drumbeat of the organization.\" Die Drum ist das Ergebnis von Schritt 2 (Entscheidung, wie der Constraint genutzt wird und in welcher Reihenfolge) und der Ausgangspunkt von Schritt 3 (alles wird auf die Drum abgestimmt). Die <em>drum resource</em> ist die Ressource, die als Drum dient: ein Constraint oder eine CCR. In Simplified Drum-Buffer-Rope ist der Markt die Drum, und eine etwaige CCR wird erst in zweiter Linie beachtet.</p>\n<h2 id=\"35-schritt-4-elevate\">3.5 Schritt 4: Elevate</h2>\n<p><em>Elevate</em> (erweitern) bedeutet: Maßnahmen ergreifen, die weder ausschöpfen noch unterordnen, aber dennoch dazu führen, dass das System mehr Goal Units erzeugt. Diese Maßnahmen erfordern meist Investitionen oder Outsourcing. Englischer Kern: \"actions that... usually require investment or outsourcing.\"</p>\n<p>Beispiele:</p>\n<ul>\n<li>Eine zweite Maschine kaufen.</li>\n<li>Zusätzliches Personal einstellen oder eine zusätzliche Schicht einführen.</li>\n<li>Arbeit an einen Lieferanten auslagern.</li>\n<li>Bei einem Market Constraint: neue Märkte oder Segmente erschließen, ein neues Produkt einführen.</li>\n</ul>\n<p>Das Beispiel aus <em>The Goal</em>: Nach allen Exploit- und Subordinate-Maßnahmen konnte UNICO die Nachfrage immer noch nicht decken. Das Unternehmen holte alte, weniger effiziente Maschinen zurück, die dasselbe konnten wie die NCX-10.</p>\n<h3 id=\"warum-elevate-erst-nach-exploit-und-subordinate\">Warum Elevate erst nach Exploit und Subordinate?</h3>\n<p>Das ist eine klassische Prüfungsfrage. Drei Gründe:</p>\n<ol>\n<li><strong>Exploit und Subordinate kosten wenig und bringen oft viel.</strong> In vielen Unternehmen erweist sich der Constraint nach Schritt 2 und 3 als gar kein Constraint mehr. Mit einer Investition in Schritt 4 würden Sie dann Geld für Kapazität verschwenden, die Sie nicht brauchen.</li>\n<li><strong>Ohne Unterordnung ist Elevate sinnlos.</strong> Können die Non-Constraints die neue Kapazität nicht versorgen, steht auch die teure neue Maschine still.</li>\n<li><strong>Erst nach Exploit wissen Sie, wie stark Sie erweitern müssen.</strong> Die tatsächliche Kapazität des Constraints zeigt sich erst bei optimaler Nutzung.</li>\n</ol>\n<p>Faustregel: Investieren Sie nie in den Constraint, bevor Sie sicher sind, dass Sie ihn bereits maximal nutzen.</p>\n<h2 id=\"36-schritt-5-go-back-und-vorsicht-vor-inertia\">3.6 Schritt 5: Go back, und Vorsicht vor Inertia</h2>\n<p>Wurde der Constraint in den vorigen Schritten durchbrochen (er ist kein Constraint mehr), gehen Sie zurück zu Schritt 1. Es gibt nun einen neuen Constraint. Das kann eine andere Ressource sein oder der Markt.</p>\n<p>Die Warnung: <strong>Lassen Sie die Inertia nicht zum Constraint des Systems werden.</strong> <em>Inertia</em> (Trägheit) bedeutet hier, dass Regeln, Richtlinien und Verhaltensweisen, die zur Steuerung des alten Constraints eingeführt wurden, weiterbestehen, nachdem dieser Constraint verschwunden ist. Diese alten Regeln begrenzen dann die neue Situation.</p>\n<p>Beispiel: Als der Wärmebehandlungsofen der Constraint war, galt die Regel „große Batches in den Ofen“. Jetzt, da der Ofen reichlich Kapazität hat, schaden große Batches nur noch: Sie verlängern die Lead Time und lassen den neuen Constraint warten. Zieht niemand die Regel zurück, wird die Regel selbst zur Beschränkung.</p>\n<p>Das Dictionary beschreibt Inertia auch als <em>engine of disharmony</em> (einen Prozess, der dem Ziel entgegenwirkt): Viele Menschen führen Aufgaben aus, für die es keinen Grund mehr gibt.</p>\n<p>Schritt 5 macht die 5FS zu einem Kreislauf: einem POOGI. Ohne Schritt 5 ist es ein einmaliges Projekt.</p>\n<p class=\"diagram\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA1wAAADFCAIAAADPBmSFAABOfUlEQVR4nO3dd0AUx/8//rnCHb2JdEUEG6Jirxh7QVGiWKIiImp8G0vUqLGLLZZojBq7otgRFUEFUSyIKIKC2CgRQUDp7ejXfn/ML/vZ7x0QC03zfPx1tzs7O3c3t/e62SkcuVxOAAAAAOC/jVvfBQAAAACA+oegEAAAAAAQFAIAAAAAgkIAAAAAIAgKAQAAAIAgKAQAAAAAQgif/aS8vDwlJaWkpKS+SgOfQV1dvUmTJkKhsMZzRn34GqE+ABvqA7ChPgCbcn34/4PCmJiYP/744+7duxUVFfVUNvh8AoGgf//+CxcubNeuXY1kiPrwVUN9ADbUB2BDfQA2hfrAkcvlx44dW7dunZWV1eTJk21tbdXV1eu7kPAJSkpKnj9/fvr06cTERA8PDzc3ty/MEPXhq4b6AGyoD8CG+gBsldQHX19fMzOztWvXSiQSOXy1xGLx2rVrzczMrly58iX5oD58G1AfgA31AdhQH4CNXR847du379Wr1/79++s7YIUaMHv27EePHj148EBDQ+MzDi8qKurduzfqwzcD9QHYUB+ADfUB2Gh94Obm5q AAAACCoBAAAAAACIJCAAAAACAICgEAAACAICgEAAAAAIKgEAAAAAAIgkIAAAAAIAgKAQAAAIAgKAQAAAAAgqAQAAAAAAiCQgAAAAAgCAoBAAAAgCAoBAAAAACCoBAAAAAACIJCAAAAACAICgEAAACAICgEAAAAAIKgEAAAAAAIgkIAAAAAIAgKAQAAAIAgKAQAAAAAgqAQAAAAAAiCQgAAAAAghPx/T1y+zaxSjyIAAAAASUVORK5CYII=\" alt=\"Kreislauf der fünf Schritte: Identify, Exploit, Subordinate, Elevate. Ist der Constraint durchbrochen, führt Schritt 5 zurück zu Schritt 1, mit Warnung vor Inertia.\"></p>\n\n<h2 id=\"37-prerequisite-steps-und-die-seven-focusing-steps\">3.7 Prerequisite Steps und die Seven Focusing Steps</h2>\n<p>Die 5FS setzen voraus, dass Sie wissen, was „das System“ und „das Ziel“ sind. In der Praxis ist das nicht immer so. Deshalb kennt die TOC <em>prerequisite steps</em> (vorbereitende Schritte):</p>\n<ol>\n<li>Definieren Sie das System und seine Grenzen.</li>\n<li>Definieren Sie das Ziel des Systems.</li>\n<li>Definieren Sie die Messgrößen, mit denen Sie feststellen, ob das System dem Ziel näherkommt.</li>\n</ol>\n<p>Das Dictionary formalisiert dies als <em>seven focusing steps</em>: die fünf ursprünglichen Schritte plus zwei Schritte davor:</p>\n<table>\n<thead>\n<tr>\n<th>Schritt</th>\n<th>Inhalt</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>State the goal of the organization (das Ziel formulieren)</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Define global performance measures (die globalen Leistungskennzahlen definieren)</td>\n</tr>\n<tr>\n<td>3-7</td>\n<td>Identify, exploit, subordinate, elevate, go back</td>\n</tr>\n</tbody>\n</table>\n<p>Englischer Kern: \"the original five focusing steps plus two additional steps inserted at the beginning.\"</p>\n<p>Das Dictionary sagt ausdrücklich, für wen dies gedacht ist: <strong>Not-for-Profit- und staatliche Organisationen</strong>, bei denen das Ziel nicht im Geldverdienen besteht und daher zuerst eine klare Definition des Throughput in Goal Units nötig ist, um ein globales Messsystem aufzubauen. Für ein kommerzielles Unternehmen sind Ziel und Messgrößen (T, I, OE) bereits bekannt, und die fünf Schritte genügen.</p>\n<h2 id=\"38-pareto-principle-und-fokus\">3.8 Pareto Principle und Fokus</h2>\n<p>Das <em>Pareto principle</em> (Pareto-Prinzip) besagt, dass bei vielen Phänomenen etwa 80 Prozent der Wirkungen aus 20 Prozent der Ursachen entstehen. Englischer Kern: \"approximately 80% of the effects result from 20% of the causes.\"</p>\n<p>Goldratt ging weiter. Das Dictionary zitiert seinen Standpunkt: Pareto gilt für <strong>unabhängige</strong> Elemente. In den meisten Systemen besteht jedoch Abhängigkeit. Bei abhängigen Elementen ist das Verhältnis viel extremer als 80/20: Beispielsweise verursachen 0,1 Prozent der Elemente 99,9 Prozent der Wirkungen.</p>\n<p>Das ist die Rechtfertigung für die 5FS. Bestimmt ein einziger Constraint nahezu den gesamten Output, ist der Fokus auf diesen einen Constraint nicht bloß „effizient“, sondern der einzige Ansatz, der funktioniert. Verbesserungsprogramme, die überall zugleich verbessern (klassisches TQM, Kaizen ohne Fokus), verteilen die Anstrengung auf die 99,9 Prozent, auf die es nicht ankommt.</p>\n<h2 id=\"39-policies-measurements-and-behaviors-pmbs\">3.9 Policies, Measurements and Behaviors (PMBs)</h2>\n<p>Warum verhalten sich Menschen so, wie sie es tun? Das Dictionary beschreibt <em>policies, measurements and behaviors</em> (PMBs; Richtlinien, Messgrößen und Verhalten) als eine Folge von drei Elementen, die die Ursache-Wirkungs-Beziehung zwischen einer Richtlinie, der zugehörigen Messgröße und dem daraus entstehenden Verhalten dokumentiert.</p>\n<p class=\"diagram\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAqgAAAEbCAIAAACZbOFNAABu20lEQVR4nO3ddVxUafs4/nuK7lRQAcVCVxAVlDJAsbsVV10RFWvFWtdaY8NODFxRQlBRDFAUUEEEEaRTke4YYgaYPr8/7u9zfuczhOw+rrjPXO8/eM2cOXGdvM4d50AjCAIBAAAAQDbQuzsAAAAAAHw9kPgBAAAAGQKJHwAAAJAhkPgBAAAAGQKJHwAAAJAhkPgBAAAAGcLs7gD+NfLy8nJzc+vr67s7EAAAAP+HpqbmwIEDTU1NuzuQfwdI/J/3+vXrw4cPZ2ZmdncgAAAAOjRkyJB9+/bZ29t3dyDfOhq8wKdzXl5ehw4dsra2dnNzGzVqlIaGRndHBAAA4P9oaGhISEi4dOlSQkLC/v . Die unerwünschten Effekte: zu viel Umlaufbestand und Fertigware, verwässerte Prioritäten, schlechte Liefertreue, niedrige Liquidität.</p>\n<p>PMBs sind aus zwei Gründen wichtig für die 5FS:</p>\n<ul>\n<li><strong>Subordinate (Schritt 3) scheitert, wenn sich die PMBs nicht ändern.</strong> Sie können Bediener nicht bitten stillzustehen, wenn sie an der Effizienz gemessen werden. \"Tell me how you measure me and I will tell you how I will behave\" ist ein bekannter Ausspruch von Goldratt.</li>\n<li><strong>Inertia (Schritt 5) ist oft ein PMB, das fortbesteht.</strong> Der alte Constraint ist weg, aber die zugehörige Richtlinie und Messgröße steuern weiterhin das Verhalten.</li>\n</ul>\n<p>Beim Aufbau eines Current Reality Tree (Teil 2) werden PMB-Folgen ausdrücklich festgehalten, weil sie oft die Quelle mehrerer unerwünschter Effekte sind.</p>\n<h2 id=\"310-mini-fall-die-fahrradfabrik\">3.10 Mini-Fall: die Fahrradfabrik</h2>\n<p>Die Fahrradfabrik Velo stellt 400 Fahrräder pro Woche her; der Markt verlangt 500. Die Lackierstraße schafft 400 Rahmen pro Woche. Alle anderen Abteilungen schaffen 550 oder mehr.</p>\n<p><strong>Schritt 1, Identify.</strong> Vor der Lackierstraße stehen Regale voller Rahmen. Die Lackierstraße ist der Constraint (Bottleneck: Kapazität 400 &lt; Nachfrage 500).</p>\n<p><strong>Schritt 2, Exploit.</strong> Analyse der Lackierstraße:\n- Die Lackierstraße steht jeden Tag 45 Minuten beim Schichtwechsel und 30 Minuten in der Mittagspause still. Durchgehende Besetzung: +8 Prozent Kapazität.\n- 5 Prozent der lackierten Rahmen werden wegen Schweißfehlern ausgesondert, die schon vor dem Lackieren sichtbar waren. Schweißkontrolle vor der Lackierstraße: +5 Prozent.\n- Die Lackierstraße lackiert auch Rahmen für ein günstiges Modell, das auf Lager gefertigt wird und sich schlecht verkauft. Nur noch auf Auftrag lackieren: +4 Prozent.\nErgebnis: etwa 470 Rahmen pro Woche, ohne Investition.</p>\n<p><strong>Schritt 3, Subordinate.</strong> Das Schweißteam wird nicht mehr nach Output beurteilt, sondern danach, ob es pünktlich und fehlerfrei genau die Rahmen liefert, die die Lackierstraße braucht. Die Materialfreigabe wird an den Lackierplan gekoppelt (Rope). Vor der Lackierstraße wird ein Puffer von zwei Tagen Arbeit gehalten. Die Schweißerei hält Reserven (Protective Capacity), um nach einer Störung schnell aufzuholen.</p>\n<p><strong>Schritt 4, Elevate.</strong> Es fehlen noch 30 Fahrräder pro Woche. Erst jetzt wird investiert: ein zweiter Trockenofen in der Lackierstraße, wodurch die Kapazität auf 560 steigt.</p>\n<p><strong>Schritt 5, Go back.</strong> Die Lackierstraße (560) hat nun mehr Kapazität als der Markt (500). Der Markt ist der neue Constraint. Der Vertrieb muss nun den Constraint ausschöpfen. Und die alte Regel „große Lack-Batches je Farbe“ muss zurückgezogen werden, sonst verursacht die Inertia lange Lead Times, die Kunden vertreiben.</p>\n<h2 id=\"prufungsfallen\">Prüfungsfallen</h2>\n<ul>\n<li><strong>Reihenfolge.</strong> Identify, Exploit, Subordinate, Elevate, Go back. Eine Antwortoption mit Elevate vor Exploit ist falsch.</li>\n<li><strong>\"Decide how to exploit\".</strong> Schritt 2 ist eine Entscheidung; Schritt 3 ordnet sich \"the above decision\" unter. Die Prüfung kann wörtlich zitieren.</li>\n<li><strong>Exploit versus Elevate.</strong> Exploit: besser nutzen ohne wesentliche Investition. Elevate: Kapazität hinzufügen, meist mit Investition oder Outsourcing. Qualitätskontrolle vor dem Constraint ist Exploit; eine zweite Maschine kaufen ist Elevate.</li>\n<li><strong>Subordinate hat zwei Seiten.</strong> Versorgen (dem Constraint darf nichts fehlen) und Bremsen (nicht mehr produzieren, als der Constraint braucht).</li>\n<li><strong>Inertia</strong> ist keine Faulheit, sondern das Fortbestehen von Regeln für einen Constraint, den es nicht mehr gibt.</li>\n<li><strong>Seven Focusing Steps</strong> sind die 5FS plus vorab \"state the goal\" und \"define global measures\", gedacht für Non-Profit und öffentliche Hand.</li>\n<li><strong>Pareto.</strong> Goldratt stellt fest, dass 80/20 für unabhängige Elemente gilt; bei Abhängigkeit ist das Verhältnis viel extremer (zum Beispiel 0,1/99,9).</li>\n<li><strong>PMB-Reihenfolge.</strong> Policy führt zu Measurement, Measurement zu Behavior. Nicht umgekehrt.</li>\n</ul>\n<h2 id=\"zusammenfassung\">Zusammenfassung</h2>\n<ul>\n<li>Die Five Focusing Steps: 1 identify, 2 decide how to exploit, 3 subordinate everything else to that decision, 4 elevate, 5 if the constraint is broken go back to step 1 but don't let inertia become the constraint.</li>\n<li>Die 5FS sind einer der drei POOGIs der TOC.</li>\n<li>Identify: Bestimmen Sie, was das Ziel derzeit am stärksten begrenzt; achten Sie auf Richtlinien, die eine Ressource zu Unrecht als Bottleneck erscheinen lassen.</li>\n<li>Exploit: Holen Sie das Maximum aus dem Constraint ohne große Investition (Besetzung in den Pausen, Qualitätskontrolle davor, Drum-Plan, Rüstzeit, TPM, nur auf Auftrag, Unrefusable Offer bei einem Market Constraint).</li>\n<li>Subordinate: Non-Constraints geben dem Constraint genau das, was er braucht, und tun nicht mehr als das; Puffer, Rope und Protective Capacity sind die Instrumente.</li>\n<li>Die Drum ist der Plan des Constraints, Ergebnis von Exploit und Grundlage für Subordinate.</li>\n<li>Elevate: Kapazität hinzufügen, meist mit Investition; erst nach Exploit und Subordinate, weil diese oft schon ausreichen und Sie sonst in ungenutzte Kapazität investieren.</li>\n<li>Schritt 5 macht die 5FS zu einem Kreislauf; die Inertia (alte Regeln, die fortbestehen) ist die Gefahr.</li>\n<li>Prerequisite Steps: Definieren Sie System, Ziel und Messgrößen; die Seven Focusing Steps ergänzen \"state the goal\" und \"define global measures\", vor allem für Non-Profit und öffentliche Hand.</li>\n<li>Pareto: 80/20 bei unabhängigen Elementen; bei Abhängigkeit viel extremer, was den Fokus auf einen Constraint rechtfertigt.</li>\n<li>PMBs: Richtlinien führen zu Messgrößen, Messgrößen zu Verhalten; Unterordnung und das Vermeiden von Inertia erfordern die Anpassung der PMBs.</li>\n</ul>", "q": [{"n": 1, "q": "Was ist die richtige Reihenfolge der Five Focusing Steps?", "opts": {"A": "Identify, elevate, exploit, subordinate, go back", "B": "Identify, exploit, subordinate, elevate, go back", "C": "Exploit, identify, subordinate, elevate, go back", "D": "Identify, subordinate, exploit, elevate, go back"}, "gebied": 1, "a": "B", "e": "Identify, Exploit, Subordinate, Elevate, Go back ist die Reihenfolge aus dem Dictionary. A, C und D vertauschen Schritte."}, {"n": 2, "q": "Ein Werk legt die Qualitätsprüfung direkt vor den Bottleneck, sodass fehlerhafte Teile keine Bottleneck-Zeit mehr verbrauchen. Dies ist ein Beispiel für:", "opts": {"A": "Identify", "B": "Exploit", "C": "Elevate", "D": "Inertia"}, "gebied": 1, "a": "B", "e": "Qualitätskontrolle vor dem Constraint verhindert Garbage Time und holt ohne Investition mehr aus dem bestehenden Constraint: Exploit. A ist das Finden des Constraints. C erfordert eine Kapazitätserweiterung. D ist die Gefahr aus Schritt 5."}, {"n": 3, "q": "Warum kommt <em>elevate</em> erst nach <em>exploit</em> und <em>subordinate</em>?", "opts": {"A": "Weil Elevate nach Subordinate gesetzlich vorgeschrieben ist", "B": "Weil Exploit und Subordinate oft schon ausreichen und Sie sonst in Kapazität investieren, die Sie nicht brauchen", "C": "Weil Elevate nur auf den Markt angewendet werden kann", "D": "Weil Subordinate erst nach einer Investition möglich ist"}, "gebied": 1, "a": "B", "e": "Exploit und Subordinate sind günstig und reichen oft schon aus; eine Investition davor führt zu ungenutzter Kapazität. A, C und D sind erfunden."}, {"n": 4, "q": "Welche zwei Komponenten hat <em>subordinate</em> laut Dictionary?", "opts": {"A": "Kosten senken und Effizienz steigern", "B": "Dem Constraint immer genau das geben, was er braucht, und Non-Constraints nicht mehr tun lassen, als der Constraint braucht", "C": "Den Constraint ersetzen und den Markt erweitern", "D": "Puffer entfernen und Batches vergrößern"}, "gebied": 1, "a": "B", "e": "Das sind die zwei Komponenten aus dem Dictionary: Versorgen und Bremsen. A ist Cost-World-Denken. C und D sind keine Unterordnung; D ist sogar das Gegenteil."}, {"n": 5, "q": "Was bedeutet die Warnung in Schritt 5: \"do not allow inertia to cause a system's constraint\"?", "opts": {"A": "Mitarbeitende müssen nach einer Verbesserung härter arbeiten", "B": "Regeln und Messgrößen, die zum alten Constraint gehörten, können die neue Situation begrenzen, wenn sie nicht angepasst werden", "C": "Der Constraint darf nie verlagert werden", "D": "Investitionen in den alten Constraint müssen sich amortisieren"}, "gebied": 1, "a": "B", "e": "Inertia ist das Fortbestehen von Regeln und Messgrößen, die zu einem verschwundenen Constraint gehörten. A verwechselt Inertia mit Einsatz. C ist falsch; der Constraint verlagert sich im Gegenteil. D ist kein TOC-Prinzip."}, {"n": 6, "q": "Für welchen Organisationstyp sind die <em>seven focusing steps</em> laut Dictionary vor allem gedacht?", "opts": {"A": "Börsennotierte Produktionsunternehmen", "B": "Not-for-Profit- und staatliche Organisationen", "C": "Projektorganisationen", "D": "Distributionsunternehmen"}, "gebied": 1, "a": "B", "e": "Das Dictionary nennt ausdrücklich Not-for-Profit und Government, weil dort das Ziel nicht Geld ist und der Throughput in Goal Units erst definiert werden muss. A, C und D sagt das Dictionary nicht."}, {"n": 7, "q": "Welche zwei Schritte werden bei den Seven Focusing Steps vor die Five Focusing Steps gesetzt?", "opts": {"A": "Define the buffer; define the rope", "B": "State the goal; define global performance measures", "C": "Identify the market; identify the drum", "D": "Exploit the constraint; elevate the constraint"}, "gebied": 1, "a": "B", "e": "State the goal und define global performance measures. A und C sind DBR-Begriffe. D sind bestehende Schritte."}, {"n": 8, "q": "Was sagt Goldratt laut Dictionary über das <em>Pareto principle</em>?", "opts": {"A": "Es gilt in allen Situationen exakt als 80/20", "B": "Es gilt für unabhängige Elemente; bei Abhängigkeit ist das Verhältnis viel extremer", "C": "Es ist auf die TOC nicht anwendbar", "D": "Es gilt nur für die Bestandsführung"}, "gebied": 1, "a": "B", "e": "Goldratt: Pareto gilt für unabhängige Elemente; bei Abhängigkeit können 0,1 Prozent der Elemente 99,9 Prozent der Wirkungen verursachen. A, C und D sind falsch."}, {"n": 9, "q": "Eine Richtlinie „alle beschäftigt halten“ führt zur Messgröße „lokale Effizienz“ und zum Verhalten „Arbeit zu früh freigeben“. Wie nennt das Dictionary diese Folge?", "opts": {"A": "Five focusing steps", "B": "Policies, measurements and behaviors (PMBs)", "C": "Engines of harmony", "D": "Dependent events"}, "gebied": 1, "a": "B", "e": "Policy, Measurement, Behavior: genau die PMB-Folge aus dem Dictionary. A ist der Verbesserungsprozess. C ist das Gegenteil (Engines of Harmony unterstützen das Ziel). D betrifft abhängige Ereignisse."}, {"n": 10, "q": "Ein Unternehmen kauft eine zweite Maschine für den Constraint-Arbeitsgang, nachdem sich Exploit und Subordinate als unzureichend erwiesen haben. Welcher Schritt ist das?", "opts": {"A": "Exploit", "B": "Subordinate", "C": "Elevate", "D": "Identify"}, "gebied": 1, "a": "C", "e": "Kapazität mit Investition hinzuzufügen ist Elevate. A und B sind die günstigen Schritte davor. D ist das Finden des Constraints."}]}];

<script>
(function(){
const $ = s => document.querySelector(s);
const main = $('#main'), title = $('#title'), back = $('#back'), bnav = $('#bnav'), timerEl = $('#timer');
const store = {
  get(k, d){ try { const v = localStorage.getItem('tocfc.'+k); return v===null? d : JSON.parse(v);} catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem('tocfc.'+k, JSON.stringify(v)); } catch(e){} }
};
const CH = Object.fromEntries(DATA.map(c=>[c.id,c]));
const PARTS = [];
DATA.forEach(c=>{ let p = PARTS.find(x=>x.idx===c.part); if(!p){p={idx:c.part,short:c.partShort,long:c.partLong,ch:[]};PARTS.push(p);} p.ch.push(c); });
const GEB_NAMES = T.areaNames;
for(const l of T.langs){ const a = document.createElement('a'); a.className = 'langbtn'; a.href = l.href; a.textContent = l.label; a.lang = l.code; $('#langs').appendChild(a); }

// font size
let fs = store.get('fs', 17);
const applyFs = ()=>document.documentElement.style.setProperty('--fs', fs+'px');
applyFs();
$('#fontBtn').onclick = ()=>{ fs = fs>=21 ? 15 : fs+2; store.set('fs', fs); applyFs(); };

// router
let state = { view:'home' };
let timerId = null;
function go(s){ state = s; history.pushState(s, ''); render(); window.scrollTo(0,0); }
window.onpopstate = e => { if(e.state){ state = e.state; render(); } else { state={view:'home'}; render(); } };
$('#homeBtn').onclick = ()=>go({view:'home'});
back.onclick = ()=>history.length>1 ? history.back() : go({view:'home'});

function esc(s){ return s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } timerEl.classList.add('hidden'); }

  bnav.classList.add('hidden'); bnav.innerHTML='';
  back.classList.toggle('hidden', state.view==='home');
  ({home, chapter, quiz, result}[state.view] || home)();
}

function bestOf(id){ return store.get('best.'+id, null); }

function home(){

  const allQ = DATA.filter(c=>c.gebied).reduce((n,c)=>n+c.q.length,0);
  const done = DATA.filter(c=>store.get('read.'+c.id,false)).length;
  const hasExam = !!CH['ch15'];
  let h = T.trial ? buyCard() : '';

    <div class="grid2" style="margin-top:12px">

    </div>
    <p class="small muted" style="margin:10px 0 0">${fmt(T.homeNote,{q:allQ})}</p>

  for(const p of PARTS){
    h += `<div class="card"><h2>${p.short} · ${p.long}</h2>`;

      h += `<div class="row" data-ch="${c.id}"><div class="n">${c.num}</div><div class="t"><b>${esc(c.title)}</b><small>${read?T.read:T.unread}${c.q.length?' · '+c.q.length+' '+T.questions:''}</small></div>${sc}</div>`;
    }

  }

    }
    h += `</div>` + buyCard();
  }
  main.innerHTML = h;
  main.querySelectorAll('.row:not(.locked)').forEach(r=>r.onclick=()=>go({view:'chapter', id:r.dataset.ch}));
  main.querySelectorAll('.row.locked').forEach(r=>r.onclick=()=>window.open(T.trial.buyUrl,'_blank','noopener'));

function mixSetup(){
  title.textContent = T.mix;
  back.classList.remove('hidden');
  main.innerHTML = `<div class="card"><h2>${T.chooseArea}</h2>
    ${[1,2,3].map(g=>`<label class="chk"><input type="checkbox" class="g" value="${g}" checked> ${T.area} ${g} · ${T.areaNames[g]} (${T.areaRanges[g]})</label>`).join('')}
    <h2 style="margin-top:14px">${T.numQuestions}</h2>
    <div class="grid2"><button class="btn sec" data-n="10">10</button><button class="btn sec" data-n="20">20</button><button class="btn sec" data-n="40">40</button><button class="btn sec" data-n="999">${T.all}</button></div>
    <label class="chk" style="margin-top:12px"><input type="checkbox" id="onlyWrong"> ${T.onlyWrong}</label>
  </div>`;
  main.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{
    const gs = [...main.querySelectorAll('.g:checked')].map(x=>+x.value);
    const wrong = store.get('wrong', {});
    let pool = [];
    DATA.filter(c=>c.gebied && gs.includes(c.gebied)).forEach(c=>c.q.forEach(q=>pool.push({...q, ch:c.id, chTitle:c.title, key:c.id+':'+q.n})));
    if($('#onlyWrong').checked) pool = pool.filter(q=>wrong[q.key]);
    if(!pool.length){ alert(T.noQuestions); return; }
    shuffle(pool);
    pool = pool.slice(0, +b.dataset.n);
    go({view:'quiz', mode:'mix', qs:pool, i:0, ans:{}, label:fmt(T.mixLabel,{n:pool.length})});
  });
}

function examSetup(){
  const c = CH['ch15'];
  title.textContent = T.exam;
  back.classList.remove('hidden');
  const b = bestOf('ch15');
  main.innerHTML = `<div class="card content">${c.html}</div>
    <div class="card"><h2>${T.settings}</h2>
    <label class="chk"><input type="checkbox" id="exFeedback"> ${T.directFeedback}</label>
    <label class="chk"><input type="checkbox" id="exTimer" checked> ${T.showTimer}</label>
    ${b!==null?`<p class="small muted">${T.bestSoFar} <b>${b}%</b></p>`:''}
    <button class="btn block" id="startEx">${T.startExam}</button></div>`;
  $('#startEx').onclick = ()=>{
    const qs = c.q.map(q=>({...q, ch:'ch15', key:'ch15:'+q.n}));
    go({view:'quiz', mode:'exam', qs, i:0, ans:{}, label:T.exam, feedback:$('#exFeedback').checked, timer:$('#exTimer').checked, start:Date.now()});
  };
}

function chapter(){
  const c = CH[state.id];
  title.textContent = T.chAbbr+c.num+' · '+c.title;
  store.set('read.'+c.id, true);
  if(c.id==='ch15'){ examSetup(); return; }
  const qbtn = c.q.length ? `<button class="btn block" id="startQ">${T.practiceBtn} (${c.q.length}) →</button>` : '';
  const search = c.id==='ch16' ? `<input class="search sans" id="srch" placeholder="${T.searchTerm}">` : '';
  const tail = (T.trial && DATA.indexOf(c)===DATA.length-1) ? buyCard() : '';
  main.innerHTML = `${search}<div class="card content" id="cnt"><h1>${T.chapterWord} ${c.num}. ${esc(c.title)}</h1>${c.html}</div>${qbtn}${tail}`;
  if(c.q.length){
    $('#startQ').onclick = startChapterQuiz;
    bnav.classList.remove('hidden');
    bnav.innerHTML = `<button class="btn sec" id="prevCh">‹ ${T.prev}</button><button class="btn" id="quizNav">${T.practiceBtn}</button><button class="btn sec" id="nextCh">${T.next} ›</button>`;
    $('#quizNav').onclick = startChapterQuiz;
  } else {
    bnav.classList.remove('hidden');
    bnav.innerHTML = `<button class="btn sec" id="prevCh">‹ ${T.prev}</button><button class="btn sec" id="nextCh">${T.next} ›</button>`;
  }
  const idx = DATA.indexOf(c);
  $('#prevCh').disabled = idx===0; $('#nextCh').disabled = idx===DATA.length-1;
  $('#prevCh').onclick = ()=>go({view:'chapter', id:DATA[idx-1].id});
  $('#nextCh').onclick = ()=>go({view:'chapter', id:DATA[idx+1].id});
  function startChapterQuiz(){
    const qs = c.q.map(q=>({...q, ch:c.id, key:c.id+':'+q.n}));
    go({view:'quiz', mode:'chapter', id:c.id, qs, i:0, ans:{}, label:T.chAbbr+c.num+' · '+T.practiceBtn, feedback:true});
  }
  if(c.id==='ch16'){
    const cnt = $('#cnt');
    const items = [...cnt.querySelectorAll('p, li')];
    $('#srch').oninput = e=>{
      const v = e.target.value.trim().toLowerCase();
      items.forEach(el=>el.classList.toggle('hidden', v.length>1 && !el.textContent.toLowerCase().includes(v)));
      cnt.querySelectorAll('h2').forEach(h=>h.classList.toggle('hidden', v.length>1));
    };
  }
}

function quiz(){
  const st = state, q = st.qs[st.i], n = st.qs.length;
  const feedback = st.mode==='exam' ? !!st.feedback : true;
  title.textContent = `${st.label}  ${st.i+1}/${n}`;
  if(st.mode==='exam' && st.timer){
    timerEl.classList.remove('hidden');
    const tick = ()=>{ const left = 150*60*1000 - (Date.now()-st.start); const s = Math.max(0,Math.floor(left/1000)); timerEl.textContent = `${Math.floor(s/3600)}:${String(Math.floor(s%3600/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; if(left<=0){ stopTimer(); finish(); } };
    tick(); timerId = setInterval(tick, 1000);
  }
  const given = st.ans[st.i];
  const src = st.mode==='mix' ? `<span class="pill">${esc(CH[q.ch].title)}</span>` : (q.gebied && st.mode==='exam' ? `<span class="pill">${T.area} ${q.gebied}</span>`:'');
  let h = `<div class="prog"><i style="width:${Math.round(st.i/n*100)}%"></i></div>
    <div class="card"><p class="q"><span class="nr">${src}${fmt(T.questionOf,{i:st.i+1,n})}</span>${q.q}</p>`;
  for(const k of Object.keys(q.opts)){
    let cls = 'opt';
    if(given!==undefined){
      if(feedback){ if(k===q.a) cls+=' ok'; else if(k===given) cls+=' bad'; }
      else if(k===given) cls+=' sel';
    }
    h += `<button class="${cls}" data-k="${k}" ${given!==undefined && feedback?'disabled':''}><b>${k}</b><span>${q.opts[k]}</span></button>`;
  }
  if(given!==undefined && feedback){
    const ok = given===q.a;
    h += `<div class="expl ${ok?'ok':'bad'}"><span class="v">${ok?T.correct:T.wrongIs+q.a}</span>${q.e}</div>`;
  }
  h += `</div>`;
  main.innerHTML = h;
  main.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(feedback && st.ans[st.i]!==undefined) return;
    st.ans[st.i] = b.dataset.k;
    const wrong = store.get('wrong', {});
    if(b.dataset.k===q.a) delete wrong[q.key]; else wrong[q.key]=1;
    store.set('wrong', wrong);
    history.replaceState(st,'');
    if(feedback) render(); else next();
  });
  bnav.classList.remove('hidden');
  const answered = Object.keys(st.ans).length;
  bnav.innerHTML = `<button class="btn sec" id="pq" ${st.i===0?'disabled':''}>‹</button>
    ${st.i<n-1 ? `<button class="btn" id="nq">${T.next} ›</button>` : `<button class="btn" id="fin">${T.finish} (${answered}/${n})</button>`}
    ${st.mode==='exam' && st.i<n-1 ? `<button class="btn sec" id="fin2">${T.stop}</button>`:''}`;
  $('#pq').onclick = ()=>{ st.i--; history.replaceState(st,''); render(); window.scrollTo(0,0); };
  const nq = $('#nq'); if(nq) nq.onclick = next;
  const f = $('#fin'); if(f) f.onclick = finish;
  const f2 = $('#fin2'); if(f2) f2.onclick = ()=>{ if(confirm(T.confirmFinish)) finish(); };
  function next(){ if(st.i<n-1){ st.i++; history.replaceState(st,''); render(); window.scrollTo(0,0);} else finish(); }
  function finish(){
    stopTimer();
    let correct = 0; const perG = {};
    st.qs.forEach((qq,i)=>{ const g = qq.gebied||0; perG[g] = perG[g]||{c:0,n:0}; perG[g].n++; if(st.ans[i]===qq.a){ correct++; perG[g].c++; } });
    const pct = Math.round(correct/n*100);
    const bestKey = st.mode==='chapter' ? st.id : (st.mode==='exam' ? 'ch15' : null);
    if(bestKey){ const b = bestOf(bestKey); if(b===null || pct>b) store.set('best.'+bestKey, pct); }
    go({view:'result', qs:st.qs, ans:st.ans, correct, pct, perG, mode:st.mode, id:st.id, label:st.label, feedback:st.feedback});
  }
}

function result(){
  const st = state, n = st.qs.length;
  title.textContent = T.result;
  let h = `<div class="card score"><div class="big ${zone(st.pct)}">${st.pct}%</div><div class="sub">${fmt(T.ofCorrect,{c:st.correct,n})} · ${st.pct>=80?T.msg80:st.pct>=70?T.msg70:T.msgLow}</div>`;
  if(st.mode==='exam'){
    h += `<table style="width:100%;font-size:.95em;border-collapse:collapse"><tr><th style="text-align:left">${T.colArea}</th><th>${T.colCorrect}</th><th>${T.colRepeat}</th></tr>`;
    for(const g of [1,2,3]){ const p = st.perG[g]; if(!p) continue; h += `<tr><td style="text-align:left">${g} · ${GEB_NAMES[g]}</td><td>${p.c}/${p.n}</td><td>${p.c/p.n<0.8?T.areaRanges[g]:'–'}</td></tr>`; }
    h += `</table>`;
  }
  h += `<div class="grid2" style="margin-top:14px"><button class="btn" id="again">${T.again}</button><button class="btn sec" id="wrongOnly">${T.wrongOnly}</button></div></div>`;
  h += `<div class="card"><h2>${T.overview}</h2>`;
  st.qs.forEach((q,i)=>{
    const g = st.ans[i], ok = g===q.a;
    h += `<div style="padding:10px 0;border-top:1px solid var(--line)"><div class="small muted">${fmt(T.questionOf,{i:i+1,n})} · ${ok?'<span style="color:var(--ok)">'+T.good+'</span>':(g===undefined?T.unanswered:'<span style="color:var(--bad)">'+T.wrong+' ('+g+')</span>')} · ${T.right}: ${q.a}</div><div>${q.q}</div><div class="small" style="margin-top:4px"><b>${q.a}.</b> ${q.opts[q.a]}</div><div class="small muted" style="margin-top:4px">${q.e}</div></div>`;
  });
  h += `</div>`;
  main.innerHTML = h;
  $('#again').onclick = ()=>go({view:'quiz', mode:st.mode, id:st.id, qs:shuffle([...st.qs]), i:0, ans:{}, label:st.label, feedback:st.feedback, timer:false, start:Date.now()});
  $('#wrongOnly').onclick = ()=>{
    const qs = st.qs.filter((q,i)=>st.ans[i]!==q.a);
    if(!qs.length){ alert(T.noWrong); return; }
    go({view:'quiz', mode:st.mode==='exam'?'mix':st.mode, id:st.id, qs, i:0, ans:{}, label:fmt(T.retake,{n:qs.length}), feedback:true});
  };
}

function zone(p){ return p>=80?'g':p>=60?'y':'r'; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

history.replaceState(state,'');
render();
})();
</script>
</body>
</html>
