<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TOC Fundamentals Kurs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
:root{
  --bg:#f6f4ee; --card:#ffffff; --ink:#1d1d1b; --muted:#6b6b66; --line:#dcd9d0;
  --accent:#1b4d89; --accent-ink:#ffffff; --gold:#c99a2e;
  --ok:#2e7d4f; --ok-bg:#e3f3e8; --bad:#b3362b; --bad-bg:#fbe6e3;
  --code-bg:#efece4; --shadow:0 1px 3px rgba(0,0,0,.08);
  --zg:#2e7d4f; --zy:#b8860b; --zr:#b3362b; --zg-bg:#e3f3e8; --zy-bg:#fbf1d6; --zr-bg:#fbe6e3;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171a; --card:#1f2226; --ink:#e9e7e1; --muted:#a09d95; --line:#33373d;
    --accent:#6ea3e6; --accent-ink:#0f1a2a; --gold:#e0b04a;
    --ok:#6fcf97; --ok-bg:#1f3a2b; --bad:#f08c7d; --bad-bg:#3f221f;
    --code-bg:#262a30; --shadow:0 1px 3px rgba(0,0,0,.4);
    --zg:#6fcf97; --zy:#e0b04a; --zr:#f08c7d; --zg-bg:#1f3a2b; --zy-bg:#3a3120; --zr-bg:#3f221f;
  }
}
:root[data-theme="dark"]{
  --bg:#15171a; --card:#1f2226; --ink:#e9e7e1; --muted:#a09d95; --line:#33373d;
  --accent:#6ea3e6; --accent-ink:#0f1a2a; --gold:#e0b04a;
  --ok:#6fcf97; --ok-bg:#1f3a2b; --bad:#f08c7d; --bad-bg:#3f221f;
  --code-bg:#262a30; --shadow:0 1px 3px rgba(0,0,0,.4);
  --zg:#6fcf97; --zy:#e0b04a; --zr:#f08c7d; --zg-bg:#1f3a2b; --zy-bg:#3a3120; --zr-bg:#3f221f;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Serif 4",Georgia,"Times New Roman",serif;font-size:var(--fs,17px);line-height:1.5}
.sans,.btn,.opt b,.pill,.row .s,.card h2,.timer,.zone{font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--accent);color:var(--accent-ink);padding:env(safe-area-inset-top) 0 0;box-shadow:var(--shadow)}
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px;min-height:52px}
.bar h1{font-size:16px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.bar button{background:transparent;border:0;color:inherit;font-size:22px;padding:4px 8px;line-height:1;cursor:pointer;border-radius:8px}
.bar button:active{background:rgba(255,255,255,.2)}
.langs{display:flex;gap:5px}
.langbtn{color:inherit;text-decoration:none;font-size:13px;font-weight:600;border:1.5px solid rgba(255,255,255,.7);border-radius:6px;padding:3px 7px;letter-spacing:.04em}
main{max-width:760px;margin:0 auto;padding:14px 14px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 12px;box-shadow:var(--shadow)}
.card h2{margin:0 0 6px;font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;border:0}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer;-webkit-tap-highlight-color:transparent}
.row:first-of-type{border-top:0}
.row .n{flex:0 0 34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:16px;line-height:1.25}
.row .t small{color:var(--muted);font-size:13px}
.row .s{font-size:13px;color:var(--muted);white-space:nowrap}
.zone{display:inline-block;padding:3px 9px;border-radius:6px;font-size:13px;font-weight:600;white-space:nowrap}
.zone.g{background:var(--zg-bg);color:var(--zg)}.zone.y{background:var(--zy-bg);color:var(--zy)}.zone.r{background:var(--zr-bg);color:var(--zr)}
.score .big.g{color:var(--zg)}.score .big.y{color:var(--zy)}.score .big.r{color:var(--zr)}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 18px;font-size:16px;font-weight:600;cursor:pointer;text-align:center;-webkit-tap-highlight-color:transparent}
.btn.sec{background:transparent;color:var(--accent);border:2px solid var(--accent)}
a.btn{text-decoration:none}
.card.buy{border:2px solid var(--gold)}
.row.locked{opacity:.6}
.btn.block{display:block;width:100%;margin:8px 0}
.btn:disabled{opacity:.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 2px}
.prog i{display:block;height:100%;background:var(--gold)}
/* content */
.content h1{font-size:1.45em;line-height:1.25;margin:.2em 0 .6em}
.content h2{font-size:1.2em;margin:1.4em 0 .5em;padding-bottom:.2em;border-bottom:1px solid var(--line)}
.content h3{font-size:1.05em;margin:1.2em 0 .4em}
.content p{margin:0 0 .8em}
.content ul,.content ol{padding-left:1.3em;margin:0 0 .9em}
.content li{margin-bottom:.3em}
.content table{border-collapse:collapse;width:100%;font-size:.9em;margin:.6em 0 1em;display:block;overflow-x:auto}
.content th,.content td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
.content th{background:var(--code-bg)}
.content pre{background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;font-size:.78em;line-height:1.3}
.content code{font-family:Menlo,Consolas,monospace;font-size:.9em}
.content blockquote{margin:.6em 0;padding:.2em 0 .2em .9em;border-left:3px solid var(--gold);color:var(--muted)}
.content hr{border:0;border-top:1px solid var(--line);margin:1.4em 0}
.content img{max-width:100%}
.content p.diagram{text-align:center;margin:.9em 0 1.1em}
.content p.diagram img{width:100%;max-width:560px;height:auto;background:#fff;border:1px solid var(--line);border-radius:8px}
/* quiz */
.q{font-size:1.05em;margin:0 0 14px}
.q .nr{color:var(--muted);font-size:.85em;display:block;margin-bottom:4px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:11px 12px;margin:0 0 8px;font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.opt b{flex:0 0 22px;color:var(--accent)}
.opt.sel{border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default;opacity:1}
.expl{border-left:4px solid var(--gold);background:var(--card);padding:10px 12px;margin:10px 0;border-radius:0 10px 10px 0}
.expl.ok{border-color:var(--ok)}
.expl.bad{border-color:var(--bad)}
.expl .v{font-weight:700;display:block;margin-bottom:4px}
.score{text-align:center;padding:18px 0}
.score .big{font-size:52px;font-weight:700;line-height:1;color:var(--accent)}
.score .sub{color:var(--muted);margin:6px 0 14px}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;background:var(--code-bg);color:var(--muted);margin-right:6px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.toolbar .btn{padding:9px 13px;font-size:14px;flex:1}
.timer{font-variant-numeric:tabular-nums;font-family:Menlo,Consolas,monospace;font-size:14px;opacity:.9}
input.search{width:100%;padding:11px 12px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin:0 0 12px}
.hidden{display:none!important}
.bottomnav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 10px calc(6px + env(safe-area-inset-bottom));gap:8px;z-index:5}
.bottomnav .btn{flex:1;padding:10px;font-size:15px}
.chk{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:15px}
.muted{color:var(--muted)}
.small{font-size:.9em}
</style>
</head>

<script>
const DATA = [{"id": "ch00", "num": 0, "title": "Die TOCFC-Prüfung und wie Sie diesen Kurs nutzen", "part": 0, "partShort": "Teil 0", "partLong": "Die Prüfung", "gebied": null, "html": "<h2 id=\"wofur-dieser-kurs-gedacht-ist\">Wofür dieser Kurs gedacht ist</h2>\n<p>Dieser Kurs bereitet Sie auf die <em>TOC Fundamentals Certification</em> (TOCFC) der TOCICO vor, der Theory of Constraints International Certification Organization. Die Prüfung testet, ob Sie die Grundbegriffe, Überzeugungen und Prinzipien der Theory of Constraints (TOC) erkennen und verstehen. Sie müssen noch nichts implementieren. Die Terminologie müssen Sie aber fehlerfrei beherrschen, denn fast jede Prüfungsfrage dreht sich um eine Definition oder um den Unterschied zwischen zwei ähnlichen Begriffen.</p>\n<p>Der Kurs ist auf Deutsch, die Prüfung aber auf Englisch. Deshalb steht jeder Fachbegriff auf Englisch, mit einer deutschen Erklärung. Lernen Sie die englischen Begriffe. Die Probeprüfung in Kapitel 15 ist vollständig auf Englisch, damit Sie sich an die Formulierungen gewöhnen.</p>\n<h2 id=\"die-drei-zertifizierungsstufen\">Die drei Zertifizierungsstufen</h2>\n<p>Die TOCICO kennt drei Stufen. Jede Stufe baut auf der vorherigen auf.</p>\n<table>\n<thead>\n<tr>\n<th>Stufe</th>\n<th>Name</th>\n<th>Was Sie nachweisen</th>\n<th>Form</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>Fundamentals (TOCFC)</td>\n<td>Grundbegriffe und Terminologie erkennen und verstehen</td>\n<td>Online-Multiple-Choice</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Practitioner (TOCPC)</td>\n<td>Anwenden, analysieren und bewerten in einem bestimmten Anwendungsgebiet</td>\n<td>Prüfung je Gebiet, nach Fundamentals</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Implementer (TOCIC)</td>\n<td>Umfassende Anwendung in der eigenen Arbeit</td>\n<td>Assessment</td>\n</tr>\n</tbody>\n</table>\n<p>Auf Stufe 1 gibt es neben der breiten <em>TOC-Fundamentals</em>-Prüfung auch eigene Fundamentals-Prüfungen je Gebiet: Critical Chain Project Management (CCPM), Thinking Processes (TP), Supply Chain Logistics (SCL), Production and Operations Management (POM) und Finance and Measures (FM). Dieser Kurs konzentriert sich auf die breite TOC-Fundamentals-Prüfung. Sie deckt alle Gebiete auf Grundniveau ab und ist der erste Schritt zu jeder Practitioner-Prüfung.</p>\n<h2 id=\"die-prufung-in-zahlen\">Die Prüfung in Zahlen</h2>\n<table>\n<thead>\n<tr>\n<th>Punkt</th>\n<th>Wert</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Anzahl der Fragen</td>\n<td>60, Multiple-Choice</td>\n</tr>\n<tr>\n<td>Zeit</td>\n<td>2,5 Stunden</td>\n</tr>\n<tr>\n<td>Sprache</td>\n<td>Englisch (online). Chinesisch für 2027 geplant, nur vor Ort</td>\n</tr>\n<tr>\n<td>Kosten für Mitglieder</td>\n<td>$99</td>\n</tr>\n<tr>\n<td>Kosten für Nichtmitglieder</td>\n<td>$196, einschließlich 1 Jahr TOCICO-Mitgliedschaft</td>\n</tr>\n<tr>\n<td>Erforderliche Vorkenntnisse</td>\n<td>Keine</td>\n</tr>\n<tr>\n<td>Aufsicht</td>\n<td>Online-Proctoring über MonitorEDU, mit zwei Kameras</td>\n</tr>\n<tr>\n<td>Ergebnis</td>\n<td>Digitales Zertifikat, Titel „TOC Fundamentals Certified (TOCFC)“</td>\n</tr>\n</tbody>\n</table>\n<p>Die TOCICO veröffentlicht auf der Prüfungsseite keine offizielle Bestehensgrenze. Rechnen Sie mit mindestens 70 Prozent und streben Sie in der Probeprüfung 80 Prozent an, bevor Sie die echte Prüfung buchen. Sie haben im Durchschnitt 2,5 Minuten pro Frage. Das ist reichlich. Lesen Sie jede Frage zweimal.</p>\n<h2 id=\"die-offiziellen-lernziele\">Die offiziellen Lernziele</h2>\n<p>Die TOCICO teilt die Prüfung in drei Bereiche ein. Der folgende Text ist die offizielle Formulierung der Prüfungsseite. Jeder Bereich entspricht einem Teil dieses Kurses.</p>\n<h3 id=\"bereich-1-toc-fundamentals-concepts-teil-1-kapitel-1-bis-5\">Bereich 1: TOC Fundamentals Concepts (Teil 1, Kapitel 1 bis 5)</h3>\n<p>\"Demonstrate recognition and understanding of the foundational TOC principles, core metrics, and key distinctions in TOC thinking.\"</p>\n<ul>\n<li>\"Understand and apply basic TOC beliefs, paradigms, and the Five Focusing Steps\"</li>\n<li>\"Distinguish between simple vs. complex systems\"</li>\n<li>\"Explain goals, necessary conditions, constraints, and global TOC metrics\"</li>\n<li>\"Differentiate 'cost world' vs. 'throughput world' thinking\"</li>\n</ul>\n<h3 id=\"bereich-2-toc-thinking-processes-teil-2-kapitel-6-bis-9\">Bereich 2: TOC Thinking Processes (Teil 2, Kapitel 6 bis 9)</h3>\n<p>\"Demonstrate recognition and understanding of core TOC Thinking Processes concepts, tools, and basic logical relationships used to support structured problem-solving.\"</p>\n<ul>\n<li>\"Identify the Change Sequence and core TP tools\"</li>\n<li>\"Apply logical relationships, categories of legitimate reservations, and assumptions\"</li>\n<li>\"Create conflict clouds and logical branches for given scenarios\"</li>\n<li>\"Describe injections, entity relationships, and win-win conflict resolution\"</li>\n</ul>\n<h3 id=\"bereich-3-toc-applications-teil-3-kapitel-10-bis-14\">Bereich 3: TOC Applications (Teil 3, Kapitel 10 bis 14)</h3>\n<p>\"Demonstrate recognition and understanding of TOC principles across supply chain, finance, and project management, including identifying bottlenecks, using buffers, and supporting effective communication and change management.\"</p>\n<ul>\n<li>\"Demonstrate TOC principles in: 1. Supply chain/logistics (Simplified-DBR) 2. Finance and measurements 3. Critical Chain Project Management (CCPM), single &amp; multi-project environments\"</li>\n<li>\"Identify bottlenecks, use buffers, and develop effective communication flows\"</li>\n<li>\"Understand and address resistance to change using TOC's layered approach\"</li>\n</ul>\n<h2 id=\"das-offizielle-studienmaterial\">Das offizielle Studienmaterial</h2>\n<p>Mit einer TOCICO-Mitgliedschaft erhalten Sie Zugang zu:</p>\n<ul>\n<li>Dem <em>TOCICO Dictionary</em> (2. Auflage, 2012). Das ist die wichtigste Quelle. Die Prüfungsfragen folgen den Definitionen dieses Wörterbuchs. Dieser Kurs basiert darauf.</li>\n<li>Den Videos <em>What is TOC</em> und <em>Basics of TOC</em>.</li>\n<li><em>A Guide to Implementing the Theory of Constraints</em>.</li>\n</ul>\n<p>Nicht enthalten, aber von der TOCICO empfohlen:</p>\n<ul>\n<li><em>Theory of Constraints Handbook</em> (Cox und Schleier).</li>\n<li><em>The Goal</em> (Buch und Film) von Eliyahu Goldratt. Lesen Sie auf jeden Fall das Buch. Es ist der schnellste Weg, ein Gefühl für die Begriffe Bottleneck, Dependent Events und Statistical Fluctuations zu bekommen.</li>\n<li><em>TOC Self Learning Program</em> (Goldratt Satellite Program).</li>\n<li><em>Beyond the Goal</em> (Reihe Necessary and Sufficient).</li>\n<li><em>Production the TOC Way with Simulator</em>.</li>\n<li><em>TOC Insights</em> für Operations, Finance and Measurements, Project Management und Distribution.</li>\n</ul>\n<h2 id=\"wie-dieser-kurs-aufgebaut-ist\">Wie dieser Kurs aufgebaut ist</h2>\n<p>Jedes Kapitel (1 bis 14) hat denselben Aufbau:</p>\n<ol>\n<li><strong>Lernziele.</strong> Was Sie nach dem Kapitel können müssen.</li>\n<li><strong>Erklärung mit Beispielen.</strong> Englischer Begriff kursiv, mit deutscher Erklärung.</li>\n<li><strong>Prüfungsfallen.</strong> Begriffe, die in der Prüfung verwechselt werden.</li>\n<li><strong>Zusammenfassung.</strong> In Stichpunkten, zum Wiederholen.</li>\n<li><strong>Übungsfragen.</strong> Zehn Multiple-Choice-Fragen im Prüfungsstil.</li>\n<li><strong>Antworten.</strong> Mit der Erklärung, warum die richtige Antwort richtig ist und die Distraktoren falsch sind.</li>\n</ol>\n<p>Teil 4 enthält die Probeprüfung (60 englische Fragen), eine Liste der Kernbegriffe von Englisch nach Deutsch und einen Spickzettel mit Formeln und Listen.</p>\n<h2 id=\"lernplan-fur-vier-wochen\">Lernplan für vier Wochen</h2>\n<p>Planen Sie etwa 4 bis 6 Stunden pro Woche ein. Lesen Sie zuerst, bearbeiten Sie dann die Übungsfragen, ohne zurückzublättern, und prüfen Sie erst danach Ihre Antworten.</p>\n<table>\n<thead>\n<tr>\n<th>Woche</th>\n<th>Kapitel</th>\n<th>Zusätzlich</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>1 bis 5 (Fundamentals Concepts)</td>\n<td>The Goal lesen oder erneut lesen</td>\n</tr>\n<tr>\n<td>2</td>\n<td>6 bis 9 (Thinking Processes)</td>\n<td>Selbst eine Cloud zu einem eigenen Konflikt zeichnen</td>\n</tr>\n<tr>\n<td>3</td>\n<td>10 bis 14 (Applications)</td>\n<td>Die Videos What is TOC und Basics of TOC ansehen</td>\n</tr>\n<tr>\n<td>4</td>\n<td>15 (Probeprüfung), 16 und 17</td>\n<td>Kapitel wiederholen, in denen Sie unter 80 Prozent lagen</td>\n</tr>\n</tbody>\n</table>\n<p>Legen Sie die Probeprüfung in einem Durchgang ab, mit Uhr und ohne Hilfsmittel. So simulieren Sie die echte Situation.</p>\n<h2 id=\"die-prufung-buchen-und-der-prufungstag\">Die Prüfung buchen und der Prüfungstag</h2>\n<p>Die Prüfung wird online von MonitorEDU abgenommen. Die „Welcome and Student Directions“ der TOCICO enthalten die Regeln. Die wichtigsten Punkte stehen unten.</p>\n<h3 id=\"vorab-regeln\">Vorab regeln</h3>\n<ul>\n<li>Buchen Sie die Prüfung über das Planungsformular von MonitorEDU (Link im Welcome-Schreiben). Umbuchungen oder Fragen: per E-Mail an MonitorEDU.</li>\n<li>Lesen Sie die FAQ und die Proctoring-Richtlinie auf monitoredu.com.</li>\n<li>Sehen Sie sich die beiden Anleitungsvideos an: „Two Camera Proctoring“ und „How to Set Up Your Room“.</li>\n<li>Installieren Sie die Google-Meet-App auf Ihrem Telefon.</li>\n<li>Testen Sie Webcam, Mikrofon, Telefonkamera und Bildschirmfreigabe an Ihrem Computer.</li>\n</ul>\n<h3 id=\"was-sie-brauchen\">Was Sie brauchen</h3>\n<ul>\n<li><strong>Zwei Geräte.</strong> Einen Computer oder Laptop mit funktionierender Webcam für die Prüfung. Ein Smartphone mit funktionierender Kamera und Google Meet als zweite Kamera.</li>\n<li>Beide Geräte am Stromnetz und mit zuverlässiger Internetverbindung.</li>\n<li>Einen gültigen Lichtbildausweis, zu Beginn der Sitzung griffbereit.</li>\n</ul>\n<h3 id=\"der-raum\">Der Raum</h3>\n<ul>\n<li>Allein im Zimmer. Niemand sonst anwesend.</li>\n<li>Aufgeräumter Arbeitsplatz. Keine Papiere, Notizen oder anderen Gegenstände.</li>\n<li>An einem festen Tisch oder Schreibtisch, auf einem Stuhl. Kein Sofa oder Bett.</li>\n<li>Vollständig bekleidet. Keine Kappe, Kapuze, Kopfhörer, Uhr oder Smart Glasses.</li>\n<li>Sie führen einen 360-Grad-Scan des Raums durch: vier Wände, auf dem Schreibtisch, über und unter dem Schreibtisch.</li>\n<li>Das Telefon steht so, dass Sie, Ihr Arbeitsplatz und Ihr Computerbildschirm sichtbar sind. Zugelassene Materialien liegen zwischen Ihnen und dem Telefon.</li>\n</ul>\n<h3 id=\"am-prufungstag-schritt-fur-schritt\">Am Prüfungstag, Schritt für Schritt</h3>\n<ol>\n<li>Klicken Sie am Computer auf den Link „Connect with Proctor“ und danach auf „Connect to Proctor“.</li>\n<li>Bestätigen Sie, dass Sie sich in der richtigen Umgebung befinden und Ihr Telefon richtig aufgestellt werden kann.</li>\n<li>Füllen Sie das „Mobile Device Readiness Agreement“ aus.</li>\n<li>Durchlaufen Sie den „Testing Device Readiness Check“: Kamera zulassen, Mikrofon zulassen, gesamten Bildschirm freigeben.</li>\n<li>Bestätigen Sie die Strom- und Internetverbindung.</li>\n<li>Füllen Sie das Formular aus und laden Sie ein Foto Ihres Ausweises und ein Selfie hoch.</li>\n<li>Akzeptieren Sie die Regeln von MonitorEDU.</li>\n<li>Klicken Sie auf „Connect to Proctor“, prüfen Sie Ihre Angaben, klicken Sie auf „New Conversation“ und dann auf „Start Chat“.</li>\n<li>Bleiben Sie aktiv, bis der Proctor den Chat betritt. Der Name des Proctors erscheint oben im Chat.</li>\n<li>Funktioniert der Chat nicht, klicken Sie auf „Trouble Connecting“, um einen Ersatzkanal zu nutzen.</li>\n<li>Folgen Sie beim Start der Prüfung den Anweisungen des Proctors.</li>\n</ol>\n<h3 id=\"tipps-fur-die-fragen-selbst\">Tipps für die Fragen selbst</h3>\n<ul>\n<li>Lesen Sie die Frage zweimal. Achten Sie auf Wörter wie \"not\", \"except\", \"always\", \"never\", \"best\".</li>\n<li>Streichen Sie zuerst die Antworten, die sicher falsch sind.</li>\n<li>Bei Zweifel zwischen zwei Antworten: Wählen Sie die Antwort, die der wörtlichen Definition im TOCICO Dictionary am nächsten kommt.</li>\n<li>Rechenfragen sind einfach (Throughput, Net Profit, Order Quantity). Schreiben Sie die Formel auf, bevor Sie rechnen. Kapitel 17 enthält alle Formeln.</li>\n<li>Ein Bottleneck und eine Capacity-Constrained Resource sind nicht dasselbe. Ein Constraint und ein Bottleneck auch nicht. Solche Unterscheidungen sind der Kern der Prüfung.</li>\n</ul>", "q": []}, {"id": "ch01", "num": 1, "title": "Was ist die Theory of Constraints?", "part": 1, "partShort": "Teil 1", "partLong": "TOC Fundamentals Concepts", "gebied": 1, "html": "<h2 id=\"lernziele\">Lernziele</h2>\n<p>Nach diesem Kapitel können Sie:</p>\n<ul>\n<li>Erklären, was das <em>goal</em> (Ziel) eines Systems ist und wie sich <em>necessary conditions</em> (notwendige Bedingungen) dazu verhalten.</li>\n<li>Die Kettenanalogie (chain analogy) anwenden: Ein System ist so stark wie sein schwächstes Glied.</li>\n<li>Die offizielle TOCICO-Definition der <em>theory of constraints</em> (TOC) erkennen und von <em>constraints management</em> unterscheiden.</li>\n<li>Die vier <em>fundamental assumptions</em> (Säulen) der TOC benennen und in Prüfungsfragen erkennen.</li>\n<li>Begriffe wie <em>holistic approach</em>, <em>leverage point</em>, <em>Archimedes lever point</em> und <em>focus</em> richtig einordnen.</li>\n<li>Kurz angeben, was ein <em>process of ongoing improvement</em> (POOGI) ist und was die drei <em>stages of a science</em> sind.</li>\n</ul>\n<h2 id=\"11-warum-gibt-es-eine-organisation-das-goal\">1.1 Warum gibt es eine Organisation? Das Goal</h2>\n<p>Jede Organisation ist ein System, das jemand mit einer Absicht gegründet hat. Die TOC nennt diese Absicht das <em>goal</em> (Ziel; der Grund, aus dem das System geschaffen wurde, festgelegt von den Eigentümern). Englischer Kern: \"The purpose for which the system was created as determined by the owners.\"</p>\n<p>Achten Sie in dieser Definition auf zwei Dinge:</p>\n<ol>\n<li>Das Goal wird von den <strong>Eigentümern</strong> bestimmt, nicht vom Management oder den Mitarbeitenden.</li>\n<li>Das Goal ist ein <strong>purpose</strong> (Zweck), kein Maßstab. Das Messen kommt später.</li>\n</ol>\n<p>Für die meisten kommerziellen Unternehmen lautet das Goal: \"make more money now and in the future\" (jetzt und in Zukunft mehr Geld verdienen). Diese Formulierung stammt aus Goldratts Roman <em>The Goal</em> (1984). Darin entdeckt Werksleiter Alex Rogo mit Hilfe seines alten Physiklehrers Jonah, dass seine Fabrik nicht existiert, um effizient zu sein, sondern um Geld zu verdienen.</p>\n<p>Die Einheit, in der das Goal ausgedrückt wird, heißt <em>goal unit</em> (Zieleinheit). Bei einem gewinnorientierten Unternehmen ist das Geld. Bei einem Krankenhaus kann es die „Anzahl geheilter Patienten“ sein, bei einer Armee die „Anzahl erreichter Einsatzziele“. Die Prüfung testet vor allem den kommerziellen Fall, aber der Begriff Goal Unit taucht in der Definition von Throughput wieder auf (Kapitel 4).</p>\n<h3 id=\"necessary-conditions\">Necessary conditions</h3>\n<p>Neben einem Goal hat jedes System <em>necessary conditions</em> (notwendige Bedingungen; Anforderungen, die für sich genommen nicht ausreichen, ohne die das Goal aber nicht erreicht werden kann). Englischer Kern: \"A requirement which by itself is not sufficient... to achieve the goal.\"</p>\n<p>Das klassische Beispiel:</p>\n<table>\n<thead>\n<tr>\n<th>Element</th>\n<th>Formulierung</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Goal</td>\n<td>Make more money now and in the future</td>\n</tr>\n<tr>\n<td>Necessary condition 1</td>\n<td>Satisfy customers now and in the future</td>\n</tr>\n<tr>\n<td>Necessary condition 2</td>\n<td>Provide a secure and satisfying environment for employees now and in the future</td>\n</tr>\n</tbody>\n</table>\n<p>Diese Beziehung ist für die Prüfung wichtig. Kundenzufriedenheit ist <strong>kein</strong> Goal, sondern eine notwendige Bedingung. Ein Unternehmen, das Kunden vertreibt, verdient auf Dauer kein Geld mehr. Ein Unternehmen, das seine Mitarbeitenden auslaugt, ebenso wenig. Aber ein Unternehmen, das nur zufriedene Kunden und glückliche Mitarbeitende hat und keinen Gewinn macht, erreicht sein Goal nicht.</p>\n<p>Eine Organisation, die sowohl beim Goal als auch bei den Necessary Conditions außergewöhnlich gut abschneidet, heißt im Dictionary <em>ever-flourishing</em> (dauerhaft blühend).</p>\n<p>Ein feiner Unterschied: Das Dictionary stellt der Necessary Condition die <em>sufficient condition</em> (hinreichende Bedingung) gegenüber. Eine hinreichende Bedingung kann das Ergebnis für sich allein herbeiführen, ist aber nicht erforderlich. Das Beispiel im Dictionary: Der iPod war eine hinreichende Bedingung für die Wende bei Apple, aber keine notwendige; Apple hätte sich auch auf andere Weise erholen können.</p>\n<h2 id=\"12-das-system-als-kette\">1.2 Das System als Kette</h2>\n<p>Die TOC betrachtet eine Organisation als <strong>Kette</strong> (chain) abhängiger Glieder. Der Einkauf beliefert die Produktion, die Produktion den Verkauf, der Verkauf den Kunden. Jeder Teil ist vom vorherigen abhängig.</p>\n<p>Die Kernfrage bei einer Kette lautet: Was bestimmt ihre Stärke? Die Antwort: <strong>das schwächste Glied</strong>. Es spielt keine Rolle, wie stark die übrigen Glieder sind. Zieht man an der Kette, reißt sie an der schwächsten Stelle.</p>\n<p class=\"diagram\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA1wAAABTCAIAAAAEOZHbAAAf60lEQVR4nO3deVhTV9oA8JOYBIRQQBQwtEBQIWyFYsVqhSpVFBTXUQsiIOLTWhz74FJT68LUpbWUWqejdKpIVbBTFFFKkUVAxSqoYxECRhxIggsEA2GTYLb7/XGfuV+GNQnBNPD+/rrc5eWV631zcu6555IwDEMAAAAAAGB0I+s7AQAAAAAAoH/QKAQAAAAAANAoBAAAAAAA0CgEAAAAAAAIGoUAAAAAAABBoxAAAAAAACCEKMQSh8PJycl5/PixVCrVY0IjmImJibe3d3Bw8IQJE3QVUy6XX7ly5ffff29qatJVTNCDtbX1u+++O3fuXAqFMvje6nn+/HlOTk55eXlXV5euYgJVVCrV3t4+ODjYw8NDh2GhTg43qJMGCuqkIepdJ0kYhonF4m3btuXm5o4bN87FxcXKy tKii9RAv2Qy2fnz5z08PPz8/MRi8VBCQZ18laBOGiiok4aoR50kYRgmFou3b99++fJlCwsLFos1fvx4ffdijkAymUwoFHI4HBqNtmXLlo8++ki78Raqbt++vWXLFh6P5+jo6OTkZGJiopNUgaqurq7a2lqBQDBp0qTExMRp06YNMSCGYUlJSYcPH5ZKpR4eHjY2NlQqVSepAlUikYjL5ba2tgYHByckJFhYWAwxINTJVwDqpIGCOmmgetdJEoZh+LaqqqrLly8LBAKpVKrfLEcqU1NTb2/v4OBgHX6cyOXywsLCmzdvCoVC4lQC3bKxsZk1a1ZAQACFQtFVTJFIlJOTc//+/c7OTl3FBKpoNJqDg0NQUJC7u7sOw0KdHG5QJw0U1ElD1LtOkuAKAQAAAAAAMHk1AAAAAACARiEAAAAAAIBGIQAAAAAAQNAoBAAAAAAACBqFAAAAAAAAQaMQAAAAAAAghP4PVBNLesPACQUAAAAASUVORK5CYII=\" alt=\"Kette aus sechs Gliedern S1 bis S6 mit den Tragkräften 10, 12, 15, 4, 11 und 13. S4 ist mit 4 das schwächste Glied und bestimmt die Stärke der ganzen Kette.\"></p>\n\n<p><em>Tragkraft je Glied. Das schwächste Glied hat 4, also beträgt die Kettenstärke 4.</em></p>\n<p>Die Folgen dieser Analogie sind die Grundlage der gesamten TOC-Logik:</p>\n<ul>\n<li><strong>Ein Glied zu verstärken, das nicht das schwächste ist,</strong> ändert die Stärke der Kette nicht. S1 von 10 auf 20 zu bringen kostet Geld und bringt nichts.</li>\n<li><strong>Das schwächste Glied zu verstärken</strong> erhöht die Kettenstärke unmittelbar. S4 von 4 auf 8 zu bringen verdoppelt die Kettenstärke.</li>\n<li><strong>Sobald S4 stärker als 10 wird,</strong> ist S1 das neue schwächste Glied. Der Fokus verschiebt sich.</li>\n</ul>\n<p>Übertragen auf eine Organisation: Die „Stärke“ ist die Geschwindigkeit, mit der das System Goal Units erzeugt. Das schwächste Glied ist der <em>constraint</em> (Engpass). Kapitel 2 geht ausführlich darauf ein.</p>\n<p>Das erklärt auch, warum die TOC der Idee „überall ein wenig verbessern“ so skeptisch gegenübersteht. Verstärken Sie zehn Glieder um je 5 Prozent, wird die Kette vielleicht 5 Prozent stärker. Verstärken Sie ein Glied (das richtige) um 50 Prozent, wird die Kette 50 Prozent stärker.</p>\n<h3 id=\"kette-versus-summe\">Kette versus Summe</h3>\n<p>Das Gegenmodell ist die Organisation als <strong>Summe unabhängiger Teile</strong>. In diesem Modell entspricht die Leistung des Ganzen der Summe der Leistungen der Teile. Also: Verbessern Sie jeden Teil, und das Ganze verbessert sich. Die TOC nennt dies die <em>cost-world</em>-Denkweise (Kapitel 4). Die Kettenanalogie besagt, dass dieses Modell versagt, sobald die Teile voneinander abhängen.</p>\n<h2 id=\"13-goldratt-und-the-goal\">1.3 Goldratt und The Goal</h2>\n<p>Dr. Eliyahu M. Goldratt (1947-2011) war ein israelischer Physiker, der seine wissenschaftliche Denkweise auf Organisationen anwandte. Er begann in den Siebzigerjahren mit Planungssoftware (OPT) und stellte fest, dass Software allein nichts veränderte, solange Manager weiter wie bisher dachten. Deshalb schrieb er 1984 den Wirtschaftsroman <em>The Goal</em>.</p>\n<p>Die Handlung von <em>The Goal</em> in Kürze: Dem Werk UNICO (Bearington) droht die Schließung. Alex Rogo entdeckt mit Jonah, dass zwei Maschinen die Ausbringung begrenzen: die NCX-10 und der Wärmebehandlungsofen (heat treat). Weil er diese beiden schützt und optimal nutzt, steigt der Gewinn. Schließlich produziert das Werk mehr, als der Markt abnimmt: Der Markt wird zum neuen Constraint.</p>\n<p>Zwei Szenen aus dem Buch kommen mit ziemlicher Sicherheit in Prüfungsfragen vor und werden in Kapitel 2 ausführlich behandelt:</p>\n<ul>\n<li>Die <strong>Pfadfinderwanderung</strong> mit Herbie (der langsamste Junge bestimmt das Tempo der ganzen Gruppe).</li>\n<li>Das <strong>Streichholzspiel</strong> (match-bowl game) mit Würfeln, das zeigt, was Schwankungen in einer abhängigen Kette bewirken.</li>\n</ul>\n<p>Spätere Bücher Goldratts erweitern die TOC: <em>It's Not Luck</em> (Thinking Processes), <em>Critical Chain</em> (Projektmanagement), <em>Necessary But Not Sufficient</em> (IT), <em>The Choice</em> (die vier Säulen) und <em>Isn't It Obvious?</em> (Distribution).</p>\n<h2 id=\"14-definition-der-theory-of-constraints\">1.4 Definition der Theory of Constraints</h2>\n<p>Das TOCICO Dictionary definiert die <em>theory of constraints</em> (TOC) als eine ganzheitliche Managementphilosophie von Goldratt, die auf dem Prinzip beruht, dass komplexe Systeme <em>inherent simplicity</em> (inhärente Einfachheit) aufweisen. Englischer Kern: \"A holistic management philosophy... based on the principle that complex systems exhibit inherent simplicity.\"</p>\n<p>Die Definition geht weiter: Selbst ein sehr komplexes System mit Tausenden von Menschen und Maschinen hat zu jedem Zeitpunkt nur eine sehr kleine Zahl von Variablen, vielleicht nur eine, die wirklich begrenzen, wie viele Goal Units das System erzeugen kann. Diese Variable heißt Constraint.</p>\n<p>Merken Sie sich drei Merkmale aus der Definition:</p>\n<ol>\n<li><strong>Ganzheitlich</strong>: Es geht um das Ganze, nicht um die einzelnen Teile.</li>\n<li><strong>Managementphilosophie</strong>: keine Technik und kein Tool, sondern eine Denkweise.</li>\n<li><strong>Inhärente Einfachheit</strong>: Wenige Variablen bestimmen die Leistung.</li>\n</ol>\n<h3 id=\"constraints-management\">Constraints management</h3>\n<p>Die Prüfung kann nach dem Unterschied zum <em>constraints management</em> fragen. Dieser Begriff wurde von APICS für den logistischen Teil der TOC geprägt: Drum-Buffer-Rope, Buffer Management, VATI-Analyse, Throughput, Inventory, Operating Expense, Throughput-Dollar-Days und Inventory-Dollar-Days. Englischer Kern: \"A term coined by APICS... to describe the logistics paradigm.\"</p>\n<table>\n<thead>\n<tr>\n<th>Begriff</th>\n<th>Herkunft</th>\n<th>Reichweite</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Theory of constraints</td>\n<td>Goldratt</td>\n<td>Vollständige Managementphilosophie, einschließlich Thinking Processes, Finance, Strategie</td>\n</tr>\n<tr>\n<td>Constraints management</td>\n<td>APICS</td>\n<td>Vor allem die operativen und logistischen Anwendungen</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"woher-kommt-der-name\">Woher kommt der Name?</h3>\n<p>Das Dictionary nennt beim Eintrag <em>interactive constraints</em> ein historisches Detail: Goldratt erkannte bei der Untersuchung des Projektmanagements, dass die <em>critical chain</em> der Constraint eines Projekts ist. Kurz darauf benannte er sein Wissensgebiet in „Theory of Constraints“ um. Das Wort Constraint meint also mehr als eine Maschine in einer Fabrik. Es kann eine Ressource sein, eine Critical Chain, der Markt und so weiter.</p>\n<h2 id=\"15-die-vier-saulen-fundamental-assumptions-of-toc\">1.5 Die vier Säulen: fundamental assumptions of TOC</h2>\n<p>Das Dictionary nennt sie <em>fundamental assumptions (of TOC)</em>: Grundüberzeugungen, die für alle sozialen Systeme gelten. In <em>The Choice</em> nennt Goldratt sie die vier Säulen. Die Prüfung verwendet beide Bezeichnungen.</p>\n<table>\n<thead>\n<tr>\n<th>Nr.</th>\n<th>Säule (Englisch)</th>\n<th>Erläuterung</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>People are good</td>\n<td>Menschen sind gut, aber wir alle tragen „schlechte“ Annahmen in uns, die uns daran hindern, das Potenzial in uns selbst, in anderen und in Organisationen zu sehen.</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Every conflict can be removed</td>\n<td>Jeder Konflikt lässt sich lösen, wenn wir die falsche Annahme finden und hinterfragen, die ihn verursacht. Kein Kompromiss, sondern ein Win-win.</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Every situation is exceedingly simple</td>\n<td>Jede Situation, so komplex sie auch scheint, ist äußerst einfach, wenn wir die wenigen Leverage Points finden (inherent simplicity).</td>\n</tr>\n<tr>\n<td>4</td>\n<td>Every situation can be substantially improved</td>\n<td>Jede Situation lässt sich wesentlich verbessern, wenn wir klar denken. Das wird oft als \"never say I know\" zusammengefasst.</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"herkunft-zwei-annahmen-aus-den-harten-wissenschaften\">Herkunft: zwei Annahmen aus den harten Wissenschaften</h3>\n<p>Das Dictionary erklärt, dass die vier Säulen eine Erweiterung zweier Grundüberzeugungen der Naturwissenschaften sind, zusammengefasst in Newtons Ausspruch \"Natura valde simplex est et sibi consona\": Die Natur ist äußerst einfach und mit sich selbst im Einklang.</p>\n<ul>\n<li><strong>Inherent simplicity</strong>: Das Universum und alle komplexen Systeme werden von inhärenter Einfachheit bestimmt.</li>\n<li><strong>Inherent harmony</strong>: Innerhalb solcher Systeme gibt es keine Widersprüche in den Regeln, die sie steuern. Übertragen auf Organisationen: Jeder Konflikt lässt sich lösen.</li>\n</ul>\n<p>Goldratt fügte zwei Annahmen hinzu, weil Organisationen soziale Systeme mit Menschen sind: \"people are good\" und \"every situation can be substantially improved\".</p>\n<h3 id=\"wie-die-saulen-zusammenhangen\">Wie die Säulen zusammenhängen</h3>\n<table>\n<thead>\n<tr>\n<th>Harte Wissenschaft (Newton)</th>\n<th>Soziale Systeme (Goldratt)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Inherent simplicity</td>\n<td>3. Every situation is exceedingly simple</td>\n</tr>\n<tr>\n<td>Inherent harmony</td>\n<td>2. Every conflict can be removed</td>\n</tr>\n<tr>\n<td></td>\n<td>1. People are good</td>\n</tr>\n<tr>\n<td></td>\n<td>4. Every situation can be substantially improved (\"never say I know\")</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"never-say-i-know\">Never say I know</h3>\n<p>Die vierte Säule wird in der Praxis am häufigsten als \"never say I know\" zitiert. Die Überlegung: Sobald Sie glauben, eine Situation vollständig zu verstehen, hören Sie auf, nach Verbesserungen zu suchen. Wer glaubt, dass jede Situation wesentlich verbessert werden kann, stellt weiter Fragen. Die Herausgeber des Dictionary schreiben selbst im Vorwort, dass sie Goldratts vierte Säule zu akzeptieren gelernt haben: Je mehr man definiert, desto mehr entdeckt man, was man nicht weiß.</p>\n<h3 id=\"win-win\">Win-win</h3>\n<p>Zu Säule 2 gehört der Begriff Win-win. Die TOC behauptet, dass es in der Wirklichkeit keinen echten Konflikt gibt; ein Konflikt ist immer die Folge mindestens einer falschen Annahme. Finden Sie diese Annahme, verschwindet der Konflikt, ohne dass eine Partei verliert. Das Instrument dafür ist die <em>evaporating cloud</em> (Konfliktwolke; ein logisches Diagramm, das einen Konflikt genau beschreibt). Sie wird in Teil 2 dieses Kurses behandelt. Wichtig ist vorerst: Die TOC sucht keinen Kompromiss, denn ein Kompromiss bedeutet, dass beide Parteien etwas aufgeben.</p>\n<h2 id=\"16-holistic-approach\">1.6 Holistic approach</h2>\n<p>Die TOC bezeichnet sich als ganzheitliche Philosophie. Das Dictionary definiert den <em>holistic approach</em> (ganzheitlichen Ansatz) als die Überzeugung, dass eine Veränderung an einer Stelle eines Systems Folgen an anderen Stellen hat. Um die richtige Stelle für eine Veränderung zu finden, müssen Sie deshalb das gesamte Netz von Ursache und Wirkung zwischen den unerwünschten Effekten des Systems gründlich betrachten. Englischer Kern: \"change in one place in a system has ramifications in other parts of the system.\"</p>\n<p>Praktisch bedeutet das:</p>\n<ul>\n<li>Sie beurteilen eine Entscheidung nicht nach ihrer Wirkung auf eine Abteilung, sondern nach ihrer Wirkung auf das Ganze.</li>\n<li>Sie verwenden <em>holistic measures</em> (Kennzahlen der gesamten Organisation) wie Throughput, Investment und Operating Expense und nicht nur die lokale Effizienz.</li>\n<li>Sie suchen die Stelle, an der eine Veränderung dem Ganzen am meisten bringt: den Leverage Point.</li>\n</ul>\n<h2 id=\"17-leverage-point-und-archimedes-lever-point\">1.7 Leverage point und Archimedes lever point</h2>\n<p>Ein <em>leverage point</em> (Hebelpunkt) ist ein physischer oder logischer Punkt, an dem eine bestimmte Maßnahme eine erhebliche Verbesserung des gesamten Systems bewirkt. Englischer Kern: \"A point... where a specific action would provide significant system improvement.\"</p>\n<p>Das Dictionary nennt zwei Beispiele:</p>\n<ul>\n<li>In einem physischen Fluss von Goal Units ist der <strong>Constraint</strong> der Leverage Point.</li>\n<li>In einer Ursache-Wirkungs-Analyse ist das <strong>core problem</strong> (Kernproblem) der Leverage Point.</li>\n</ul>\n<p>Der verwandte Begriff <em>Archimedes lever point</em> verweist auf den Ausspruch des Archimedes: Gebt mir einen Ort zum Stehen und einen Hebel, der lang genug ist, und ich bewege die Erde. Die TOC wendet dies auf Systeme mit vielen Komponenten an: Eine Veränderung an nur einer oder wenigen Komponenten bewirkt eine große Veränderung der Gesamtleistung. Die Verbesserungsprozesse der TOC drehen sich darum, diese Punkte zu finden und zu steuern.</p>\n<p>Ein Missverständnis, auf das die Prüfung zielen kann: Ein Leverage Point ist nicht unbedingt der teuerste oder größte Teil. Er ist der Teil, an dem die <strong>Hebelwirkung</strong> am größten ist. In der Kettenanalogie ist das das schwächste Glied, auch wenn es klein und billig ist.</p>\n<h2 id=\"18-focus\">1.8 Focus</h2>\n<p><em>Focus</em> (Fokus) ist in der TOC ein Fachbegriff: das Identifizieren eines oder weniger Elemente oder Leverage Points, die einen erheblichen positiven Einfluss auf das Erreichen des Goals haben. Englischer Kern: \"Identifying one (or a few) elements or leverage points that have significant positive impact.\"</p>\n<p>Das Dictionary fügt einen wichtigen zweiten Teil hinzu: Focus umfasst <strong>sowohl das Tun dessen, was getan werden muss, als auch das Unterlassen dessen, was nicht getan werden soll</strong>. Das ist subtil. Viele Manager glauben, Fokus bedeute „hart am Wichtigsten arbeiten“. Die TOC ergänzt: und mit dem Rest aufhören. Konkret bedeutet Focus, <em>multitasking</em> (eine Aufgabe zu unterbrechen, bevor sie fertig ist, um eine andere zu beginnen) stark zu verringern oder zu beseitigen.</p>\n<p>Ohne Fokus verteilt eine Organisation ihre Aufmerksamkeit auf alle Glieder. Mit Fokus richtet sie sich auf das schwächste. Darum heißen die fünf Schritte der TOC auch <em>five focusing steps</em> (fünf Fokussierungsschritte).</p>\n<h2 id=\"19-process-of-ongoing-improvement-poogi\">1.9 Process of ongoing improvement (POOGI)</h2>\n<p>Das Ziel ist nicht, das schwächste Glied einmal zu verstärken, sondern dies dauerhaft zu tun. Die TOC nennt das einen <em>process of ongoing improvement</em> (POOGI; Prozess der fortlaufenden Verbesserung). Englischer Kern: \"Methods used to achieve continuous improvement with respect to one's goal.\"</p>\n<p>Das Dictionary unterscheidet innerhalb der TOC <strong>drei</strong> POOGIs:</p>\n<ol>\n<li>Die <strong>five focusing steps</strong> (Kapitel 3).</li>\n<li>Die <strong>change question sequence</strong> (die Fragen \"what to change?\", \"to what to change?\" und \"how to cause the change?\"; Teil 2).</li>\n<li><strong>Buffer Management</strong> (Teil 3).</li>\n</ol>\n<p>Die Prüfung kann fragen, welche dieser drei ein POOGI ist. Die Antwort: alle drei. Ein Distraktor wie „Throughput Accounting“ oder „Evaporating Cloud“ ist für sich genommen kein POOGI.</p>\n<h2 id=\"110-toc-als-wissenschaft-stages-of-a-science\">1.10 TOC als Wissenschaft: stages of a science</h2>\n<p>Goldratt sah sich als Wissenschaftler, der die Methode der Physik auf Organisationen anwandte. Das Dictionary definiert <em>science</em> (Wissenschaft) als die Suche nach einer minimalen Zahl von Annahmen, die durch logische Deduktion eine maximale Zahl von Erscheinungen erklären. Annahmen lassen sich nie beweisen; sie gelten, bis eine einzige Erscheinung sie widerlegt. Wissenschaft handelt nicht von Wahrheit, sondern von Gültigkeit. Darum bleibt alles überprüfbar. Das passt genau zu \"never say I know\".</p>\n<p>Das Dictionary beschreibt auch die <em>stages of a science</em> (Entwicklungsstufen einer Wissenschaft). Wissen über ein Thema entwickelt sich in drei Phasen:</p>\n<table>\n<thead>\n<tr>\n<th>Phase</th>\n<th>Frage</th>\n<th>Ergebnis</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Classification</td>\n<td>Was ist das?</td>\n<td>Eine Einteilung und Definitionen</td>\n</tr>\n<tr>\n<td>Correlation</td>\n<td>Wie hängt das mit anderen Dingen zusammen?</td>\n<td>Eine Aussage über die Beziehung</td>\n</tr>\n<tr>\n<td>Effect-cause-effect</td>\n<td>Warum geschieht das?</td>\n<td>Eine logische Erklärung der Beziehung</td>\n</tr>\n</tbody>\n</table>\n<p>Das Beispiel des Dictionary für die Logistikfunktion: MRP (material requirements planning) ist die Klassifikationsphase, Just-in-Time die Korrelationsphase und TOC die Effect-Cause-Effect-Phase. Die Prüfung kann diese Zuordnung wörtlich abfragen.</p>\n<h2 id=\"111-mini-fall-die-druckerei\">1.11 Mini-Fall: die Druckerei</h2>\n<p>Eine Druckerei hat vier Abteilungen: Druckvorstufe, Druck, Weiterverarbeitung und Versand. Die Geschäftsleitung klagt über sinkende Gewinne und fordert jede Abteilung auf, 10 Prozent effizienter zu werden.</p>\n<ul>\n<li>Die Druckvorstufe kauft schnellere Software. Sie beliefert den Druck nun schneller.</li>\n<li>Der Druck ist das schwächste Glied: Die Presse läuft bereits 24 Stunden am Tag. Schneller geht es nicht.</li>\n<li>Weiterverarbeitung und Versand haben schon oft nichts zu tun, weil der Druck nicht schneller liefert.</li>\n</ul>\n<p>Ergebnis: Die Druckvorstufe hat Geld ausgegeben, vor der Presse liegt mehr Halbfertigware, und die Ausbringung der Druckerei ist nicht gestiegen. Das Goal („more money“) ist nicht näher gerückt.</p>\n<p>Aus Sicht der TOC: Die Presse ist der Leverage Point. Nur Maßnahmen an der Presse oder in ihrem Umfeld erhöhen die Ausbringung. Alle anderen Abteilungen müssen sich der Presse unterordnen. Das ist ganzheitliches Denken mit Fokus.</p>\n<h2 id=\"prufungsfallen\">Prüfungsfallen</h2>\n<ul>\n<li><strong>Goal versus Necessary Condition.</strong> \"Satisfy customers\" ist eine Necessary Condition, kein Goal. Das Goal eines kommerziellen Unternehmens ist \"make more money now and in the future\". Wählen Sie im Zweifel die Formulierung, die die Eigentümer wählen würden.</li>\n<li><strong>Necessary versus Sufficient.</strong> Im Dictionary ist eine Necessary Condition nötig, für sich allein aber nicht genug. Eine Sufficient Condition reicht für sich allein aus. Verwechseln Sie die beiden nicht.</li>\n<li><strong>Theory of Constraints versus Constraints Management.</strong> Constraints Management ist der APICS-Begriff für den logistischen Teil. TOC ist die vollständige Philosophie.</li>\n<li><strong>Die vier Säulen verwechseln.</strong> \"Never say I know\" ist die populäre Zusammenfassung von Säule 4 (\"every situation can be substantially improved\"). Säule 3 ist Inherent Simplicity. Säule 2 ist \"every conflict can be removed\". Säule 1 ist \"people are good\".</li>\n<li><strong>Win-win versus Kompromiss.</strong> Die TOC sucht keinen Kompromiss. Bei einem Kompromiss geben beide Parteien etwas auf. Bei einem Win-win wird eine falsche Annahme beseitigt, sodass beide Parteien bekommen, was sie brauchen.</li>\n<li><strong>Ein Leverage Point ist nicht immer teuer oder groß.</strong> Es geht um Hebelwirkung, nicht um Umfang.</li>\n<li><strong>Drei POOGIs.</strong> Five Focusing Steps, Change Question Sequence und Buffer Management. Throughput Accounting ist kein POOGI.</li>\n<li><strong>Stages of a science.</strong> Classification, Correlation, Effect-Cause-Effect. TOC gehört zur dritten Phase, MRP zur ersten, JIT zur zweiten.</li>\n</ul>\n<h2 id=\"zusammenfassung\">Zusammenfassung</h2>\n<ul>\n<li>Das Goal ist der Zweck, zu dem das System gegründet wurde, festgelegt von den Eigentümern. Für Unternehmen: make more money now and in the future.</li>\n<li>Necessary Conditions (Kunden zufrieden, Mitarbeitende sicher und zufrieden) sind erforderlich, reichen aber nicht aus, um das Goal zu erreichen.</li>\n<li>Eine Organisation ist eine Kette abhängiger Glieder. Die Kettenstärke wird vom schwächsten Glied bestimmt: dem Constraint.</li>\n<li>Verbesserungen an Gliedern, die nicht die schwächsten sind, erhöhen die Kettenstärke nicht.</li>\n<li>TOC ist eine ganzheitliche Managementphilosophie von Goldratt, gegründet auf Inherent Simplicity: Wenige Variablen bestimmen die Leistung.</li>\n<li>Constraints Management ist die APICS-Bezeichnung für die logistischen Anwendungen der TOC.</li>\n<li>Die vier Fundamental Assumptions (Säulen): people are good; every conflict can be removed; every situation is exceedingly simple; every situation can be substantially improved (never say I know).</li>\n<li>Die Säulen bauen auf zwei Annahmen der harten Wissenschaft auf: Inherent Simplicity und Inherent Harmony.</li>\n<li>Ein Leverage Point ist die Stelle, an der eine kleine Maßnahme eine große Systemverbesserung bewirkt (Archimedes Lever Point). In einem physischen Fluss ist das der Constraint, in einer Ursache-Wirkungs-Analyse das Core Problem.</li>\n<li>Focus bedeutet, zu tun, was nötig ist, und zu lassen, was nicht nötig ist; die Folge ist weniger Multitasking.</li>\n<li>POOGI ist ein Prozess der fortlaufenden Verbesserung. Die TOC kennt drei: Five Focusing Steps, Change Question Sequence, Buffer Management.</li>\n<li>Wissenschaft sucht Gültigkeit, nicht Wahrheit. Die Stages of a Science sind Classification, Correlation und Effect-Cause-Effect; die TOC gehört zur letzten.</li>\n</ul>", "q": [{"n": 1, "q": "Was ist laut TOCICO Dictionary das <em>goal</em> eines Systems?", "opts": {"A": "Der Maßstab, mit dem das Management die Leistung beurteilt", "B": "Der Zweck, zu dem das System gegründet wurde, festgelegt von den Eigentümern", "C": "Die Summe aller Necessary Conditions", "D": "Das Throughput-Niveau, das der Markt zulässt"}, "gebied": 1, "a": "B", "e": "Das Goal ist der Purpose, zu dem das System geschaffen wurde, festgelegt von den Eigentümern. A verwechselt Goal mit Messung. C verwechselt Goal mit Necessary Conditions. D beschreibt einen Market Constraint, kein Goal."}, {"n": 2, "q": "Welche Aussage über <em>necessary conditions</em> ist richtig?", "opts": {"A": "Eine Necessary Condition reicht für sich allein aus, um das Goal zu erreichen", "B": "Eine Necessary Condition kann zugleich eine Sufficient Condition sein", "C": "Eine Necessary Condition ist erforderlich, reicht für sich allein aber nicht aus", "D": "Necessary Conditions gelten nur für Non-Profit-Organisationen"}, "gebied": 1, "a": "C", "e": "Eine Necessary Condition ist erforderlich, reicht für sich allein aber nicht aus. A beschreibt eine Sufficient Condition. B passt nicht zum Dictionary, denn dort reicht eine Necessary Condition für sich allein gerade nicht aus. D ist falsch; auch kommerzielle Unternehmen haben Necessary Conditions."}, {"n": 3, "q": "Ein Unternehmen verbessert die Effizienz aller Abteilungen um 10 Prozent, außer der des Constraints. Was sagt die Kettenanalogie über das Ergebnis?", "opts": {"A": "Die Ausbringung steigt um etwa 10 Prozent", "B": "Die Ausbringung steigt proportional zur Zahl der verbesserten Abteilungen", "C": "Die Ausbringung ändert sich nicht wesentlich", "D": "Die Ausbringung sinkt, weil der Constraint überlastet wird"}, "gebied": 1, "a": "C", "e": "Die Kettenstärke wird vom schwächsten Glied bestimmt. Verbesserungen an anderer Stelle ändern die Ausbringung nicht wesentlich. A und B folgen dem additiven Denken der Cost World. D ist nicht die Aussage der Analogie; höchstens entsteht zusätzlicher Bestand vor dem Constraint."}, {"n": 4, "q": "Welche der folgenden Aussagen gehört NICHT zu den vier Fundamental Assumptions (Säulen) der TOC?", "opts": {"A": "People are good", "B": "Every conflict can be removed", "C": "Every resource must be fully utilized", "D": "Every situation can be substantially improved"}, "gebied": 1, "a": "C", "e": "Die volle Auslastung jeder Ressource ist gerade das, was die TOC ablehnt (Kapitel 2). A, B und D sind drei der vier Säulen; die vierte ist \"every situation is exceedingly simple\"."}, {"n": 5, "q": "Der Begriff <em>constraints management</em> wurde geprägt von:", "opts": {"A": "Goldratt, als Synonym für TOC", "B": "APICS, für den logistischen Teil der TOC", "C": "TOCICO, für das Zertifizierungsprogramm", "D": "Deming, als Teil von TQM"}, "gebied": 1, "a": "B", "e": "Constraints Management ist ein APICS-Begriff für das logistische Paradigma (DBR, Buffer Management, VATI, T, I, OE, TDD, IDD). A, C und D sind falsch."}, {"n": 6, "q": "Was bedeutet \"never say I know\" in der TOC?", "opts": {"A": "Manager sollen ihr Wissen nicht mit Mitarbeitenden teilen", "B": "Jede Situation lässt sich wesentlich verbessern, also stellen Sie weiter Fragen", "C": "Nur externe Berater dürfen Constraints identifizieren", "D": "Wissen über das System ist unzuverlässig und daher unbrauchbar"}, "gebied": 1, "a": "B", "e": "\"Never say I know\" ist die Zusammenfassung der vierten Säule: Jede Situation lässt sich wesentlich verbessern, also suchen Sie weiter. A, C und D verdrehen die Bedeutung."}, {"n": 7, "q": "Welche drei Methoden nennt das Dictionary als <em>processes of ongoing improvement</em> (POOGI)?", "opts": {"A": "Five Focusing Steps, Throughput Accounting, Drum-Buffer-Rope", "B": "Five Focusing Steps, Change Question Sequence, Buffer Management", "C": "Evaporating Cloud, Current Reality Tree, Future Reality Tree", "D": "Identify, Exploit, Subordinate"}, "gebied": 1, "a": "B", "e": "Das Dictionary nennt genau diese drei POOGIs. A enthält Throughput Accounting und DBR, die keine POOGIs sind. C sind Thinking-Process-Tools. D sind drei der fünf Schritte, nicht drei POOGIs."}, {"n": 8, "q": "In den <em>stages of a science</em> gehört die TOC zur Phase:", "opts": {"A": "Classification", "B": "Correlation", "C": "Effect-cause-effect", "D": "Verification"}, "gebied": 1, "a": "C", "e": "Die TOC ist die Effect-Cause-Effect-Phase; MRP ist Classification, JIT ist Correlation. D ist keine Phase aus dem Dictionary."}, {"n": 9, "q": "Was ist ein <em>leverage point</em>?", "opts": {"A": "Der teuerste Teil eines Systems", "B": "Ein Punkt, an dem eine bestimmte Maßnahme eine erhebliche Verbesserung des gesamten Systems bewirkt", "C": "Der Teil mit der höchsten lokalen Effizienz", "D": "Eine finanzielle Hebelwirkung durch Fremdkapital"}, "gebied": 1, "a": "B", "e": "Das ist die Definition. A und C sind Missverständnisse; der Leverage Point ist die Stelle mit der größten Hebelwirkung, nicht mit dem größten Umfang oder der höchsten Effizienz. D ist ein Finanzbegriff, der hier nicht gemeint ist."}, {"n": 10, "q": "Der <em>holistic approach</em> der TOC bedeutet, dass:", "opts": {"A": "Jede Abteilung ihre eigene Leistung selbstständig optimiert", "B": "Eine Veränderung an einer Stelle anderswo Folgen hat und daher das gesamte Ursache-Wirkungs-Netz betrachtet werden muss", "C": "Alle Mitarbeitenden gleichzeitig an Verbesserungen arbeiten", "D": "Die Kosten je Abteilung zu einem Gesamtbild addiert werden"}, "gebied": 1, "a": "B", "e": "Holistic Approach: Eine Veränderung an einer Stelle wirkt in anderen Teilen weiter; deshalb muss das gesamte Ursache-Wirkungs-Netz betrachtet werden. A und D beschreiben das Cost-World-Denken. C ist keine Definition von Ganzheitlichkeit."}]}, {"id": "ch02", "num": 2, "title": "Constraints und das System", "part": 1, "partShort": "Teil 1", "partLong": "TOC Fundamentals Concepts", "gebied": 1, "html": "<h2 id=\"lernziele\">Lernziele</h2>\n<p>Nach diesem Kapitel können Sie:</p>\n<ul>\n<li>Die TOCICO-Definition von <em>constraint</em> erkennen und erklären, warum ein Constraint der Leverage Point eines Systems ist.</li>\n<li>Die Arten von Constraints unterscheiden: Physical/Capacity, Market, Material, Policy, Management, Measures, Dummy, Strategic und Interactive Constraints, und wissen, welche davon das Dictionary einen \"misnomer\" nennt.</li>\n<li>Den Unterschied zwischen <em>bottleneck resource</em>, <em>capacity-constrained resource</em> (CCR) und <em>non-bottleneck</em> bzw. <em>non-constraint</em> erklären.</li>\n<li>Erklären, was <em>dependent events</em> und <em>statistical fluctuations</em> zusammen in einem System bewirken (Herbie, das Streichholzspiel).</li>\n<li>Erklären, warum eine <em>balanced plant</em> eine schlechte Idee ist und welche Rolle <em>protective capacity</em> spielt.</li>\n<li>Die Kapazitätsbegriffe Productive, Protective, Excess und Idle Capacity einordnen und den Unterschied zwischen <em>activation</em> und <em>utilization</em> anwenden.</li>\n</ul>\n<h2 id=\"21-was-ist-ein-constraint\">2.1 Was ist ein Constraint?</h2>\n<p>Das Dictionary definiert einen <em>constraint</em> (Engpass) als den Faktor, der die Leistung eines Systems oder einer Organisation letztlich begrenzt. Es ist der Faktor, der mehr vom Goal erbrächte, wenn die Organisation ihn vergrößern, besser nutzen oder sich ihm besser unterordnen könnte. Englischer Kern: \"The factor that ultimately limits the performance of a system or organization.\"</p>\n<p>Drei Verben in dieser Definition verweisen bereits auf die Five Focusing Steps (Kapitel 3): <em>exploit</em> (ausschöpfen), <em>subordinate</em> (unterordnen) und <em>elevate</em> (erweitern).</p>\n<p>Das Dictionary ergänzt eine Sichtweise, die den Kern der TOC zusammenfasst: Die Existenz von Constraints und die Tatsache, dass man die Leistung verbessert, indem man sie identifiziert und sorgfältig steuert oder beseitigt, sind das Fundament der TOC.</p>\n<p>Das Beispiel aus <em>The Goal</em>: UNICO konnte nicht schnell genug produzieren, um die Nachfrage zu decken. Zwei Ressourcen begrenzten die Ausbringung: die NCX-10 und der Wärmebehandlungsofen. Als UNICO beide ausschöpfte, alles andere ihnen unterordnete und sie schließlich erweiterte, stieg der Gewinn. Später konnte das Werk mehr herstellen, als die Kunden kauften. Der Constraint verlagerte sich auf den Mangel an Aufträgen: Der Markt wurde zum Constraint.</p>\n<h3 id=\"jedes-system-hat-mindestens-einen\">Jedes System hat mindestens einen</h3>\n<p>Ein System ohne Constraint hätte eine unendliche Ausbringung. Jedes System hat also mindestens einen Constraint, aber nie viele zugleich: Die Definition der TOC (Kapitel 1) spricht von \"a very, very small number of variables, perhaps only one\".</p>\n<h2 id=\"22-arten-von-constraints\">2.2 Arten von Constraints</h2>\n<p>Achten Sie genau darauf: Das Dictionary bezeichnet einige verbreitete Benennungen ausdrücklich als <strong>misnomer</strong> (falsche Bezeichnung). Das ist ein beliebtes Prüfungsthema.</p>\n<h3 id=\"physical-oder-capacity-constraint-interne-ressource\">Physical oder Capacity Constraint (interne Ressource)</h3>\n<p>Ein physischer Constraint ist eine Ressource (Maschine, Mensch, Abteilung), deren Kapazität kleiner ist als die Marktnachfrage, wie in <em>The Goal</em>. Das Dictionary verwendet dafür <em>bottleneck resource</em> und <em>capacity-constrained resource</em> (siehe 2.3).</p>\n<h3 id=\"market-constraint\">Market Constraint</h3>\n<p>Ein <em>market constraint</em> (Marktengpass) ist die Situation, in der die Marktnachfrage kleiner ist als die Lieferfähigkeit der Organisation. Die unzureichende Kundennachfrage ist dann der Constraint. Englischer Kern: \"Market demand is less than the organization's capacity to deliver.\"</p>\n<p>Das ist ein echter Constraint, kein Misnomer. Viele Unternehmen befinden sich in dieser Lage. Die Five Focusing Steps funktionieren dann ganz normal: Exploit (den Markt ausschöpfen, zum Beispiel mit einem unwiderstehlichen Angebot), Subordinate (die Produktion unterordnen, immer pünktlich liefern), Elevate (neue Märkte erschließen).</p>\n<h3 id=\"material-constraint\">Material Constraint</h3>\n<p>Ein <em>material constraint</em> (Materialengpass) ist laut Dictionary meist ein Misnomer. Materialknappheit ist selten der Constraint. Sie ist meist vorübergehend, oder das Material ist anderswo oder zu einem höheren Preis erhältlich. Eine Materialknappheit <strong>behindert</strong> vor allem das Ausschöpfen des echten Constraints und das Unterordnen unter ihn. Die Ausnahme, die das Dictionary nennt: die weltweite Stahlknappheit zu Beginn des 21. Jahrhunderts. Damals war Stahl eine Zeit lang wirklich der Constraint.</p>\n<h3 id=\"policy-constraint\">Policy Constraint</h3>\n<p>Ein <em>policy constraint</em> (Richtlinienengpass) ist laut Dictionary ein häufiger Misnomer. Schlechte Richtlinien sind nicht der Constraint; sie behindern die wirksame Steuerung des Constraints. Beispiel: Eine Richtlinie, in \"economic order quantities\" zu produzieren, führt zu übergroßen Batches, mehr WIP und zeitweisem Aushungern des Constraints. Die Richtlinie ist nicht der Constraint, blockiert aber sein Ausschöpfen. Das Dictionary merkt an, dass Policies früher durchaus als eine Art Constraint bezeichnet wurden. Ältere Bücher tun das noch.</p>\n<h3 id=\"management-constraint\">Management Constraint</h3>\n<p>Das Dictionary gibt dem <em>management constraint</em> zwei Bedeutungen:</p>\n<ol>\n<li>Ein Misnomer: Schlechtes Management ist nicht der Constraint, behindert aber Exploit und Subordinate (zum Beispiel, wenn Ingenieure für verspätete Aufgaben bestraft werden und deshalb mehr Sicherheit in ihre Schätzungen einbauen).</li>\n<li>Die verfügbare Zeit des Topmanagements, die unter traditionellem Management ein Constraint ist, weil Manager auf alles achten statt auf die Leverage Points.</li>\n</ol>\n<h3 id=\"measures-constraint\">Measures Constraint</h3>\n<p>Ein <em>measures constraint</em> (Kennzahlenengpass) ist ebenfalls ein Misnomer. Schlechte Kennzahlen sind nicht der Constraint; sie behindern. Beispiel aus dem Dictionary: Die Effizienz aller Ressourcen zu messen treibt die Überproduktion an Non-Bottlenecks an und lässt den Bottleneck aushungern. Die Effizienzmessung ist nicht das, was Sie ausschöpfen müssen, sondern das, was das Ausschöpfen blockiert.</p>\n<h3 id=\"dummy-constraint\">Dummy Constraint</h3>\n<p>Ein <em>dummy constraint</em> (Scheinengpass) ist ein Constraint, der im Verhältnis zu den anderen Ressourcen im System billig ist. Das Dictionary ist eindeutig: Dummy Constraints müssen immer beseitigt werden. Wenn eine Maschine für 5.000 Euro die Ausbringung einer Fabrik im Wert von 50 Millionen begrenzt, kaufen Sie einfach eine zweite.</p>\n<h3 id=\"strategic-constraint\">Strategic Constraint</h3>\n<p>Ein <em>strategic constraint</em> (strategischer Engpass) ist die Stelle, an der das Topmanagement den Constraint bewusst haben und halten will, damit die Organisation das Goal langfristig erreichen kann. Das Dictionary erklärt, dass die Five Focusing Steps nicht als endlose Schleife gedacht sind, in der man immer den nächsten Constraint beseitigt. Das Management wählt, wo der Constraint liegen soll. Meist wird eine Ressource gewählt, die knapp ist, also teuer oder schwer zu erweitern. Die Organisation wächst dann, bis diese Ressource zum Constraint wird.</p>\n<h3 id=\"interactive-constraints\">Interactive Constraints</h3>\n<p><em>Interactive constraints</em> (interagierende Engpässe) sind zwei oder mehr Faktoren (zum Beispiel stark belastete Ressourcen oder Critical Chains), die so aufeinander einwirken, dass der Throughput des Systems unvorhersehbar oder chaotisch wird. Das Dictionary nennt dies einen umfassenderen Begriff als <em>wandering bottleneck</em>: Constraints umfassen auch Critical Chains und Märkte, während Bottlenecks nur knappe Ressourcen in der Produktion betreffen.</p>\n<h3 id=\"uberblick\">Überblick</h3>\n<table>\n<thead>\n<tr>\n<th>Art</th>\n<th>Echter Constraint oder Misnomer?</th>\n<th>Kernpunkt</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Physical / capacity</td>\n<td>Echt</td>\n<td>Interne Ressource mit zu wenig Kapazität</td>\n</tr>\n<tr>\n<td>Market</td>\n<td>Echt</td>\n<td>Nachfrage kleiner als Kapazität</td>\n</tr>\n<tr>\n<td>Material</td>\n<td>Meist Misnomer</td>\n<td>Behindert Exploit/Subordinate; selten echt (Stahl)</td>\n</tr>\n<tr>\n<td>Policy</td>\n<td>Misnomer</td>\n<td>Schlechte Richtlinien behindern</td>\n</tr>\n<tr>\n<td>Management</td>\n<td>Misnomer (Bed. 1) / echt (Bed. 2: Managementzeit)</td>\n<td>Behindert, oder Zeit des Topmanagements</td>\n</tr>\n<tr>\n<td>Measures</td>\n<td>Misnomer</td>\n<td>Schlechte Kennzahlen behindern</td>\n</tr>\n<tr>\n<td>Dummy</td>\n<td>Echt, aber zu billig</td>\n<td>Immer beseitigen</td>\n</tr>\n<tr>\n<td>Strategic</td>\n<td>Bewusst gewählt</td>\n<td>Wo das Management den Constraint halten will</td>\n</tr>\n<tr>\n<td>Interactive</td>\n<td>Echt, unerwünscht</td>\n<td>Mehrere Faktoren machen die Ausbringung chaotisch</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"23-bottleneck-ccr-und-non-constraint\">2.3 Bottleneck, CCR und Non-Constraint</h2>\n<p>Dies ist die am häufigsten geprüfte Unterscheidung dieses Kapitels. Das Dictionary warnt selbst, dass die <em>bottleneck resource</em> oft mit Capacity-Constrained Resource, Drum Resource und Constraint verwechselt wird.</p>\n<h3 id=\"bottleneck-resource\">Bottleneck Resource</h3>\n<p>Eine <em>bottleneck resource</em> (Engpassressource) ist jede Ressource, deren Kapazität in einem bestimmten Zeithorizont kleiner oder gleich der auf sie entfallenden Nachfrage ist. Englischer Kern: \"Any resource whose capacity is less than or equal to the demand placed on it.\"</p>\n<p>Das Dictionary ergänzt, dass Richtlinien (Batch-Regeln, Effizienzsteuerung, Monatsend-Syndrom) Ressourcen oft fälschlich als Bottleneck erscheinen lassen. Nach Schritt 2 und 3 der Five Focusing Steps zeigt sich, dass sie reichlich Kapazität haben, und der Markt wird zum Constraint.</p>\n<h3 id=\"capacity-constrained-resource-ccr\">Capacity-Constrained Resource (CCR)</h3>\n<p>Eine <em>capacity-constrained resource</em> (CCR; kapazitätsbeschränkte Ressource) ist jede Ressource, die den Throughput der Organisation wahrscheinlich gefährdet, wenn ihre Kapazität nicht sorgfältig gesteuert wird. Englischer Kern: \"Any resource that, if its capacity is not carefully managed, is likely to compromise throughput.\"</p>\n<p>Der Unterschied zum Bottleneck: Eine CCR hat im Durchschnitt <strong>durchaus</strong> genug Kapazität, aber so wenig Spielraum, dass Schwankungen die Ausbringung unter die Nachfrage drücken können. Beispiel aus dem Dictionary: Von fünf Ressourcen A bis E schwankt D so stark, dass der Throughput sinkt, wenn D nicht gut gesteuert wird. D ist eine CCR.</p>\n<h3 id=\"non-bottleneck-resource-und-non-constraint\">Non-Bottleneck Resource und Non-Constraint</h3>\n<p>Eine <em>non-bottleneck resource</em> hat mehr Kapazität als Nachfrage. Ein <em>non-constraint</em> (Nicht-Engpass) hat mehr Kapazität (oft ungenutzt) als der Constraint und soll nicht auf volle Auslastung zielen, sondern sich dem Constraint unterordnen.</p>\n<h3 id=\"vergleichstabelle\">Vergleichstabelle</h3>\n<table>\n<thead>\n<tr>\n<th>Begriff</th>\n<th>Kapazität versus Nachfrage</th>\n<th>Steuern?</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Bottleneck Resource</td>\n<td>Kapazität &lt;= Nachfrage</td>\n<td>Ja, immer; jede verlorene Stunde ist ein Systemverlust</td>\n</tr>\n<tr>\n<td>CCR</td>\n<td>Kapazität knapp &gt; Nachfrage, aber anfällig für Schwankungen</td>\n<td>Ja, sorgfältig planen</td>\n</tr>\n<tr>\n<td>Non-Bottleneck / Non-Constraint</td>\n<td>Kapazität &gt; Nachfrage</td>\n<td>Unterordnen; nicht maximal auslasten</td>\n</tr>\n<tr>\n<td>Constraint</td>\n<td>Was die Systemleistung begrenzt (kann Ressource, Markt usw. sein)</td>\n<td>Fokus der Five Focusing Steps</td>\n</tr>\n</tbody>\n</table>\n<p>Wichtig: Ein Constraint ist nicht immer ein Bottleneck (der Markt kann der Constraint sein). Und ein System kann eine CCR ohne Bottleneck haben: Die CCR ist dann die <em>drum</em> (die Ressource, auf der die Planung beruht), während der Markt der Constraint ist.</p>\n<h3 id=\"wandering-temporary-und-permanent-bottleneck\">Wandering, Temporary und Permanent Bottleneck</h3>\n<ul>\n<li><em>Wandering bottleneck</em> (wandernder Bottleneck; syn. floating bottleneck): ein unerwünschter Effekt, bei dem der Bottleneck relativ häufig von einer Ressource zur anderen springt. Das ist oft die Folge schlechter Richtlinien (große Batches, Effizienzsteuerung) und macht das System unsteuerbar.</li>\n<li><em>Temporary bottleneck</em> (vorübergehender Bottleneck): Die Nachfrage nach einer Ressource übersteigt kurzzeitig die Kapazität.</li>\n<li><em>Permanent bottleneck</em> (dauerhafter Bottleneck): Funktionen, die intern ein Bottleneck bleiben, ganz gleich, wie viele Mittel man ihnen zuweist. Das Dictionary nennt als Beispiel im Dienstleistungsbereich die IT-Funktion sowie die Vertriebs- und Marketingfunktion.</li>\n</ul>\n<h2 id=\"24-dependent-events-und-statistical-fluctuations\">2.4 Dependent Events und Statistical Fluctuations</h2>\n<p>Warum ist eine Kette etwas anderes als eine Summe? Wegen zweier Erscheinungen, die in jedem System gemeinsam auftreten, in dem ein Teil den nächsten versorgt.</p>\n<p><em>Dependent events</em> (abhängige Ereignisse) sind eine Folge von Ereignissen, bei der jedes Ereignis erst abgeschlossen werden kann, nachdem bestimmte vorangehende Ereignisse stattgefunden haben. Beispiel aus dem Dictionary: Im Restaurant bezahlt der Gast erst nach dem Essen, isst erst nach dem Servieren, wird erst nach der Bestellung bedient und bestellt erst, wenn er am Tisch sitzt.</p>\n<p><em>Statistical fluctuations</em> (statistische Schwankungen) ist der TOC-Begriff für zufällige Schwankungen. Ein Arbeitsgang dauert einmal 4 Minuten und ein andermal 7. Die TOC verwendet auch den Spitznamen <em>Murphy</em> (nach Murphy's Law: Alles, was schiefgehen kann, geht schief) für ungeplante Schwankungen wie Maschinenausfälle, Qualitätsprobleme und verspätete Lieferungen. Puffer schützen vor Murphy.</p>\n<p>Das Dictionary stellt fest: Genau weil diese beiden Faktoren gemeinsam auftreten, sind die Elemente von Drum-Buffer-Rope (Produktion) und Critical Chain (Projekte) notwendig.</p>\n<h3 id=\"herbie-die-pfadfinderwanderung\">Herbie: die Pfadfinderwanderung</h3>\n<p>In <em>The Goal</em> führt Alex eine Gruppe Pfadfinder über einen schmalen Pfad (Dependent Events). Jeder Junge geht mit wechselnder Geschwindigkeit (Statistical Fluctuations). Herbie ist der Langsamste.</p>\n<ul>\n<li>Die Jungen vor Herbie laufen davon; der Abstand wächst (vor dem Constraint häuft sich Bestand an).</li>\n<li>Die Jungen hinter Herbie können nicht schneller als Herbie gehen und bleiben regelmäßig stehen.</li>\n<li>Der Throughput der Gruppe ist Herbies Geschwindigkeit.</li>\n</ul>\n<p>Die Lösung im Buch: Herbie nach vorn stellen (alle ordnen sich unter), seinen Rucksack leeren (Exploit) und den Inhalt auf die anderen verteilen (Offload auf Non-Constraints). Die Gruppe läuft danach schneller als je zuvor.</p>\n<h3 id=\"das-streichholzspiel-match-bowl-game\">Das Streichholzspiel (match-bowl game)</h3>\n<p>Ebenfalls in <em>The Goal</em>: fünf Jungen, fünf Schalen in einer Reihe, ein Würfel, Streichhölzer. In jeder Runde legt jeder Junge so viele Streichhölzer in die nächste Schale, wie er würfelt, <strong>aber nie mehr, als in seiner Schale liegen</strong>. Im Durchschnitt würfelt jeder 3,5, also erwartet man 3,5 Streichhölzer pro Runde aus dem System. Das geschieht nicht: Die Ausbringung liegt strukturell niedriger, und der Bestand zwischen den Schalen wächst. Warum?</p>\n<table>\n<thead>\n<tr>\n<th>Runde</th>\n<th>Junge 1 würfelt</th>\n<th>Junge 2 würfelt</th>\n<th>Tatsächlich weitergegeben</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>1</td>\n<td>6</td>\n<td>1 (die Schale von J2 war leer und er erhielt nur 1 Streichholz; sein hoher Wurf geht verloren)</td>\n</tr>\n<tr>\n<td>2</td>\n<td>6</td>\n<td>2</td>\n<td>2 (J2 kann nicht mehr weitergeben, als er würfelt; 4 Streichhölzer bleiben in seiner Schale)</td>\n</tr>\n</tbody>\n</table>\n<p>Ein hoher Wurf hilft nicht, wenn der vorige Junge wenig weitergegeben hat. Ein niedriger Wurf wird nie ausgeglichen; er pflanzt sich fort. Schwankungen in einer Kette abhängiger Ereignisse <strong>akkumulieren sich</strong> in die ungünstige Richtung. Deshalb verhält sich eine Kette nicht wie eine Summe, und deshalb dürfen Kapazitäten nicht auf die Nachfrage abgestimmt werden.</p>\n<h2 id=\"25-die-balanced-plant-und-warum-sie-scheitert\">2.5 Die Balanced Plant und warum sie scheitert</h2>\n<p>Eine <em>balanced plant</em> (ausgeglichene Fabrik) ist eine Fabrik, in der die Kapazität aller Ressourcen einem bestimmten Ausbringungsniveau entspricht. Englischer Kern: \"A plant in which the capacity of all resources is equal to a given level of output.\"</p>\n<p>Das Dictionary vergleicht drei Philosophien:</p>\n<table>\n<thead>\n<tr>\n<th>Philosophie</th>\n<th>Ideal</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Traditionell</td>\n<td>Balanced Plant: jede Kapazität gleich der Nachfrage (Kostenminimierung)</td>\n</tr>\n<tr>\n<td>Lean</td>\n<td>Balanced Plant: Kapazität gleich der täglichen Nachfrage</td>\n</tr>\n<tr>\n<td>TOC</td>\n<td>Den <strong>Flow</strong> ausgleichen, nicht die Kapazität</td>\n</tr>\n</tbody>\n</table>\n<p>Warum scheitert die Balanced Plant? Wegen Dependent Events plus Statistical Fluctuations. Wenn jede Ressource genau 100 Stück pro Tag schafft und die Nachfrage 100 beträgt, verlieren Sie bei jeder Störung Ausbringung, die Sie nie mehr aufholen, denn niemand hat Reserve. Die Alternative der TOC: Eine Ressource (der Constraint oder die Drum) bestimmt das Tempo. Alle anderen Ressourcen haben bewusst <strong>mehr</strong> Kapazität, damit sie Störungen aufholen können und den Constraint nie aushungern lassen. Das nennt man den Flow ausgleichen.</p>\n<h2 id=\"26-arten-von-kapazitat\">2.6 Arten von Kapazität</h2>\n<p>Um über „mehr Kapazität als nötig“ sprechen zu können, teilt die TOC die Kapazität eines Non-Constraints in Teile.</p>\n<table>\n<thead>\n<tr>\n<th>Begriff</th>\n<th>Bedeutung</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><em>Productive capacity</em> (produktive Kapazität)</td>\n<td>Kapazität, die nötig ist, um genug für den Bedarf des Constraints zu produzieren</td>\n</tr>\n<tr>\n<td><em>Idle capacity</em> (ungenutzte Kapazität)</td>\n<td>Alle Kapazität an Non-Constraints über dem, was zur Unterstützung des Constraints nötig ist; besteht aus Protective plus Excess</td>\n</tr>\n<tr>\n<td><em>Protective capacity</em> (Schutzkapazität)</td>\n<td>Teil der Idle Capacity, der nötig ist, um aufzuholen, wenn Murphy zuschlägt, damit der Puffer vor dem Constraint wieder gefüllt wird; syn. <em>sprint capacity</em></td>\n</tr>\n<tr>\n<td><em>Excess capacity</em> (Überschusskapazität)</td>\n<td>Kapazität, die weder Throughput erzeugt noch schützt; verfügbar für zusätzlichen Verkauf oder zum Abbau</td>\n</tr>\n</tbody>\n</table>\n<p class=\"diagram\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAqgAAAC4CAIAAACgk4m5AABLIklEQVR4nO3dZ0AU1/ow8LMdWHpnKQIqSAcRBAWxg6AYSzQa7KiJxpLEXqK5GhVrjMEkdlFibygqVRRBURSk99777sLCsmXeD+f9z90sxmtsGPf5fWLKnnmmOM+cMiOFIAgEAAAAAMVA7e0AAAAAAPDhQOIHAAAAFAgkfgAAAECBQOIHAAAAFAgkfgAAAECBQOIHAAAAFAgkfgAAAECB0P9uQXV1dXR0dFFRUWdnp5GRkYWFxYgRI3R0dD5kcP9TR0dHUlJSYmLitm3bejeSxMTEuLi4ZcuWvb9D1NDQ8PTp08zMTDabvWzZsrcpqqSkJD09XSAQ0Gg0MzOzoUOHyi4VCATx8fFcLpcgiM7OzmnTpmloaLxd7C/35MmTuLi46upqsVisoaFhbGzs4uLi7e39Prb1lsLCwtra2pYuXUqj0Xo7FgAAeCsvqfELhcL169cPGTLk1KlTAwYMGDVqlEgkWr9+/aBBgyIjIz98iH+Hz+cHBwfPmzfv3LlzvR0L2r9//9GjR69fv/53Kxw5csTBwSE9Pf3QoUPOzs6ZmZn/dBOdnZ2XL18+dOjQ8+fP3ypWhOh0el1dXUhIyKpVq2bMmCF3AOl0Oo/HO378+B9//GFgYMBms99ycz01NzfPnDlz0qRJdXV1kydPnj59OpPJ3Ldv3+zZs/l8/jvf3FsSi8UbN24MCQnJy8vr7VgAAOCtEX8lEolmzJjB4XDGjx/f0dFBzq+oqBg0aNDOnTuJj4lYLDY2Nra0tOztQIiHDx+uWbOmubn571ZYs2YNh8O5ffv2ypUrORxOXFzcG2wlLi6Ow+EEBQW9RaT/dfXqVQ6Hw+FwjI2NT5w4Ibf0yJEj27dvfycbksPn80eNGsXhcLZs2SI7//Hjx3379n2zI/O+nT59OiQkRCKR9HYgAADwtuQT/8mTJ3EmyM/Pl1v05MmTsLCwDxXY3zpy5MjZs2fJyb59+1pYWLxBOV1dXf/0JyKRSCQSvebKP/zwQ0JCguxvS0pKCILo7u4uKyuTXfPmzZt79ux5nTKTk5PfYeJPSUnx9/e3t7fHZ/zo0aOySy9fviyXmN+VnTt3cjgcS0tLHo8nt+jhw4fZ2dnvY6MEQdy+fXvXrl3vqXBZAoHA398fnhIAAB8n+T7+M2fOIIRsbW2trKzkFrm5ubm5uZGTQqHwxo0bVVVVRkZG/v7+ZDdwQ0PD3bt329rajIyMfHx89PX1yaaFJ0+elJaWCgSCsWPHmpiY4Pl8Pn/NmjW7du169OhRenq6mpratGnT9PT00tPTHzx4QKPRxo8f36dPH1zClStXfvrpp82bN3O5XDU1NSqVSqW+anyi7EZ9fX2NjY0RQmVlZdeuXQsPD09JSUlNTa2oqNDU1BwxYgSd/t+j0dzcjBdxOBw/Pz/cs/v777+rq6v7+PhIpVLcIs1kMgcMGIAQKi0t/e677zZt2uTq6ioWi48ePXr8+HFPT08ul4uPDJ1OJwjixo0bDQ0NTk5OeI8QQvHx8atXr545cyaXy2Wz2bIxYFKp9NGjR2VlZTo6OkwmE88hl3Z0dFy/fr2+vt7MzMzPz09VVRXPr6qqiomJ4fP5JiYmI0aM0NLS6nlwlJSULC0tf/nll5kzZ1ZVVW3duhUhFBwcjJeqqal1dXXJrl9eXh4fH9/S0mJubu7j46Orq0suCgsLE4lEU6ZMuX37dltbm4+Pj52d3UvPiFQqPX/+
