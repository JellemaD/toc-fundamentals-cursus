<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TOC Fundamentals Cursus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
:root{
  --bg:#f6f4ee; --card:#ffffff; --ink:#1d1d1b; --muted:#6b6b66; --line:#dcd9d0;
  --accent:#1b4d89; --accent-ink:#ffffff; --gold:#c99a2e;
  --ok:#2e7d4f; --ok-bg:#e3f3e8; --bad:#b3362b; --bad-bg:#fbe6e3;
  --code-bg:#efece4; --shadow:0 1px 3px rgba(0,0,0,.08);
  --zg:#2e7d4f; --zy:#b8860b; --zr:#b3362b; --zg-bg:#e3f3e8; --zy-bg:#fbf1d6; --zr-bg:#fbe6e3;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171a; --card:#1f2226; --ink:#e9e7e1; --muted:#a09d95; --line:#33373d;
    --accent:#6ea3e6; --accent-ink:#0f1a2a; --gold:#e0b04a;
    --ok:#6fcf97; --ok-bg:#1f3a2b; --bad:#f08c7d; --bad-bg:#3f221f;
    --code-bg:#262a30; --shadow:0 1px 3px rgba(0,0,0,.4);
    --zg:#6fcf97; --zy:#e0b04a; --zr:#f08c7d; --zg-bg:#1f3a2b; --zy-bg:#3a3120; --zr-bg:#3f221f;
  }
}
:root[data-theme="dark"]{
  --bg:#15171a; --card:#1f2226; --ink:#e9e7e1; --muted:#a09d95; --line:#33373d;
  --accent:#6ea3e6; --accent-ink:#0f1a2a; --gold:#e0b04a;
  --ok:#6fcf97; --ok-bg:#1f3a2b; --bad:#f08c7d; --bad-bg:#3f221f;
  --code-bg:#262a30; --shadow:0 1px 3px rgba(0,0,0,.4);
  --zg:#6fcf97; --zy:#e0b04a; --zr:#f08c7d; --zg-bg:#1f3a2b; --zy-bg:#3a3120; --zr-bg:#3f221f;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Serif 4",Georgia,"Times New Roman",serif;font-size:var(--fs,17px);line-height:1.5}
.sans,.btn,.opt b,.pill,.row .s,.card h2,.timer,.zone{font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--accent);color:var(--accent-ink);padding:env(safe-area-inset-top) 0 0;box-shadow:var(--shadow)}
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px;min-height:52px}
.bar h1{font-size:16px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.bar button{background:transparent;border:0;color:inherit;font-size:22px;padding:4px 8px;line-height:1;cursor:pointer;border-radius:8px}
.bar button:active{background:rgba(255,255,255,.2)}
.langs{display:flex;gap:5px}
.langbtn{color:inherit;text-decoration:none;font-size:13px;font-weight:600;border:1.5px solid rgba(255,255,255,.7);border-radius:6px;padding:3px 7px;letter-spacing:.04em}
main{max-width:760px;margin:0 auto;padding:14px 14px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 12px;box-shadow:var(--shadow)}
.card h2{margin:0 0 6px;font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;border:0}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer;-webkit-tap-highlight-color:transparent}
.row:first-of-type{border-top:0}
.row .n{flex:0 0 34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:16px;line-height:1.25}
.row .t small{color:var(--muted);font-size:13px}
.row .s{font-size:13px;color:var(--muted);white-space:nowrap}
.zone{display:inline-block;padding:3px 9px;border-radius:6px;font-size:13px;font-weight:600;white-space:nowrap}
.zone.g{background:var(--zg-bg);color:var(--zg)}.zone.y{background:var(--zy-bg);color:var(--zy)}.zone.r{background:var(--zr-bg);color:var(--zr)}
.score .big.g{color:var(--zg)}.score .big.y{color:var(--zy)}.score .big.r{color:var(--zr)}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 18px;font-size:16px;font-weight:600;cursor:pointer;text-align:center;-webkit-tap-highlight-color:transparent}
.btn.sec{background:transparent;color:var(--accent);border:2px solid var(--accent)}
a.btn{text-decoration:none}
.card.buy{border:2px solid var(--gold)}
.row.locked{opacity:.6}
.btn.block{display:block;width:100%;margin:8px 0}
.btn:disabled{opacity:.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 2px}
.prog i{display:block;height:100%;background:var(--gold)}
/* content */
.content h1{font-size:1.45em;line-height:1.25;margin:.2em 0 .6em}
.content h2{font-size:1.2em;margin:1.4em 0 .5em;padding-bottom:.2em;border-bottom:1px solid var(--line)}
.content h3{font-size:1.05em;margin:1.2em 0 .4em}
.content p{margin:0 0 .8em}
.content ul,.content ol{padding-left:1.3em;margin:0 0 .9em}
.content li{margin-bottom:.3em}
.content table{border-collapse:collapse;width:100%;font-size:.9em;margin:.6em 0 1em;display:block;overflow-x:auto}
.content th,.content td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
.content th{background:var(--code-bg)}
.content pre{background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;font-size:.78em;line-height:1.3}
.content code{font-family:Menlo,Consolas,monospace;font-size:.9em}
.content blockquote{margin:.6em 0;padding:.2em 0 .2em .9em;border-left:3px solid var(--gold);color:var(--muted)}
.content hr{border:0;border-top:1px solid var(--line);margin:1.4em 0}
.content img{max-width:100%}
.content p.diagram{text-align:center;margin:.9em 0 1.1em}
.content p.diagram img{width:100%;max-width:560px;height:auto;background:#fff;border:1px solid var(--line);border-radius:8px}
/* quiz */
.q{font-size:1.05em;margin:0 0 14px}
.q .nr{color:var(--muted);font-size:.85em;display:block;margin-bottom:4px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:11px 12px;margin:0 0 8px;font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.opt b{flex:0 0 22px;color:var(--accent)}
.opt.sel{border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default;opacity:1}
.expl{border-left:4px solid var(--gold);background:var(--card);padding:10px 12px;margin:10px 0;border-radius:0 10px 10px 0}
.expl.ok{border-color:var(--ok)}
.expl.bad{border-color:var(--bad)}
.expl .v{font-weight:700;display:block;margin-bottom:4px}
.score{text-align:center;padding:18px 0}
.score .big{font-size:52px;font-weight:700;line-height:1;color:var(--accent)}
.score .sub{color:var(--muted);margin:6px 0 14px}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;background:var(--code-bg);color:var(--muted);margin-right:6px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.toolbar .btn{padding:9px 13px;font-size:14px;flex:1}
.timer{font-variant-numeric:tabular-nums;font-family:Menlo,Consolas,monospace;font-size:14px;opacity:.9}
input.search{width:100%;padding:11px 12px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin:0 0 12px}
.hidden{display:none!important}
.bottomnav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 10px calc(6px + env(safe-area-inset-bottom));gap:8px;z-index:5}
.bottomnav .btn{flex:1;padding:10px;font-size:15px}
.chk{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:15px}
.muted{color:var(--muted)}
.small{font-size:.9em}
</style>
</head>

<script>
const DATA = [{"id": "ch00", "num": 0, "title": "Het TOCFC-examen en hoe je deze cursus gebruikt", "part": 0, "partShort": "Deel 0", "partLong": "Het examen", "gebied": null, "html": "<h2 id=\"waarvoor-deze-cursus-is\">Waarvoor deze cursus is</h2>\n<p>Deze cursus bereidt je voor op de <em>TOC Fundamentals Certification</em> (TOCFC) van TOCICO, de Theory of Constraints International Certification Organization. Het examen toetst of je de basisbegrippen, overtuigingen en principes van de Theory of Constraints (TOC) herkent en begrijpt. Je hoeft nog niets te implementeren. Je moet wel de terminologie feilloos kennen, want bijna elke examenvraag draait om een definitie of om het onderscheid tussen twee begrippen die op elkaar lijken.</p>\n<p>De cursus is Nederlandstalig, maar het examen is Engels. Daarom staat elke vakterm in het Engels, met een Nederlandse uitleg. Leer de Engelse termen. Het proefexamen in hoofdstuk 15 is volledig Engels, zodat je went aan de formulering.</p>\n<h2 id=\"de-drie-certificeringsniveaus\">De drie certificeringsniveaus</h2>\n<p>TOCICO kent drie niveaus. Elk niveau bouwt op het vorige.</p>\n<table>\n<thead>\n<tr>\n<th>Niveau</th>\n<th>Naam</th>\n<th>Wat je aantoont</th>\n<th>Vorm</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>Fundamentals (TOCFC)</td>\n<td>Herkennen en begrijpen van basisbegrippen en terminologie</td>\n<td>Online multiple-choice</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Practitioner (TOCPC)</td>\n<td>Toepassen, analyseren en evalueren in een specifiek toepassingsgebied</td>\n<td>Examen per gebied, na Fundamentals</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Implementer (TOCIC)</td>\n<td>Uitgebreid toepassen in eigen werk</td>\n<td>Assessment</td>\n</tr>\n</tbody>\n</table>\n<p>Op niveau 1 bestaan naast het brede <em>TOC Fundamentals</em>-examen ook aparte Fundamentals-examens per gebied: Critical Chain Project Management (CCPM), Thinking Processes (TP), Supply Chain Logistics (SCL), Production and Operations Management (POM) en Finance and Measures (FM). Deze cursus richt zich op het brede TOC Fundamentals-examen. Dat examen dekt alle gebieden op basisniveau, en is de eerste stap naar elk Practitioner-examen.</p>\n<h2 id=\"het-examen-in-cijfers\">Het examen in cijfers</h2>\n<table>\n<thead>\n<tr>\n<th>Onderdeel</th>\n<th>Waarde</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Aantal vragen</td>\n<td>60, multiple-choice</td>\n</tr>\n<tr>\n<td>Tijd</td>\n<td>2,5 uur</td>\n</tr>\n<tr>\n<td>Taal</td>\n<td>Engels (online). Chinees gepland voor 2027, alleen op locatie</td>\n</tr>\n<tr>\n<td>Kosten leden</td>\n<td>$99</td>\n</tr>\n<tr>\n<td>Kosten niet-leden</td>\n<td>$196, inclusief 1 jaar TOCICO-lidmaatschap</td>\n</tr>\n<tr>\n<td>Voorkennis vereist</td>\n<td>Geen</td>\n</tr>\n<tr>\n<td>Toezicht</td>\n<td>Online proctoring via MonitorEDU, met twee camera's</td>\n</tr>\n<tr>\n<td>Resultaat</td>\n<td>Digitaal certificaat, titel \"TOC Fundamentals Certified (TOCFC)\"</td>\n</tr>\n</tbody>\n</table>\n<p>TOCICO publiceert geen officiële slaaggrens op de examenpagina. Reken op minimaal 70 procent en streef naar 80 procent op het proefexamen voordat je het echte examen boekt. Je hebt gemiddeld 2,5 minuut per vraag. Dat is ruim. Lees elke vraag twee keer.</p>\n<h2 id=\"de-officiele-leerdoelen\">De officiële leerdoelen</h2>\n<p>TOCICO deelt het examen in drie gebieden. De tekst hieronder is de officiële formulering van de examenpagina. Elk gebied is een deel van deze cursus.</p>\n<h3 id=\"gebied-1-toc-fundamentals-concepts-deel-1-hoofdstuk-1-tot-5\">Gebied 1: TOC Fundamentals Concepts (Deel 1, hoofdstuk 1 tot 5)</h3>\n<p>\"Demonstrate recognition and understanding of the foundational TOC principles, core metrics, and key distinctions in TOC thinking.\"</p>\n<ul>\n<li>\"Understand and apply basic TOC beliefs, paradigms, and the Five Focusing Steps\"</li>\n<li>\"Distinguish between simple vs. complex systems\"</li>\n<li>\"Explain goals, necessary conditions, constraints, and global TOC metrics\"</li>\n<li>\"Differentiate 'cost world' vs. 'throughput world' thinking\"</li>\n</ul>\n<h3 id=\"gebied-2-toc-thinking-processes-deel-2-hoofdstuk-6-tot-9\">Gebied 2: TOC Thinking Processes (Deel 2, hoofdstuk 6 tot 9)</h3>\n<p>\"Demonstrate recognition and understanding of core TOC Thinking Processes concepts, tools, and basic logical relationships used to support structured problem-solving.\"</p>\n<ul>\n<li>\"Identify the Change Sequence and core TP tools\"</li>\n<li>\"Apply logical relationships, categories of legitimate reservations, and assumptions\"</li>\n<li>\"Create conflict clouds and logical branches for given scenarios\"</li>\n<li>\"Describe injections, entity relationships, and win-win conflict resolution\"</li>\n</ul>\n<h3 id=\"gebied-3-toc-applications-deel-3-hoofdstuk-10-tot-14\">Gebied 3: TOC Applications (Deel 3, hoofdstuk 10 tot 14)</h3>\n<p>\"Demonstrate recognition and understanding of TOC principles across supply chain, finance, and project management, including identifying bottlenecks, using buffers, and supporting effective communication and change management.\"</p>\n<ul>\n<li>\"Demonstrate TOC principles in: 1. Supply chain/logistics (Simplified-DBR) 2. Finance and measurements 3. Critical Chain Project Management (CCPM), single &amp; multi-project environments\"</li>\n<li>\"Identify bottlenecks, use buffers, and develop effective communication flows\"</li>\n<li>\"Understand and address resistance to change using TOC's layered approach\"</li>\n</ul>\n<h2 id=\"het-officiele-studiemateriaal\">Het officiële studiemateriaal</h2>\n<p>Met een TOCICO-lidmaatschap krijg je toegang tot:</p>\n<ul>\n<li>De <em>TOCICO Dictionary</em> (2e editie, 2012). Dit is de belangrijkste bron. De examenvragen volgen de definities uit dit woordenboek. Deze cursus is erop gebaseerd.</li>\n<li>De video's <em>What is TOC</em> en <em>Basics of TOC</em>.</li>\n<li><em>A Guide to Implementing the Theory of Constraints</em>.</li>\n</ul>\n<p>Niet inbegrepen, wel aanbevolen door TOCICO:</p>\n<ul>\n<li><em>Theory of Constraints Handbook</em> (Cox en Schleier).</li>\n<li><em>The Goal</em> (boek en film) van Eliyahu Goldratt. Lees het boek in elk geval. Het is de snelste manier om de begrippen bottleneck, dependent events en statistical fluctuations te voelen.</li>\n<li><em>TOC Self Learning Program</em> (Goldratt Satellite Program).</li>\n<li><em>Beyond the Goal</em> (Necessary and Sufficient serie).</li>\n<li><em>Production the TOC Way with Simulator</em>.</li>\n<li><em>TOC Insights</em> voor Operations, Finance and Measurements, Project Management en Distribution.</li>\n</ul>\n<h2 id=\"hoe-deze-cursus-is-opgebouwd\">Hoe deze cursus is opgebouwd</h2>\n<p>Elk hoofdstuk (1 tot 14) heeft dezelfde structuur:</p>\n<ol>\n<li><strong>Leerdoelen.</strong> Wat je na het hoofdstuk moet kunnen.</li>\n<li><strong>Uitleg met voorbeelden.</strong> Engelse term cursief, Nederlandse uitleg erbij.</li>\n<li><strong>Examenvallen.</strong> Begrippen die op het examen door elkaar worden gehaald.</li>\n<li><strong>Samenvatting.</strong> Puntsgewijs, om te herhalen.</li>\n<li><strong>Oefenvragen.</strong> Tien multiple-choice vragen in examenstijl.</li>\n<li><strong>Antwoorden.</strong> Met uitleg waarom het juiste antwoord juist is en de afleiders fout.</li>\n</ol>\n<p>Deel 4 bevat het proefexamen (60 Engelse vragen), een kernbegrippenlijst van Engels naar Nederlands en een spiekbriefje met formules en lijstjes.</p>\n<h2 id=\"studieplan-van-vier-weken\">Studieplan van vier weken</h2>\n<p>Plan ongeveer 4 tot 6 uur per week. Lees eerst, maak daarna de oefenvragen zonder terug te bladeren, en kijk pas dan na.</p>\n<table>\n<thead>\n<tr>\n<th>Week</th>\n<th>Hoofdstukken</th>\n<th>Extra</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>1 tot 5 (Fundamentals Concepts)</td>\n<td>Lees of herlees The Goal</td>\n</tr>\n<tr>\n<td>2</td>\n<td>6 tot 9 (Thinking Processes)</td>\n<td>Teken zelf een cloud van een eigen conflict</td>\n</tr>\n<tr>\n<td>3</td>\n<td>10 tot 14 (Applications)</td>\n<td>Bekijk de What is TOC en Basics of TOC video's</td>\n</tr>\n<tr>\n<td>4</td>\n<td>15 (proefexamen), 16 en 17</td>\n<td>Herhaal hoofdstukken waar je onder 80 procent scoorde</td>\n</tr>\n</tbody>\n</table>\n<p>Maak het proefexamen in één keer, met de klok erbij, zonder hulpmiddelen. Zo simuleer je de echte situatie.</p>\n<h2 id=\"het-examen-boeken-en-de-examendag\">Het examen boeken en de examendag</h2>\n<p>Het examen wordt online afgenomen door MonitorEDU. De \"Welcome and Student Directions\" van TOCICO bevatten de regels. De belangrijkste punten staan hieronder.</p>\n<h3 id=\"vooraf-regelen\">Vooraf regelen</h3>\n<ul>\n<li>Boek het examen via het planningsformulier van MonitorEDU (link in de Welcome-brief). Verzetten of vragen: per e-mail bij MonitorEDU.</li>\n<li>Lees de FAQ en de proctoring-policy op monitoredu.com.</li>\n<li>Bekijk de twee instructievideo's: \"Two Camera Proctoring\" en \"How to Set Up Your Room\".</li>\n<li>Installeer de Google Meet-app op je telefoon.</li>\n<li>Test webcam, microfoon, telefooncamera en schermdelen op je computer.</li>\n</ul>\n<h3 id=\"wat-je-nodig-hebt\">Wat je nodig hebt</h3>\n<ul>\n<li><strong>Twee apparaten.</strong> Een computer of laptop met werkende webcam om het examen op te maken. Een smartphone met werkende camera en Google Meet als tweede camera.</li>\n<li>Beide apparaten aan de stroom en met betrouwbare internetverbinding.</li>\n<li>Een geldig identiteitsbewijs met foto, bij de hand aan het begin van de sessie.</li>\n</ul>\n<h3 id=\"de-ruimte\">De ruimte</h3>\n<ul>\n<li>Alleen in de kamer. Niemand anders aanwezig.</li>\n<li>Schone werkplek. Geen papieren, notities of andere spullen.</li>\n<li>Aan een harde tafel of bureau, op een stoel. Geen bank of bed.</li>\n<li>Volledig gekleed. Geen pet, capuchon, koptelefoon, horloge of slimme bril.</li>\n<li>Je doet een 360-graden scan van de ruimte: vier muren, op het bureau, boven en onder het bureau.</li>\n<li>De telefoon staat zo dat jij, je werkplek en je computerscherm zichtbaar zijn. Toegestane materialen liggen tussen jou en de telefoon.</li>\n</ul>\n<h3 id=\"op-de-examendag-stap-voor-stap\">Op de examendag, stap voor stap</h3>\n<ol>\n<li>Klik op de computer op de link \"Connect with Proctor\" en daarna op \"Connect to Proctor\".</li>\n<li>Bevestig dat je in de juiste omgeving zit en dat je telefoon goed geplaatst kan worden.</li>\n<li>Vul de \"Mobile Device Readiness Agreement\" in.</li>\n<li>Doorloop de \"Testing Device Readiness Check\": camera toestaan, microfoon toestaan, volledig scherm delen.</li>\n<li>Bevestig stroom en internet.</li>\n<li>Vul het formulier in en upload een foto van je ID en een selfie.</li>\n<li>Accepteer de regels van MonitorEDU.</li>\n<li>Klik op \"Connect to Proctor\", controleer je gegevens, klik \"New Conversation\" en dan \"Start Chat\".</li>\n<li>Blijf actief tot de proctor de chat binnenkomt. De naam van de proctor verschijnt bovenaan de chat.</li>\n<li>Werkt de chat niet, klik dan op \"Trouble Connecting\" voor een reservekanaal.</li>\n<li>Volg de aanwijzingen van de proctor bij het opstarten van het examen.</li>\n</ol>\n<h3 id=\"tips-voor-de-vragen-zelf\">Tips voor de vragen zelf</h3>\n<ul>\n<li>Lees de vraag twee keer. Let op woorden als \"not\", \"except\", \"always\", \"never\", \"best\".</li>\n<li>Schrap eerst de antwoorden die zeker fout zijn.</li>\n<li>Bij twijfel tussen twee antwoorden: kies het antwoord dat het dichtst bij de letterlijke definitie uit de TOCICO Dictionary ligt.</li>\n<li>Rekenvragen zijn simpel (throughput, net profit, order quantity). Schrijf de formule uit voordat je rekent. Hoofdstuk 17 heeft alle formules.</li>\n<li>Een bottleneck en een capacity-constrained resource zijn niet hetzelfde. Een constraint en een bottleneck ook niet. Dit soort onderscheid is de kern van het examen.</li>\n</ul>", "q": []}, {"id": "ch01", "num": 1, "title": "Wat is Theory of Constraints?", "part": 1, "partShort": "Deel 1", "partLong": "TOC Fundamentals Concepts", "gebied": 1, "html": "<h2 id=\"leerdoelen\">Leerdoelen</h2>\n<p>Na dit hoofdstuk kun je:</p>\n<ul>\n<li>Uitleggen wat het <em>goal</em> (doel) van een systeem is en hoe <em>necessary conditions</em> (noodzakelijke voorwaarden) zich daartoe verhouden.</li>\n<li>De ketenanalogie (chain analogy) toepassen: een systeem is zo sterk als zijn zwakste schakel.</li>\n<li>De officiële TOCICO-definitie van <em>theory of constraints</em> (TOC) herkennen en onderscheiden van <em>constraints management</em>.</li>\n<li>De vier <em>fundamental assumptions</em> (pijlers) van TOC benoemen en herkennen in examenvragen.</li>\n<li>Begrippen als <em>holistic approach</em>, <em>leverage point</em>, <em>Archimedes lever point</em> en <em>focus</em> correct plaatsen.</li>\n<li>Kort aangeven wat een <em>process of ongoing improvement</em> (POOGI) is en wat de drie <em>stages of a science</em> zijn.</li>\n</ul>\n<h2 id=\"11-waarom-bestaat-een-organisatie-het-goal\">1.1 Waarom bestaat een organisatie? Het goal</h2>\n<p>Elke organisatie is een systeem dat door iemand is opgericht met een bedoeling. TOC noemt die bedoeling het <em>goal</em> (doel; de reden waarvoor het systeem is gecreëerd, bepaald door de eigenaren). Engelse kern: \"The purpose for which the system was created as determined by the owners.\"</p>\n<p>Let op twee dingen in die definitie:</p>\n<ol>\n<li>Het goal wordt bepaald door de <strong>eigenaren</strong>, niet door het management of de medewerkers.</li>\n<li>Het goal is een <strong>purpose</strong> (bedoeling), geen meetlat. Meten komt later.</li>\n</ol>\n<p>Voor de meeste commerciële bedrijven luidt het goal: \"make more money now and in the future\" (nu en in de toekomst meer geld verdienen). Dit is de formulering uit Goldratts roman <em>The Goal</em> (1984), waarin fabrieksmanager Alex Rogo met hulp van zijn oude natuurkundeleraar Jonah ontdekt dat zijn fabriek niet bestaat om efficiënt te zijn, maar om geld te verdienen.</p>\n<p>De eenheid waarin het goal wordt uitgedrukt heet een <em>goal unit</em> (doeleenheid). Bij een winstgevend bedrijf is dat geld. Bij een ziekenhuis kan dat \"aantal genezen patiënten\" zijn, bij een leger \"aantal bereikte doelstellingen\". Het examen toetst vooral het commerciële geval, maar de term goal unit komt terug in de definitie van throughput (hoofdstuk 4).</p>\n<h3 id=\"necessary-conditions\">Necessary conditions</h3>\n<p>Naast een goal heeft elk systeem <em>necessary conditions</em> (noodzakelijke voorwaarden; eisen die op zichzelf niet voldoende zijn, maar zonder welke het goal niet bereikt kan worden). Engelse kern: \"A requirement which by itself is not sufficient... to achieve the goal.\"</p>\n<p>Het klassieke voorbeeld:</p>\n<table>\n<thead>\n<tr>\n<th>Element</th>\n<th>Formulering</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Goal</td>\n<td>Make more money now and in the future</td>\n</tr>\n<tr>\n<td>Necessary condition 1</td>\n<td>Satisfy customers now and in the future</td>\n</tr>\n<tr>\n<td>Necessary condition 2</td>\n<td>Provide a secure and satisfying environment for employees now and in the future</td>\n</tr>\n</tbody>\n</table>\n<p>De relatie is belangrijk voor het examen. Klantentevredenheid is <strong>geen</strong> goal, maar een noodzakelijke voorwaarde. Een bedrijf dat klanten wegjaagt, verdient op termijn geen geld meer. Een bedrijf dat medewerkers uitput, evenmin. Maar een bedrijf dat alleen maar tevreden klanten en blije medewerkers heeft en geen winst maakt, bereikt zijn goal niet.</p>\n<p>Een organisatie die uitzonderlijk goed presteert op zowel het goal als de necessary conditions heet in de Dictionary <em>ever-flourishing</em> (blijvend bloeiend).</p>\n<p>Een subtiel punt: de Dictionary contrasteert necessary condition met <em>sufficient condition</em> (voldoende voorwaarde). Een voldoende voorwaarde kan op zichzelf het resultaat opleveren, maar is niet vereist. Het voorbeeld in de Dictionary: de iPod was een voldoende voorwaarde voor de ommekeer van Apple, maar geen noodzakelijke; Apple had ook op een andere manier kunnen herstellen.</p>\n<h2 id=\"12-het-systeem-als-keten\">1.2 Het systeem als keten</h2>\n<p>TOC kijkt naar een organisatie als een <strong>keten</strong> (chain) van afhankelijke schakels. Inkoop levert aan productie, productie aan verkoop, verkoop aan de klant. Elk onderdeel is afhankelijk van het vorige.</p>\n<p>De kernvraag bij een keten is: wat bepaalt de sterkte? Het antwoord: <strong>de zwakste schakel</strong>. Het maakt niet uit hoe sterk de overige schakels zijn. Trek je aan de keten, dan breekt hij op de zwakste plek.</p>\n<pre><code> [S1]--[S2]--[S3]--[s4]--[S5]--[S6]\n  10    12    15     4    11    13   &lt;- draagkracht per schakel\n                     ^\n             zwakste schakel = 4\n             ketensterkte = 4\n</code></pre>\n<p>De gevolgen van deze analogie zijn de basis van alle TOC-logica:</p>\n<ul>\n<li><strong>Versterken van een niet-zwakste schakel</strong> verandert de sterkte van de keten niet. S1 van 10 naar 20 brengen kost geld en levert niets op.</li>\n<li><strong>Versterken van de zwakste schakel</strong> verhoogt de ketensterkte direct. S4 van 4 naar 8 brengen verdubbelt de ketensterkte.</li>\n<li><strong>Zodra S4 sterker wordt dan 10</strong>, is S1 de nieuwe zwakste schakel. De focus verschuift.</li>\n</ul>\n<p>Vertaald naar een organisatie: de \"sterkte\" is de snelheid waarmee het systeem goal units produceert. De zwakste schakel is de <em>constraint</em> (beperking). Hoofdstuk 2 gaat daar diep op in.</p>\n<p>Dit verklaart ook waarom TOC zo sceptisch is over de gedachte \"verbeter overal een beetje\". Als je tien schakels elk 5 procent sterker maakt, wordt de keten misschien 5 procent sterker. Als je één schakel (de juiste) 50 procent sterker maakt, wordt de keten 50 procent sterker.</p>\n<h3 id=\"keten-versus-optelsom\">Keten versus optelsom</h3>\n<p>Het tegenovergestelde model is de organisatie als <strong>optelsom van onafhankelijke onderdelen</strong>. In dat model is de prestatie van het geheel gelijk aan de som van de prestaties van de delen. Dus: verbeter elk deel, en het geheel verbetert. TOC noemt dit de <em>cost-world</em> denkwijze (hoofdstuk 4). De ketenanalogie zegt dat dit model faalt zodra de delen van elkaar afhankelijk zijn.</p>\n<h2 id=\"13-goldratt-en-the-goal\">1.3 Goldratt en The Goal</h2>\n<p>Dr. Eliyahu M. Goldratt (1947-2011) was een Israëlische natuurkundige die zijn wetenschappelijke manier van denken toepaste op organisaties. Hij begon in de jaren zeventig met planningssoftware (OPT), ontdekte dat software alleen niets veranderde als managers anders bleven denken, en schreef daarom in 1984 de bedrijfsroman <em>The Goal</em>.</p>\n<p>Kernverhaal van <em>The Goal</em>: fabriek UNICO (Bearington) dreigt te sluiten. Alex Rogo ontdekt met Jonah dat twee machines de output beperken: de NCX-10 en de warmtebehandelingsoven (heat treat). Door die twee te beschermen en optimaal te benutten, stijgt de winst. Uiteindelijk produceert de fabriek meer dan de markt koopt: de markt wordt de nieuwe constraint.</p>\n<p>Twee scènes uit het boek komen bijna zeker terug in examenvragen en worden in hoofdstuk 2 uitgewerkt:</p>\n<ul>\n<li>De <strong>padvinderswandeling</strong> met Herbie (de langzaamste jongen bepaalt het tempo van de hele groep).</li>\n<li>Het <strong>luciferspel</strong> (match-bowl game) met dobbelstenen, dat laat zien wat variatie in een afhankelijke keten doet.</li>\n</ul>\n<p>Latere boeken van Goldratt breiden TOC uit: <em>It's Not Luck</em> (thinking processes), <em>Critical Chain</em> (projectmanagement), <em>Necessary But Not Sufficient</em> (IT), <em>The Choice</em> (de vier pijlers) en <em>Isn't It Obvious?</em> (distributie).</p>\n<h2 id=\"14-definitie-van-theory-of-constraints\">1.4 Definitie van theory of constraints</h2>\n<p>De TOCICO Dictionary definieert <em>theory of constraints</em> (TOC) als een holistische managementfilosofie van Goldratt die berust op het principe dat complexe systemen <em>inherent simplicity</em> (inherente eenvoud) vertonen. Engelse kern: \"A holistic management philosophy... based on the principle that complex systems exhibit inherent simplicity.\"</p>\n<p>De definitie gaat verder: zelfs een zeer complex systeem met duizenden mensen en machines heeft op elk moment slechts een zeer klein aantal variabelen, misschien maar één, die werkelijk beperken hoeveel goal units het systeem kan genereren. Die variabele heet de constraint.</p>\n<p>Onthoud drie kenmerken uit de definitie:</p>\n<ol>\n<li><strong>Holistisch</strong>: het gaat om het geheel, niet om de delen afzonderlijk.</li>\n<li><strong>Managementfilosofie</strong>: geen techniek of tool, maar een manier van denken.</li>\n<li><strong>Inherente eenvoud</strong>: weinig variabelen bepalen de prestatie.</li>\n</ol>\n<h3 id=\"constraints-management\">Constraints management</h3>\n<p>Het examen kan vragen naar het verschil met <em>constraints management</em>. Dat is een term die door APICS is bedacht voor het logistieke deel van TOC: drum-buffer-rope, buffer management, VATI-analyse, throughput, inventory, operating expense, throughput-dollar-days en inventory-dollar-days. Engelse kern: \"A term coined by APICS... to describe the logistics paradigm.\"</p>\n<table>\n<thead>\n<tr>\n<th>Term</th>\n<th>Herkomst</th>\n<th>Reikwijdte</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Theory of constraints</td>\n<td>Goldratt</td>\n<td>Volledige managementfilosofie, inclusief thinking processes, finance, strategie</td>\n</tr>\n<tr>\n<td>Constraints management</td>\n<td>APICS</td>\n<td>Vooral de operationele en logistieke toepassingen</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"waar-komt-de-naam-vandaan\">Waar komt de naam vandaan?</h3>\n<p>De Dictionary vermeldt bij <em>interactive constraints</em> een historisch detail: Goldratt zag bij het bestuderen van projectmanagement dat de <em>critical chain</em> de constraint van een project is. Kort daarna hernoemde hij zijn body of knowledge naar \"Theory of Constraints\". Het woord constraint is dus breder dan een machine in een fabriek. Het kan een resource zijn, een critical chain, de markt, enzovoort.</p>\n<h2 id=\"15-de-vier-pijlers-fundamental-assumptions-of-toc\">1.5 De vier pijlers: fundamental assumptions of TOC</h2>\n<p>De Dictionary noemt ze <em>fundamental assumptions (of TOC)</em>: basisovertuigingen die gelden voor alle sociale systemen. In <em>The Choice</em> noemt Goldratt ze de vier pijlers. Het examen gebruikt beide benamingen.</p>\n<table>\n<thead>\n<tr>\n<th>Nr</th>\n<th>Pijler (Engels)</th>\n<th>Toelichting</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>People are good</td>\n<td>Mensen zijn goed, maar wij dragen allemaal \"slechte\" aannames mee die ons verhinderen het potentieel in onszelf, anderen en organisaties te zien.</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Every conflict can be removed</td>\n<td>Elk conflict kan worden opgelost als we de foute aanname vinden en uitdagen die het conflict veroorzaakt. Geen compromis, maar een win-win.</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Every situation is exceedingly simple</td>\n<td>Elke situatie, hoe complex ze ook lijkt, is uiterst eenvoudig als we de weinige leverage points vinden (inherent simplicity).</td>\n</tr>\n<tr>\n<td>4</td>\n<td>Every situation can be substantially improved</td>\n<td>Elke situatie kan wezenlijk verbeterd worden als we helder denken. Dit wordt vaak samengevat als \"never say I know\".</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"herkomst-twee-aannames-uit-de-harde-wetenschap\">Herkomst: twee aannames uit de harde wetenschap</h3>\n<p>De Dictionary legt uit dat de vier pijlers een uitbreiding zijn van twee basisovertuigingen van de natuurwetenschappen, samengevat in Newtons uitspraak \"Natura valde simplex est et sibi consona\": de natuur is uiterst eenvoudig en in harmonie met zichzelf.</p>\n<ul>\n<li><strong>Inherent simplicity</strong>: het universum en alle complexe systemen worden bestuurd door inherente eenvoud.</li>\n<li><strong>Inherent harmony</strong>: binnen zulke systemen bestaan geen tegenstrijdigheden in de regels die ze besturen. Vertaald naar organisaties: elk conflict kan worden opgelost.</li>\n</ul>\n<p>Goldratt voegde twee aannames toe omdat organisaties sociale systemen met mensen zijn: \"people are good\" en \"every situation can be substantially improved\".</p>\n<h3 id=\"hoe-de-pijlers-samenhangen\">Hoe de pijlers samenhangen</h3>\n<pre><code> Harde wetenschap (Newton)           Sociale systemen (Goldratt)\n ------------------------            ---------------------------\n Inherent simplicity        ---&gt;     3. Every situation is exceedingly simple\n Inherent harmony           ---&gt;     2. Every conflict can be removed\n                                     1. People are good\n                                     4. Every situation can be substantially improved\n                                        (&quot;never say I know&quot;)\n</code></pre>\n<h3 id=\"never-say-i-know\">Never say I know</h3>\n<p>De vierde pijler wordt in de praktijk het vaakst geciteerd als \"never say I know\". De redenering: zodra je denkt dat je een situatie volledig begrijpt, stop je met zoeken naar verbetering. Wie gelooft dat elke situatie substantieel verbeterd kan worden, blijft vragen stellen. De redacteuren van de Dictionary schrijven zelf in het voorwoord dat zij Goldratts vierde pijler hebben leren accepteren: hoe meer je definieert, hoe meer je ontdekt wat je niet weet.</p>\n<h3 id=\"win-win\">Win-win</h3>\n<p>Bij pijler 2 hoort het begrip win-win. TOC stelt dat een echt conflict in de werkelijkheid niet bestaat; een conflict is altijd het gevolg van minstens één foute aanname. Vind je die aanname, dan verdwijnt het conflict zonder dat een partij verliest. Het instrument daarvoor is de <em>evaporating cloud</em> (verdampende wolk; een logisch diagram dat een conflict precies beschrijft). Die wordt in deel 2 van deze cursus behandeld. Voor nu is de kern: TOC zoekt geen compromis, want een compromis betekent dat beide partijen iets inleveren.</p>\n<h2 id=\"16-holistic-approach\">1.6 Holistic approach</h2>\n<p>TOC noemt zichzelf een holistische filosofie. De Dictionary definieert <em>holistic approach</em> (holistische benadering) als de overtuiging dat een verandering op één plek in een systeem gevolgen heeft op andere plekken. Daarom moet je, om de juiste plek voor verandering te vinden, het hele netwerk van oorzaak en gevolg tussen de ongewenste effecten van het systeem rigoureus bekijken. Engelse kern: \"change in one place in a system has ramifications in other parts of the system.\"</p>\n<p>Praktisch betekent dit:</p>\n<ul>\n<li>Je beoordeelt een beslissing niet op het effect op één afdeling, maar op het effect op het geheel.</li>\n<li>Je gebruikt <em>holistic measures</em> (metingen van de hele organisatie) zoals throughput, investment en operating expense, en niet alleen lokale efficiëntie.</li>\n<li>Je zoekt de plek waar verandering het meeste oplevert voor het geheel: het leverage point.</li>\n</ul>\n<h2 id=\"17-leverage-point-en-archimedes-lever-point\">1.7 Leverage point en Archimedes lever point</h2>\n<p>Een <em>leverage point</em> (hefboompunt) is een punt, fysiek of logisch, waar een specifieke actie een significante verbetering van het hele systeem oplevert. Engelse kern: \"A point... where a specific action would provide significant system improvement.\"</p>\n<p>De Dictionary geeft twee voorbeelden:</p>\n<ul>\n<li>In een fysieke stroom van goal units is de <strong>constraint</strong> het leverage point.</li>\n<li>In een oorzaak-gevolganalyse is het <strong>core problem</strong> (kernprobleem) het leverage point.</li>\n</ul>\n<p>Het verwante begrip <em>Archimedes lever point</em> verwijst naar de uitspraak van Archimedes: geef mij een plek om te staan en een hefboom die lang genoeg is, en ik beweeg de aarde. TOC past dit toe op systemen met veel componenten: een verandering aan slechts één of enkele componenten veroorzaakt een grote verandering in de prestatie van het geheel. De TOC-verbeterprocessen draaien om het vinden en beheren van die punten.</p>\n<p>Een misverstand dat het examen kan toetsen: een leverage point is niet per se het duurste of grootste onderdeel. Het is het onderdeel waar de <strong>hefboomwerking</strong> het grootst is. In de ketenanalogie is dat de zwakste schakel, ook al is die klein en goedkoop.</p>\n<h2 id=\"18-focus\">1.8 Focus</h2>\n<p><em>Focus</em> (focus) is in TOC een technische term: het identificeren van één of enkele elementen of leverage points die een significante positieve impact hebben op het bereiken van het goal. Engelse kern: \"Identifying one (or a few) elements or leverage points that have significant positive impact.\"</p>\n<p>De Dictionary voegt een belangrijk tweede deel toe: focus omvat <strong>zowel doen wat gedaan moet worden als niet doen wat niet gedaan moet worden</strong>. Dit is subtiel. Veel managers denken dat focus betekent \"hard werken aan het belangrijkste\". TOC voegt toe: en stoppen met de rest. Concreet vertaalt focus zich in het sterk terugdringen of elimineren van <em>multitasking</em> (het stoppen met een taak voordat die af is om aan een andere te beginnen).</p>\n<p>Zonder focus verspreidt een organisatie haar aandacht over alle schakels. Met focus richt zij zich op de zwakste. Daarom heten de vijf stappen van TOC ook de <em>five focusing steps</em>.</p>\n<h2 id=\"19-process-of-ongoing-improvement-poogi\">1.9 Process of ongoing improvement (POOGI)</h2>\n<p>Het doel is niet om één keer de zwakste schakel te versterken, maar om dat blijvend te doen. TOC noemt dit een <em>process of ongoing improvement</em> (POOGI; proces van voortdurende verbetering). Engelse kern: \"Methods used to achieve continuous improvement with respect to one's goal.\"</p>\n<p>De Dictionary onderscheidt <strong>drie</strong> POOGI's binnen TOC:</p>\n<ol>\n<li>De <strong>five focusing steps</strong> (hoofdstuk 3).</li>\n<li>De <strong>change question sequence</strong> (de vragen \"what to change?\", \"to what to change?\" en \"how to cause the change?\"; deel 2).</li>\n<li><strong>Buffer management</strong> (deel 3).</li>\n</ol>\n<p>Een examenvraag kan vragen welke van deze drie een POOGI is. Het antwoord: alle drie. Een afleider zoals \"throughput accounting\" of \"evaporating cloud\" is geen POOGI op zichzelf.</p>\n<h2 id=\"110-toc-als-wetenschap-stages-of-a-science\">1.10 TOC als wetenschap: stages of a science</h2>\n<p>Goldratt zag zichzelf als wetenschapper die de methode van de natuurkunde toepaste op organisaties. De Dictionary definieert <em>science</em> (wetenschap) als het zoeken naar een minimaal aantal aannames dat door logische deductie een maximaal aantal verschijnselen verklaart. Aannames kunnen nooit bewezen worden; ze zijn geldig tot één verschijnsel ze weerlegt. Wetenschap gaat niet over waarheid, maar over geldigheid. Daarom staat alles open voor toetsing. Dit sluit naadloos aan bij \"never say I know\".</p>\n<p>De Dictionary beschrijft ook <em>stages of a science</em> (ontwikkelingsstadia van een wetenschap). Kennis over een onderwerp ontwikkelt zich in drie fasen:</p>\n<table>\n<thead>\n<tr>\n<th>Fase</th>\n<th>Vraag</th>\n<th>Resultaat</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Classification</td>\n<td>Wat is dit?</td>\n<td>Een indeling en definities</td>\n</tr>\n<tr>\n<td>Correlation</td>\n<td>Hoe hangt dit samen met andere dingen?</td>\n<td>Een uitspraak over de relatie</td>\n</tr>\n<tr>\n<td>Effect-cause-effect</td>\n<td>Waarom gebeurt dit?</td>\n<td>Een logische verklaring van de relatie</td>\n</tr>\n</tbody>\n</table>\n<p>Het voorbeeld uit de Dictionary voor de logistieke functie: MRP (material requirements planning) is de classificatiefase, just-in-time is de correlatiefase en TOC is de effect-cause-effect-fase. Het examen kan deze koppeling letterlijk vragen.</p>\n<h2 id=\"111-mini-case-de-drukkerij\">1.11 Mini-case: de drukkerij</h2>\n<p>Een drukkerij heeft vier afdelingen: prepress, drukken, afwerking en verzending. De directie klaagt dat de winst daalt en vraagt elke afdeling om 10 procent efficiënter te worden.</p>\n<ul>\n<li>Prepress koopt snellere software. Ze leveren nu sneller aan drukken.</li>\n<li>Drukken is de zwakste schakel: de pers draait al 24 uur per dag. Ze kunnen niet sneller.</li>\n<li>Afwerking en verzending werken al vaak zonder werk, omdat drukken niet sneller levert.</li>\n</ul>\n<p>Resultaat: prepress heeft geld uitgegeven, er ligt meer halffabrikaat voor de pers, en de output van de drukkerij is niet gestegen. Het goal (\"more money\") is niet dichterbij gekomen.</p>\n<p>De TOC-blik: de pers is het leverage point. Alleen acties op of rond de pers verhogen de output. Alle overige afdelingen moeten zich ondergeschikt maken aan de pers. Dat is holistisch denken met focus.</p>\n<h2 id=\"examenvallen\">Examenvallen</h2>\n<ul>\n<li><strong>Goal versus necessary condition.</strong> \"Satisfy customers\" is een necessary condition, geen goal. Het goal van een commercieel bedrijf is \"make more money now and in the future\". Kies bij twijfel de formulering die de eigenaren zouden kiezen.</li>\n<li><strong>Necessary versus sufficient.</strong> In de Dictionary is een necessary condition nodig maar op zichzelf niet genoeg. Een sufficient condition is op zichzelf wél genoeg. Verwissel ze niet.</li>\n<li><strong>Theory of constraints versus constraints management.</strong> Constraints management is de APICS-term voor het logistieke deel. TOC is de complete filosofie.</li>\n<li><strong>Vier pijlers door elkaar halen.</strong> \"Never say I know\" is de populaire samenvatting van pijler 4 (\"every situation can be substantially improved\"). Pijler 3 is inherent simplicity. Pijler 2 is \"every conflict can be removed\". Pijler 1 is \"people are good\".</li>\n<li><strong>Win-win versus compromis.</strong> TOC zoekt geen compromis. Bij een compromis leveren beide partijen in. Bij een win-win wordt een foute aanname weggenomen zodat beide partijen krijgen wat ze nodig hebben.</li>\n<li><strong>Leverage point is niet altijd duur of groot.</strong> Het gaat om hefboomwerking, niet om omvang.</li>\n<li><strong>Drie POOGI's.</strong> Five focusing steps, change question sequence en buffer management. Throughput accounting is geen POOGI.</li>\n<li><strong>Stages of a science.</strong> Classification, correlation, effect-cause-effect. TOC hoort bij de derde fase; MRP bij de eerste; JIT bij de tweede.</li>\n</ul>\n<h2 id=\"samenvatting\">Samenvatting</h2>\n<ul>\n<li>Het goal is de bedoeling waarvoor het systeem is opgericht, bepaald door de eigenaren. Voor bedrijven: make more money now and in the future.</li>\n<li>Necessary conditions (klanten tevreden, medewerkers veilig en tevreden) zijn vereist maar niet voldoende om het goal te halen.</li>\n<li>Een organisatie is een keten van afhankelijke schakels. De ketensterkte wordt bepaald door de zwakste schakel: de constraint.</li>\n<li>Verbeteringen aan niet-zwakste schakels verhogen de ketensterkte niet.</li>\n<li>TOC is een holistische managementfilosofie van Goldratt, gebaseerd op inherent simplicity: weinig variabelen bepalen de prestatie.</li>\n<li>Constraints management is de APICS-benaming voor de logistieke toepassingen van TOC.</li>\n<li>De vier fundamental assumptions (pijlers): people are good; every conflict can be removed; every situation is exceedingly simple; every situation can be substantially improved (never say I know).</li>\n<li>De pijlers bouwen voort op twee aannames van de harde wetenschap: inherent simplicity en inherent harmony.</li>\n<li>Een leverage point is de plek waar een kleine actie een grote systeemverbetering oplevert (Archimedes lever point). In een fysieke stroom is dat de constraint; in een oorzaak-gevolganalyse het core problem.</li>\n<li>Focus betekent doen wat moet én laten wat niet moet, met als gevolg minder multitasking.</li>\n<li>POOGI is een proces van voortdurende verbetering. TOC kent er drie: five focusing steps, change question sequence, buffer management.</li>\n<li>Wetenschap zoekt geldigheid, niet waarheid. De stages of a science zijn classification, correlation en effect-cause-effect; TOC hoort bij de laatste.</li>\n</ul>", "q": [{"n": 1, "q": "Wat is volgens de TOCICO Dictionary het <em>goal</em> van een systeem?", "opts": {"A": "De meetlat waarmee het management de prestatie beoordeelt", "B": "De bedoeling waarvoor het systeem is opgericht, bepaald door de eigenaren", "C": "De som van alle necessary conditions", "D": "Het niveau van throughput dat de markt toestaat"}, "gebied": 1, "a": "B", "e": "Het goal is de purpose waarvoor het systeem is gecreëerd, bepaald door de eigenaren. A verwart goal met meting. C verwart goal met necessary conditions. D beschrijft een marktconstraint, geen goal."}, {"n": 2, "q": "Welke uitspraak over <em>necessary conditions</em> is juist?", "opts": {"A": "Een necessary condition is op zichzelf voldoende om het goal te bereiken", "B": "Een necessary condition kan tegelijk een sufficient condition zijn", "C": "Een necessary condition is vereist, maar op zichzelf niet voldoende", "D": "Necessary conditions gelden alleen voor non-profitorganisaties"}, "gebied": 1, "a": "C", "e": "Een necessary condition is vereist maar op zichzelf niet voldoende. A beschrijft een sufficient condition. B past niet bij de Dictionary: daar is een necessary condition juist op zichzelf niet voldoende. D is onjuist; ook commerciële bedrijven hebben necessary conditions."}, {"n": 3, "q": "Een bedrijf verbetert de efficiëntie van alle afdelingen met 10 procent, behalve die van de constraint. Wat zegt de ketenanalogie over het resultaat?", "opts": {"A": "De output stijgt met ongeveer 10 procent", "B": "De output stijgt evenredig met het aantal verbeterde afdelingen", "C": "De output verandert niet wezenlijk", "D": "De output daalt omdat de constraint overbelast raakt"}, "gebied": 1, "a": "C", "e": "De ketensterkte wordt bepaald door de zwakste schakel. Verbeteringen elders veranderen de output niet wezenlijk. A en B volgen het additieve denken van de cost world. D is niet wat de analogie zegt; hooguit ontstaat extra voorraad voor de constraint."}, {"n": 4, "q": "Welke van de volgende is GEEN van de vier fundamental assumptions (pijlers) van TOC?", "opts": {"A": "People are good", "B": "Every conflict can be removed", "C": "Every resource must be fully utilized", "D": "Every situation can be substantially improved"}, "gebied": 1, "a": "C", "e": "Volledige benutting van elke resource is juist iets wat TOC afwijst (hoofdstuk 2). A, B en D zijn drie van de vier pijlers; de vierde is \"every situation is exceedingly simple\"."}, {"n": 5, "q": "De term <em>constraints management</em> is bedacht door:", "opts": {"A": "Goldratt, als synoniem voor TOC", "B": "APICS, voor het logistieke deel van TOC", "C": "TOCICO, voor het certificeringsprogramma", "D": "Deming, als onderdeel van TQM"}, "gebied": 1, "a": "B", "e": "Constraints management is een APICS-term voor het logistieke paradigma (DBR, buffer management, VATI, T, I, OE, TDD, IDD). A, C en D zijn onjuist."}, {"n": 6, "q": "Wat betekent \"never say I know\" in TOC?", "opts": {"A": "Managers moeten hun kennis niet delen met medewerkers", "B": "Elke situatie kan substantieel verbeterd worden, dus blijf vragen stellen", "C": "Alleen externe consultants mogen constraints identificeren", "D": "Kennis over het systeem is onbetrouwbaar en dus onbruikbaar"}, "gebied": 1, "a": "B", "e": "\"Never say I know\" is de samenvatting van de vierde pijler: elke situatie kan substantieel verbeterd worden, dus blijf zoeken. A, C en D verdraaien de betekenis."}, {"n": 7, "q": "Welke drie methoden noemt de Dictionary als <em>processes of ongoing improvement</em> (POOGI)?", "opts": {"A": "Five focusing steps, throughput accounting, drum-buffer-rope", "B": "Five focusing steps, change question sequence, buffer management", "C": "Evaporating cloud, current reality tree, future reality tree", "D": "Identify, exploit, subordinate"}, "gebied": 1, "a": "B", "e": "De Dictionary noemt exact deze drie POOGI's. A bevat throughput accounting en DBR, die geen POOGI zijn. C zijn thinking-process-tools. D zijn drie van de vijf stappen, niet drie POOGI's."}, {"n": 8, "q": "In de <em>stages of a science</em> hoort TOC bij de fase:", "opts": {"A": "Classification", "B": "Correlation", "C": "Effect-cause-effect", "D": "Verification"}, "gebied": 1, "a": "C", "e": "TOC is de effect-cause-effect-fase; MRP is classification, JIT is correlation. D is geen fase uit de Dictionary."}, {"n": 9, "q": "Wat is een <em>leverage point</em>?", "opts": {"A": "Het duurste onderdeel van een systeem", "B": "Een punt waar een specifieke actie een significante verbetering van het hele systeem oplevert", "C": "Het onderdeel met de hoogste lokale efficiëntie", "D": "Een financiële hefboom door vreemd vermogen"}, "gebied": 1, "a": "B", "e": "Dit is de definitie. A en C zijn misverstanden; het leverage point is de plek met de grootste hefboomwerking, niet de grootste omvang of hoogste efficiëntie. D is een financiële term die hier niet bedoeld wordt."}, {"n": 10, "q": "De <em>holistic approach</em> van TOC houdt in dat:", "opts": {"A": "Elke afdeling zelfstandig haar eigen prestatie optimaliseert", "B": "Een verandering op één plek gevolgen heeft elders, dus het hele oorzaak-gevolgnetwerk bekeken moet worden", "C": "Alle medewerkers gelijktijdig aan verbetering werken", "D": "Kosten per afdeling worden opgeteld tot een totaalbeeld"}, "gebied": 1, "a": "B", "e": "Holistic approach: verandering op één plek werkt door in andere delen; daarom moet het hele oorzaak-gevolgnetwerk worden bekeken. A en D beschrijven het cost-world-denken. C is geen definitie van holisme."}]}, {"id": "ch02", "num": 2, "title": "Constraints en het systeem", "part": 1, "partShort": "Deel 1", "partLong": "TOC Fundamentals Concepts", "gebied": 1, "html": "<h2 id=\"leerdoelen\">Leerdoelen</h2>\n<p>Na dit hoofdstuk kun je:</p>\n<ul>\n<li>De TOCICO-definitie van <em>constraint</em> herkennen en uitleggen waarom een constraint het leverage point van een systeem is.</li>\n<li>De soorten constraints onderscheiden: physical/capacity, market, material, policy, management, measures, dummy, strategic en interactive constraints, en weten welke daarvan de Dictionary een \"misnomer\" noemt.</li>\n<li>Het verschil uitleggen tussen <em>bottleneck resource</em>, <em>capacity-constrained resource</em> (CCR) en <em>non-bottleneck</em> of <em>non-constraint</em>.</li>\n<li>Uitleggen wat <em>dependent events</em> en <em>statistical fluctuations</em> samen doen met een systeem (Herbie, het luciferspel).</li>\n<li>Uitleggen waarom een <em>balanced plant</em> een slecht idee is en welke rol <em>protective capacity</em> speelt.</li>\n<li>De capaciteitsbegrippen productive, protective, excess en idle capacity plaatsen en het verschil tussen <em>activation</em> en <em>utilization</em> toepassen.</li>\n</ul>\n<h2 id=\"21-wat-is-een-constraint\">2.1 Wat is een constraint?</h2>\n<p>De Dictionary definieert een <em>constraint</em> (beperking) als de factor die uiteindelijk de prestatie van een systeem of organisatie begrenst. Het is de factor die, als de organisatie hem kon vergroten, beter benutten of beter ondergeschikt maken, meer van het goal zou opleveren. Engelse kern: \"The factor that ultimately limits the performance of a system or organization.\"</p>\n<p>Drie werkwoorden in die definitie verwijzen al naar de five focusing steps (hoofdstuk 3): <em>exploit</em> (benutten), <em>subordinate</em> (ondergeschikt maken) en <em>elevate</em> (verhogen).</p>\n<p>De Dictionary voegt een perspectief toe dat de kern van TOC samenvat: het bestaan van constraints, en het feit dat je de prestatie verbetert door ze te identificeren en zorgvuldig te managen of te elimineren, is het fundament van TOC.</p>\n<p>Het voorbeeld uit <em>The Goal</em>: UNICO kon niet snel genoeg produceren om aan de vraag te voldoen. Twee resources beperkten de output: de NCX-10 en de warmtebehandelingsoven. Toen UNICO die beide exploiteerde, alles eraan ondergeschikt maakte en uiteindelijk elevatede, steeg de winst. Later kon de fabriek meer maken dan klanten kochten. De constraint verschoof naar het gebrek aan orders: de markt werd de constraint.</p>\n<h3 id=\"elk-systeem-heeft-er-minstens-een\">Elk systeem heeft er minstens één</h3>\n<p>Een systeem zonder constraint zou oneindige output hebben. Elk systeem heeft dus minstens één constraint, maar nooit veel tegelijk: de definitie van TOC (hoofdstuk 1) spreekt van \"a very, very small number of variables, perhaps only one\".</p>\n<h2 id=\"22-soorten-constraints\">2.2 Soorten constraints</h2>\n<p>Let goed op: de Dictionary noemt een aantal populaire benamingen expliciet een <strong>misnomer</strong> (onjuiste benaming). Dat is een geliefd examenonderwerp.</p>\n<h3 id=\"physical-of-capacity-constraint-interne-resource\">Physical of capacity constraint (interne resource)</h3>\n<p>Een fysieke constraint is een resource (machine, mens, afdeling) waarvan de capaciteit kleiner is dan de marktvraag, zoals in <em>The Goal</em>. De Dictionary gebruikt hiervoor <em>bottleneck resource</em> en <em>capacity-constrained resource</em> (zie 2.3).</p>\n<h3 id=\"market-constraint\">Market constraint</h3>\n<p>Een <em>market constraint</em> (marktconstraint) is de situatie waarin de marktvraag kleiner is dan de capaciteit van de organisatie om te leveren. Onvoldoende klantvraag is dan de constraint. Engelse kern: \"Market demand is less than the organization's capacity to deliver.\"</p>\n<p>Dit is een echte constraint, geen misnomer. Veel bedrijven zitten in deze situatie. De five focusing steps werken dan gewoon: exploit de markt (bijvoorbeeld met een onweerstaanbaar aanbod), subordinate de productie eraan (lever altijd op tijd), elevate (nieuwe markten aanboren).</p>\n<h3 id=\"material-constraint\">Material constraint</h3>\n<p>Een <em>material constraint</em> (materiaalconstraint) is volgens de Dictionary meestal een misnomer. Materiaaltekorten zijn zelden de constraint. Ze zijn meestal tijdelijk, of het materiaal is elders of tegen een hogere prijs verkrijgbaar. Een materiaaltekort <strong>hindert</strong> vooral het exploiteren van en subordineren aan de echte constraint. De uitzondering die de Dictionary noemt: de wereldwijde staaltekorten in het begin van de 21e eeuw. Toen was staal een tijd lang echt de constraint.</p>\n<h3 id=\"policy-constraint\">Policy constraint</h3>\n<p>Een <em>policy constraint</em> (beleidsconstraint) is volgens de Dictionary een veelvoorkomende misnomer. Slecht beleid is niet de constraint; het hindert het effectief managen van de constraint. Voorbeeld: een beleid om in \"economic order quantities\" te produceren leidt tot te grote batches, meer onderhanden werk en periodieke uithongering van de constraint. Het beleid is niet de constraint, maar blokkeert het exploiteren ervan. De Dictionary merkt op dat policies vroeger wél als een type constraint werden aangeduid. Oudere boeken doen dat nog.</p>\n<h3 id=\"management-constraint\">Management constraint</h3>\n<p>De Dictionary geeft twee betekenissen aan <em>management constraint</em>:</p>\n<ol>\n<li>Een misnomer: slecht management is niet de constraint, maar hindert het exploiteren en subordineren (bijvoorbeeld ingenieurs straffen voor late taken, waardoor zij meer veiligheid in hun schattingen bouwen).</li>\n<li>De beschikbare tijd van het topmanagement, die onder traditioneel management een constraint is omdat managers op alles letten in plaats van op de leverage points.</li>\n</ol>\n<h3 id=\"measures-constraint\">Measures constraint</h3>\n<p>Een <em>measures constraint</em> (meetconstraint) is eveneens een misnomer. Slechte metingen zijn niet de constraint; ze hinderen. Voorbeeld uit de Dictionary: efficiëntie meten op alle resources drijft overproductie bij non-bottlenecks aan en laat de bottleneck verhongeren. De efficiëntiemeting is niet wat je moet exploiteren, maar wat het exploiteren blokkeert.</p>\n<h3 id=\"dummy-constraint\">Dummy constraint</h3>\n<p>Een <em>dummy constraint</em> (schijnconstraint) is een constraint die goedkoop is in verhouding tot de andere resources in het systeem. De Dictionary is stellig: dummy constraints moeten altijd worden geëlimineerd. Als een machine van 5.000 euro de output van een fabriek van 50 miljoen beperkt, koop je gewoon een tweede.</p>\n<h3 id=\"strategic-constraint\">Strategic constraint</h3>\n<p>Een <em>strategic constraint</em> (strategische constraint) is de plek waar het topmanagement de constraint bewust wil hebben en houden, met het oog op het lange-termijnvermogen om het goal te halen. De Dictionary legt uit dat de five focusing steps niet bedoeld zijn als oneindige lus waarin je steeds de volgende constraint elimineert. Het management kiest waar de constraint moet zitten. Meestal wordt een resource gekozen die schaars is, dus duur of moeilijk te elevaten. De organisatie groeit dan tot die resource de constraint wordt.</p>\n<h3 id=\"interactive-constraints\">Interactive constraints</h3>\n<p><em>Interactive constraints</em> (interacterende constraints) zijn twee of meer factoren (bijvoorbeeld zwaar belaste resources of critical chains) die zo op elkaar inwerken dat de throughput van het systeem onvoorspelbaar of chaotisch wordt. De Dictionary noemt dit een bredere term dan <em>wandering bottleneck</em>: constraints omvatten ook critical chains en markten, terwijl bottlenecks alleen over schaarse resources in productie gaan.</p>\n<h3 id=\"overzicht\">Overzicht</h3>\n<table>\n<thead>\n<tr>\n<th>Soort</th>\n<th>Echte constraint of misnomer?</th>\n<th>Kernpunt</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Physical / capacity</td>\n<td>Echt</td>\n<td>Interne resource met te weinig capaciteit</td>\n</tr>\n<tr>\n<td>Market</td>\n<td>Echt</td>\n<td>Vraag kleiner dan capaciteit</td>\n</tr>\n<tr>\n<td>Material</td>\n<td>Meestal misnomer</td>\n<td>Hindert exploit/subordinate; zelden echt (staal)</td>\n</tr>\n<tr>\n<td>Policy</td>\n<td>Misnomer</td>\n<td>Slecht beleid hindert</td>\n</tr>\n<tr>\n<td>Management</td>\n<td>Misnomer (bet. 1) / echt (bet. 2: managementtijd)</td>\n<td>Hindert, of tijd van topmanagement</td>\n</tr>\n<tr>\n<td>Measures</td>\n<td>Misnomer</td>\n<td>Slechte metingen hinderen</td>\n</tr>\n<tr>\n<td>Dummy</td>\n<td>Echt maar te goedkoop</td>\n<td>Altijd elimineren</td>\n</tr>\n<tr>\n<td>Strategic</td>\n<td>Bewust gekozen</td>\n<td>Waar het management de constraint wil houden</td>\n</tr>\n<tr>\n<td>Interactive</td>\n<td>Echt, ongewenst</td>\n<td>Meerdere factoren maken output chaotisch</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"23-bottleneck-ccr-en-non-constraint\">2.3 Bottleneck, CCR en non-constraint</h2>\n<p>Dit is het meest getoetste onderscheid van dit hoofdstuk. De Dictionary waarschuwt zelf dat <em>bottleneck resource</em> vaak wordt verward met capacity-constrained resource, drum resource en constraint.</p>\n<h3 id=\"bottleneck-resource\">Bottleneck resource</h3>\n<p>Een <em>bottleneck resource</em> (knelpuntresource) is elke resource waarvan de capaciteit kleiner is dan of gelijk aan de vraag die erop wordt gelegd, in een bepaalde tijdshorizon. Engelse kern: \"Any resource whose capacity is less than or equal to the demand placed on it.\"</p>\n<p>De Dictionary voegt toe dat beleid (batchregels, efficiëntiesturing, eindemaandsyndroom) resources vaak ten onrechte als bottleneck laat lijken. Na stap 2 en 3 van de five focusing steps blijken zij ruim voldoende capaciteit te hebben en wordt de markt de constraint.</p>\n<h3 id=\"capacity-constrained-resource-ccr\">Capacity-constrained resource (CCR)</h3>\n<p>Een <em>capacity-constrained resource</em> (CCR; capaciteitsbeperkte resource) is elke resource die, als de capaciteit niet zorgvuldig wordt gemanaged, waarschijnlijk de throughput van de organisatie in gevaar brengt. Engelse kern: \"Any resource that, if its capacity is not carefully managed, is likely to compromise throughput.\"</p>\n<p>Het verschil met een bottleneck: een CCR heeft gemiddeld <strong>wel</strong> genoeg capaciteit, maar zo weinig marge dat variatie de output onder de vraag kan duwen. Voorbeeld uit de Dictionary: van vijf resources A tot E heeft D zoveel variatie dat de throughput daalt als D niet goed gemanaged wordt. D is een CCR.</p>\n<h3 id=\"non-bottleneck-resource-en-non-constraint\">Non-bottleneck resource en non-constraint</h3>\n<p>Een <em>non-bottleneck resource</em> heeft meer capaciteit dan de vraag. Een <em>non-constraint</em> heeft meer capaciteit (vaak idle) dan de constraint en moet zich niet richten op volledige benutting, maar zich ondergeschikt maken aan de constraint.</p>\n<h3 id=\"vergelijkingstabel\">Vergelijkingstabel</h3>\n<table>\n<thead>\n<tr>\n<th>Term</th>\n<th>Capaciteit versus vraag</th>\n<th>Managen?</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Bottleneck resource</td>\n<td>Capaciteit &lt;= vraag</td>\n<td>Ja, altijd; elk verloren uur is systeemverlies</td>\n</tr>\n<tr>\n<td>CCR</td>\n<td>Capaciteit net &gt; vraag, maar kwetsbaar voor variatie</td>\n<td>Ja, zorgvuldig plannen</td>\n</tr>\n<tr>\n<td>Non-bottleneck / non-constraint</td>\n<td>Capaciteit &gt; vraag</td>\n<td>Subordineren; niet maximaal benutten</td>\n</tr>\n<tr>\n<td>Constraint</td>\n<td>Wat de systeemprestatie begrenst (kan resource, markt, etc. zijn)</td>\n<td>Focus van de five focusing steps</td>\n</tr>\n</tbody>\n</table>\n<p>Belangrijk: een constraint is niet altijd een bottleneck (de markt kan de constraint zijn). En een systeem kan een CCR hebben zonder bottleneck: de CCR is dan het <em>drum</em> (de resource waarop de planning wordt gebaseerd) terwijl de markt de constraint is.</p>\n<h3 id=\"wandering-temporary-en-permanent-bottleneck\">Wandering, temporary en permanent bottleneck</h3>\n<ul>\n<li><em>Wandering bottleneck</em> (zwervende bottleneck; syn. floating bottleneck): een ongewenst effect waarbij de bottleneck relatief vaak van de ene naar de andere resource verspringt. Dit is vaak het gevolg van slecht beleid (grote batches, efficiëntiesturing) en maakt het systeem onbestuurbaar.</li>\n<li><em>Temporary bottleneck</em> (tijdelijke bottleneck): de vraag naar een resource overschrijdt kort de capaciteit.</li>\n<li><em>Permanent bottleneck</em> (permanente bottleneck): functies die intern bottleneck blijven, hoeveel middelen je er ook aan toewijst. De Dictionary noemt als voorbeeld in dienstverlening de IT-functie en de sales-en-marketingfunctie.</li>\n</ul>\n<h2 id=\"24-dependent-events-en-statistical-fluctuations\">2.4 Dependent events en statistical fluctuations</h2>\n<p>Waarom is een keten anders dan een optelsom? Vanwege twee verschijnselen die samen voorkomen in elk systeem waarin het ene onderdeel het andere voedt.</p>\n<p><em>Dependent events</em> (afhankelijke gebeurtenissen) zijn een reeks gebeurtenissen waarbij elke gebeurtenis pas kan worden voltooid nadat bepaalde voorgaande gebeurtenissen hebben plaatsgevonden. Voorbeeld uit de Dictionary: in een restaurant betaalt de klant pas na het eten, eet pas na het serveren, wordt pas bediend na het bestellen, en bestelt pas nadat hij aan tafel zit.</p>\n<p><em>Statistical fluctuations</em> (statistische schommelingen) is de TOC-term voor willekeurige variatie. Een bewerking duurt de ene keer 4 minuten en de andere keer 7. TOC gebruikt ook de bijnaam <em>Murphy</em> (naar Murphy's Law: alles wat fout kan gaan, gaat fout) voor ongeplande variatie zoals machinestoringen, kwaliteitsproblemen en late leveringen. Buffers dienen om tegen Murphy te beschermen.</p>\n<p>De Dictionary stelt: het samen voorkomen van deze twee factoren is precies wat de elementen van drum-buffer-rope (productie) en critical chain (projecten) noodzakelijk maakt.</p>\n<h3 id=\"herbie-de-padvinderswandeling\">Herbie: de padvinderswandeling</h3>\n<p>In <em>The Goal</em> leidt Alex een groep padvinders over een smal pad (dependent events). Elke jongen loopt met wisselende snelheid (statistical fluctuations). Herbie is de langzaamste.</p>\n<ul>\n<li>De jongens vóór Herbie lopen weg; de afstand groeit (voorraad stapelt zich op voor de constraint).</li>\n<li>De jongens achter Herbie kunnen niet sneller dan Herbie en staan regelmatig stil.</li>\n<li>De throughput van de groep is Herbie's snelheid.</li>\n</ul>\n<p>De oplossing in het boek: Herbie vooraan zetten (iedereen subordineert), zijn rugzak leegmaken (exploit) en de inhoud verdelen over de anderen (offload naar non-constraints). De groep loopt daarna sneller dan ooit.</p>\n<h3 id=\"het-luciferspel-match-bowl-game\">Het luciferspel (match-bowl game)</h3>\n<p>Ook in <em>The Goal</em>: vijf jongens, vijf kommen op een rij, een dobbelsteen, lucifers. Elke ronde verplaatst elke jongen zoveel lucifers als hij gooit naar de volgende kom, <strong>maar nooit meer dan er in zijn kom liggen</strong>. Gemiddeld gooit iedereen 3,5, dus je verwacht 3,5 lucifers per ronde uit het systeem. Dat gebeurt niet: de output ligt structureel lager en de voorraad tussen de kommen groeit. Waarom?</p>\n<table>\n<thead>\n<tr>\n<th>Ronde</th>\n<th>Jongen 1 gooit</th>\n<th>Jongen 2 gooit</th>\n<th>Werkelijk doorgegeven</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>1</td>\n<td>6</td>\n<td>1 (de kom van J2 was leeg en hij ontving maar 1 lucifer; zijn hoge worp gaat verloren)</td>\n</tr>\n<tr>\n<td>2</td>\n<td>6</td>\n<td>2</td>\n<td>2 (J2 kan niet meer doorgeven dan hij gooit; 4 lucifers blijven in zijn kom)</td>\n</tr>\n</tbody>\n</table>\n<p>Een hoge worp helpt niet als de vorige jongen weinig heeft doorgegeven. Een lage worp wordt nooit ingehaald; hij plant zich voort. Variatie in een keten van afhankelijke gebeurtenissen <strong>accumuleert</strong> in de nadelige richting. Dit is de reden waarom een keten zich niet gedraagt als een optelsom, en waarom capaciteiten niet op de vraag mogen worden afgestemd.</p>\n<h2 id=\"25-de-balanced-plant-en-waarom-die-faalt\">2.5 De balanced plant en waarom die faalt</h2>\n<p>Een <em>balanced plant</em> (gebalanceerde fabriek) is een fabriek waarin de capaciteit van alle resources gelijk is aan een bepaald outputniveau. Engelse kern: \"A plant in which the capacity of all resources is equal to a given level of output.\"</p>\n<p>De Dictionary vergelijkt drie filosofieën:</p>\n<table>\n<thead>\n<tr>\n<th>Filosofie</th>\n<th>Ideaal</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Traditioneel</td>\n<td>Balanced plant: elke capaciteit gelijk aan de vraag (kostenminimalisatie)</td>\n</tr>\n<tr>\n<td>Lean</td>\n<td>Balanced plant: capaciteit gelijk aan de dagelijkse vraag</td>\n</tr>\n<tr>\n<td>TOC</td>\n<td>Balanceer de <strong>flow</strong>, niet de capaciteit</td>\n</tr>\n</tbody>\n</table>\n<p>Waarom faalt de balanced plant? Vanwege dependent events plus statistical fluctuations. Als elke resource exact 100 stuks per dag kan en de vraag is 100, dan verlies je bij elke storing output die je nooit meer inhaalt, want niemand heeft reserve. TOC's alternatief: één resource (de constraint of het drum) bepaalt het tempo. Alle andere resources hebben bewust <strong>meer</strong> capaciteit, zodat ze verstoringen kunnen inhalen en de constraint nooit laten verhongeren. Dat heet balanceren van de flow.</p>\n<h2 id=\"26-soorten-capaciteit\">2.6 Soorten capaciteit</h2>\n<p>Om over \"meer capaciteit dan nodig\" te kunnen praten, splitst TOC de capaciteit van een non-constraint in delen.</p>\n<table>\n<thead>\n<tr>\n<th>Term</th>\n<th>Betekenis</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><em>Productive capacity</em> (productieve capaciteit)</td>\n<td>Capaciteit die nodig is om genoeg te produceren om de vraag van de constraint te dekken</td>\n</tr>\n<tr>\n<td><em>Idle capacity</em> (ongebruikte capaciteit)</td>\n<td>Alle capaciteit op non-constraints boven wat nodig is om de constraint te ondersteunen; bestaat uit protective plus excess</td>\n</tr>\n<tr>\n<td><em>Protective capacity</em> (beschermende capaciteit)</td>\n<td>Deel van idle capacity dat nodig is om in te halen als Murphy toeslaat, zodat de buffer voor de constraint weer gevuld raakt; syn. <em>sprint capacity</em></td>\n</tr>\n<tr>\n<td><em>Excess capacity</em> (overtollige capaciteit)</td>\n<td>Capaciteit die noch throughput produceert noch beschermt; beschikbaar voor extra verkoop of om te snoeien</td>\n</tr>\n</tbody>\n</table>\n<pre><code> Totale capaciteit non-constraint\n |------------------------|----------------|---------------|\n     productive capacity     protective        excess\n                             (sprint)\n |&lt;------ nodig voor constraint ----------&gt;|\n |                        |&lt;--------- idle capacity -------&gt;|\n</code></pre>\n<p>De Dictionary zegt over <em>protective capacity</em> dat non-constraints deze nodig hebben om de \"bank\" (voorraad) voor de constraint of CCR weer op te bouwen en de leverbetrouwbaarheid te beschermen. Sommige practitioners vinden dat ook de constraint zelf wat protective capacity moet hebben voor positieve verrassingen, zoals onverwachte extra vraag van een belangrijke klant.</p>\n<p>Twee verbanden die het examen graag toetst:</p>\n<ul>\n<li><strong>Meer protective capacity betekent kleinere buffers.</strong> Als non-constraints snel kunnen inhalen, hoeft de tijdbuffer voor de constraint minder groot te zijn. Dat verkort de doorlooptijd.</li>\n<li><strong>Minder variatie betekent minder protective capacity nodig.</strong> Reduceer je Murphy, dan heb je minder reserve nodig.</li>\n</ul>\n<p>Het traditionele perspectief ziet alle idle capacity als verspilling die gesnoeid moet worden. TOC zegt: een deel daarvan, de protective capacity, is vitaal. Alleen de excess capacity mag je snoeien, en zelfs die kun je beter gebruiken voor extra verkoop.</p>\n<p>Sprint capacity is het synoniem van protective capacity: de capaciteit om te \"sprinten\" en in te halen na een verstoring.</p>\n<h2 id=\"27-activation-versus-utilization\">2.7 Activation versus utilization</h2>\n<p>Dit onderscheid komt rechtstreeks uit <em>The Goal</em> en is een vaste examenvraag.</p>\n<p><em>Activation</em> (activering) betekent simpelweg een resource aan het werk zetten. <em>Utilization</em> (benutting) betekent in TOC: activering die productief bijdraagt aan het bereiken van het goal. Engelse kern van utilization: \"activation of a resource that productively contributes to reaching the goal.\"</p>\n<p>Het verschil: een non-constraint die volle dagen draait is 100 procent geactiveerd. Maar als de constraint maar 60 procent van die output kan verwerken, is de non-constraint slechts 60 procent benut. De overige 40 procent produceert alleen voorraad.</p>\n<p><em>Over activation</em> (overactivering) is het activeren van een resource meer dan nodig is om de constraint bij te houden, of, na een verstoring, meer dan nodig is om de voorraad voor de constraint weer op te bouwen. Voorbeeld uit de Dictionary: een resource met 7 uur capaciteit per dienst hoeft normaal 5,5 uur te produceren om de constraint bij te houden. Meer dan 5,5 uur is over activation, tenzij er na een storing moet worden ingehaald.</p>\n<p>In TOC worden non-constraints geactiveerd tot het niveau dat nodig is om de constraint volledig te exploiteren. Het gevolg van over activation: extra onderhanden werk en gereed product. Dat kost geld (investment), verlengt doorlooptijden en verstopt de fabriek.</p>\n<h2 id=\"28-garbage-time-en-het-uur-van-de-bottleneck\">2.8 Garbage time en het uur van de bottleneck</h2>\n<p><em>Garbage time</em> (afvaltijd) is de informele term voor tijd die een bottleneck besteedt aan werk dat óf helemaal niet gedaan zou moeten worden, óf door een non-bottleneck gedaan zou moeten worden. Voorbeelden:</p>\n<ul>\n<li>Onderdelen bewerken die later worden afgekeurd (kwaliteitscontrole had vóór de bottleneck moeten zitten).</li>\n<li>Produceren voor voorraad in plaats van voor orders.</li>\n<li>Een bewerking doen die een oudere, tragere machine ook had kunnen doen.</li>\n</ul>\n<h3 id=\"een-uur-verloren-op-de-bottleneck\">Een uur verloren op de bottleneck</h3>\n<p>Twee beroemde regels van Jonah uit <em>The Goal</em>:</p>\n<ol>\n<li><strong>Een uur verloren op een bottleneck is een uur verloren voor het hele systeem.</strong> De bottleneck bepaalt de throughput. Elk uur dat hij niet produceert, komt nooit meer terug. De verloren throughput is niet de kostprijs van dat uur machinetijd, maar de throughput van het hele systeem in dat uur.</li>\n<li><strong>Een uur bespaard op een non-bottleneck is een illusie (a mirage).</strong> Een non-bottleneck heeft al idle capacity. Een uur besparen voegt idle capacity toe, geen throughput.</li>\n</ol>\n<p>Rekenvoorbeeld: een fabriek genereert 10.000 euro throughput per uur. De bottleneck valt een uur stil door een vermijdbare omstelling. Verlies: 10.000 euro, ook al kost de machine zelf maar 50 euro per uur. Diezelfde omstelling op een non-bottleneck kost niets aan throughput. Daarom maakt TOC batchbeslissingen anders op bottlenecks (grote batches, weinig omstellingen) dan op non-bottlenecks (kleine batches, veel omstellingen).</p>\n<h2 id=\"29-mini-case-het-laboratorium\">2.9 Mini-case: het laboratorium</h2>\n<p>Een medisch lab heeft vier stations: intake, centrifuge, analyser, rapportage. Capaciteiten per uur: 60, 80, 40, 100 monsters. Vraag: 50 per uur.</p>\n<ul>\n<li>De analyser (40) is een <strong>bottleneck</strong>: capaciteit kleiner dan vraag.</li>\n<li>Iedereen wordt op efficiëntie gemeten. Intake verwerkt 60 per uur (over activation). Voor de analyser stapelt zich per uur 20 monsters op.</li>\n<li>Verkeerd gelabelde monsters blijken pas na de analyser. Elk fout monster heeft analysertijd verbruikt: garbage time.</li>\n</ul>\n<p>TOC-acties: labelcontrole vóór de analyser (exploit), intake terug naar 40 per uur (subordinate), pas daarna een tweede analyser (elevate). De centrifuge (80) heeft 40 productive capacity en de rest protective plus excess. Die reserve niet wegsnijden: na een storing moet de centrifuge snel kunnen inhalen zodat de analyser niet verhongert.</p>\n<h2 id=\"examenvallen\">Examenvallen</h2>\n<ul>\n<li><strong>Bottleneck versus CCR.</strong> Bottleneck: capaciteit kleiner dan of gelijk aan de vraag. CCR: gemiddeld voldoende capaciteit, maar zo krap dat variatie de throughput kan schaden. Een fabriek kan een CCR hebben terwijl de markt de constraint is.</li>\n<li><strong>Constraint versus bottleneck.</strong> Constraint is de bredere term (kan markt, critical chain, resource zijn). Bottleneck gaat alleen over resources met te weinig capaciteit.</li>\n<li><strong>Misnomers.</strong> Policy, measures, material en management (betekenis 1) constraints zijn volgens de Dictionary geen constraints; ze hinderen exploit en subordinate. Market constraint is daarentegen wél echt.</li>\n<li><strong>Dummy constraint elimineren, strategic constraint behouden.</strong> Twee tegengestelde acties, allebei juist.</li>\n<li><strong>Activation is niet utilization.</strong> Een resource die draait is geactiveerd; alleen wat bijdraagt aan het goal is benutting. Over activation levert voorraad, geen throughput.</li>\n<li><strong>Idle capacity is niet gelijk aan excess capacity.</strong> Idle bestaat uit protective plus excess. Alleen excess is echt overtollig.</li>\n<li><strong>Een uur bespaard op een non-bottleneck is geen winst.</strong> Alleen uren op de bottleneck tellen voor het systeem.</li>\n</ul>\n<h2 id=\"samenvatting\">Samenvatting</h2>\n<ul>\n<li>Een constraint is de factor die de systeemprestatie uiteindelijk begrenst; door hem te exploiteren, eraan te subordineren of hem te elevaten haal je meer van het goal.</li>\n<li>Elk systeem heeft minstens één constraint, maar zelden meer dan een paar.</li>\n<li>Echte constraints: interne capaciteit (bottleneck), markt, strategisch gekozen constraint. Dummy constraints zijn echt maar moeten altijd worden geëlimineerd.</li>\n<li>Misnomers volgens de Dictionary: policy, measures, material en (slecht) management. Zij hinderen exploit en subordinate.</li>\n<li>Bottleneck resource: capaciteit &lt;= vraag. CCR: capaciteit net voldoende maar kwetsbaar. Non-bottleneck: capaciteit &gt; vraag.</li>\n<li>Wandering bottleneck verspringt vaak; temporary bottleneck is kort; permanent bottleneck blijft ondanks extra middelen (bijvoorbeeld IT en sales in diensten).</li>\n<li>Dependent events plus statistical fluctuations maken dat variatie in een keten accumuleert (luciferspel, Herbie). Daarom is de output van een keten lager dan het gemiddelde van de stappen.</li>\n<li>Een balanced plant (alle capaciteiten gelijk aan de vraag) faalt daarom. TOC balanceert de flow, niet de capaciteit.</li>\n<li>Capaciteit van een non-constraint: productive (nodig voor de constraint) plus idle; idle bestaat uit protective (sprint; inhalen na Murphy) plus excess.</li>\n<li>Meer protective capacity maakt kleinere buffers en kortere doorlooptijden mogelijk; minder variatie vermindert de behoefte aan protective capacity.</li>\n<li>Activation is een resource laten draaien; utilization is activering die bijdraagt aan het goal. Over activation levert alleen voorraad.</li>\n<li>Een uur verloren op de bottleneck is een uur verloren voor het hele systeem; een uur bespaard op een non-bottleneck is een illusie. Garbage time is bottleneck-tijd besteed aan werk dat niet of elders gedaan had moeten worden.</li>\n</ul>", "q": [{"n": 1, "q": "Welke definitie van <em>constraint</em> komt overeen met de TOCICO Dictionary?", "opts": {"A": "Elke resource die minder dan 100 procent wordt benut", "B": "De factor die uiteindelijk de prestatie van het systeem begrenst", "C": "Elk beleid dat de productie vertraagt", "D": "De duurste machine in het systeem"}, "gebied": 1, "a": "B", "e": "Dit is de definitie uit de Dictionary. A verwart constraint met idle capacity. C beschrijft een policy constraint, die de Dictionary een misnomer noemt. D verwart leverage met omvang."}, {"n": 2, "q": "Een resource heeft een capaciteit van 105 stuks per dag bij een vraag van 100, maar heeft veel storingen waardoor de throughput regelmatig daalt. Deze resource is een:", "opts": {"A": "Bottleneck resource", "B": "Capacity-constrained resource (CCR)", "C": "Non-constraint zonder verdere aandacht", "D": "Dummy constraint"}, "gebied": 1, "a": "B", "e": "De capaciteit is gemiddeld voldoende (105 &gt; 100), maar variatie bedreigt de throughput als de resource niet zorgvuldig wordt gemanaged: de definitie van een CCR. A vereist capaciteit &lt;= vraag. C negeert het risico. D gaat over kostprijs, niet over capaciteit."}, {"n": 3, "q": "Welke van de volgende noemt de Dictionary een \"misnomer\" (onjuiste benaming)?", "opts": {"A": "Market constraint", "B": "Policy constraint", "C": "Strategic constraint", "D": "Interactive constraints"}, "gebied": 1, "a": "B", "e": "Policy constraint (net als measures, material en management constraint) is volgens de Dictionary een misnomer: slecht beleid hindert exploit en subordinate, maar is niet de constraint. A, C en D zijn wel echte constraint-begrippen."}, {"n": 4, "q": "Wat is het juiste onderscheid tussen <em>activation</em> en <em>utilization</em>?", "opts": {"A": "Activation geldt voor machines, utilization voor mensen", "B": "Activation is een resource laten werken; utilization is activering die productief bijdraagt aan het goal", "C": "Utilization is altijd hoger dan activation", "D": "Er is geen verschil; het zijn synoniemen"}, "gebied": 1, "a": "B", "e": "Activation is aan het werk zetten; utilization is activering die bijdraagt aan het goal. A en C zijn verzonnen. D is onjuist; het onderscheid is juist de kern."}, {"n": 5, "q": "Wat leert het luciferspel (match-bowl game) uit <em>The Goal</em>?", "opts": {"A": "Gemiddelden van individuele stappen voorspellen de output van een keten correct", "B": "Variatie in een keten van afhankelijke gebeurtenissen accumuleert en verlaagt de output onder het gemiddelde", "C": "Hoge worpen compenseren lage worpen volledig", "D": "Meer kommen in de rij verhogen de output"}, "gebied": 1, "a": "B", "e": "Omdat een jongen nooit meer kan doorgeve
