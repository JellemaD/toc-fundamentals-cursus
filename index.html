n dan hij heeft, worden lage worpen niet ingehaald en gaan hoge worpen verloren; variatie accumuleert. A en C zijn precies wat het spel weerlegt. D is onjuist; meer stappen verergeren het effect."}, {"n": 6, "q": "Waarom wijst TOC een <em>balanced plant</em> af?", "opts": {"A": "Omdat een balanced plant te veel excess capacity heeft", "B": "Omdat bij dependent events en statistical fluctuations verloren output nooit wordt ingehaald als niemand reserve heeft", "C": "Omdat lean een balanced plant voorschrijft", "D": "Omdat een balanced plant geen drum kan hebben"}, "gebied": 1, "a": "B", "e": "Zonder reservecapaciteit wordt elk verlies door variatie definitief. A is het omgekeerde. C is geen reden voor TOC. D is niet de reden; de vraag is of de plant flow kan beschermen."}, {"n": 7, "q": "<em>Idle capacity</em> op een non-constraint bestaat uit:", "opts": {"A": "Productive capacity en excess capacity", "B": "Protective capacity en excess capacity", "C": "Sprint capacity en productive capacity", "D": "Alleen excess capacity"}, "gebied": 1, "a": "B", "e": "Idle capacity = protective + excess. Productive capacity valt buiten idle. C mengt sprint (= protective) met productive. D vergeet protective."}, {"n": 8, "q": "Een fabriek genereert 8.000 euro throughput per uur. De bottleneck staat een uur stil door een vermijdbare omstelling. De machine kost 40 euro per uur. Wat is het verlies voor het systeem?", "opts": {"A": "40 euro", "B": "8.000 euro", "C": "8.040 euro", "D": "Niets, want de omstelling was nodig"}, "gebied": 1, "a": "B", "e": "Een uur verloren op de bottleneck is een uur verloren voor het hele systeem: 8.000 euro throughput. A is het cost-world-antwoord. C telt dubbel. D negeert dat de omstelling vermijdbaar was."}, {"n": 9, "q": "Wat moet volgens de Dictionary altijd gebeuren met een <em>dummy constraint</em>?", "opts": {"A": "Behouden als strategic constraint", "B": "Beschermen met een buffer", "C": "Elimineren", "D": "Verplaatsen naar de markt"}, "gebied": 1, "a": "C", "e": "De Dictionary: dummy constraints moeten altijd worden geëlimineerd, omdat ze goedkoop zijn ten opzichte van de rest van het systeem. A is het tegenovergestelde. B en D zijn geen acties voor een dummy constraint."}, {"n": 10, "q": "Welke uitspraak over <em>protective capacity</em> is juist?", "opts": {"A": "Meer protective capacity vereist grotere buffers", "B": "Protective capacity is verspilling die gesnoeid moet worden", "C": "Meer protective capacity maakt kleinere buffers en kortere doorlooptijden mogelijk", "D": "Alleen de constraint heeft protective capacity nodig"}, "gebied": 1, "a": "C", "e": "Meer protective capacity betekent dat non-constraints sneller inhalen, dus kleinere buffers en kortere doorlooptijden. A is omgekeerd. B is het traditionele misverstand. D is onjuist; juist non-constraints hebben protective capacity nodig."}]}, {"id": "ch03", "num": 3, "title": "De Five Focusing Steps en POOGI", "part": 1, "partShort": "Deel 1", "partLong": "TOC Fundamentals Concepts", "gebied": 1, "html": "<h2 id=\"leerdoelen\">Leerdoelen</h2>\n<p>Na dit hoofdstuk kun je:</p>\n<ul>\n<li>De <em>five focusing steps</em> in de juiste volgorde noemen en per stap uitleggen wat hij inhoudt.</li>\n<li>Concrete acties herkennen als identify, exploit, subordinate of elevate.</li>\n<li>Uitleggen waarom elevate pas na exploit en subordinate komt.</li>\n<li>De <em>prerequisite steps</em> en de <em>seven focusing steps</em> plaatsen, en weten voor welke organisaties die bedoeld zijn.</li>\n<li>Uitleggen wat <em>inertia</em> betekent in stap 5 en waarom TOC hiervoor waarschuwt.</li>\n<li>Het verband leggen tussen de five focusing steps, buffers, het <em>drum</em>, het <em>Pareto principle</em> en <em>policies, measurements and behaviors</em> (PMBs).</li>\n</ul>\n<h2 id=\"31-de-five-focusing-steps-in-een-oogopslag\">3.1 De five focusing steps in één oogopslag</h2>\n<p>De <em>five focusing steps</em> (5FS; vijf focusstappen) zijn een systematische aanpak in vijf stappen om het vermogen van een systeem om goal units te produceren voortdurend te verbeteren. De Dictionary formuleert ze zo:</p>\n<table>\n<thead>\n<tr>\n<th>Stap</th>\n<th>Engels (letterlijk)</th>\n<th>Nederlands</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>IDENTIFY the system's constraint(s)</td>\n<td>Identificeer de constraint(s) van het systeem</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Decide how to EXPLOIT the system's constraint(s)</td>\n<td>Besluit hoe je de constraint(s) gaat exploiteren</td>\n</tr>\n<tr>\n<td>3</td>\n<td>SUBORDINATE everything else to the above decision</td>\n<td>Maak al het overige ondergeschikt aan dat besluit</td>\n</tr>\n<tr>\n<td>4</td>\n<td>ELEVATE the system's constraint(s)</td>\n<td>Verhoog (de capaciteit van) de constraint(s)</td>\n</tr>\n<tr>\n<td>5</td>\n<td>WARNING!!!! If in the previous steps a constraint has been broken, go back to step 1, but do not allow INERTIA to cause a system's constraint</td>\n<td>Als een constraint is doorbroken, ga terug naar stap 1, maar laat inertie geen constraint worden</td>\n</tr>\n</tbody>\n</table>\n<p>Engelse kern: \"A systematic five-step approach used to continually improve a system's ability to produce goal units.\"</p>\n<p>De 5FS zijn één van de drie <em>processes of ongoing improvement</em> (POOGI) van TOC, naast de change question sequence en buffer management (zie hoofdstuk 1).</p>\n<p>Let op de precieze bewoording van stap 2: niet \"exploit\", maar \"<strong>decide how to</strong> exploit\". Het is een beslisstap. Stap 3 verwijst naar \"the above decision\": het besluit van stap 2. Examens toetsen dit soort details.</p>\n<h2 id=\"32-stap-1-identify\">3.2 Stap 1: Identify</h2>\n<p><em>Identify</em> (identificeren) is het proces van bepalen welke factor op dit moment het bereiken van het goal het meest beperkt. Engelse kern: \"determining what factor is currently most limiting attainment of the goal.\"</p>\n<p>Hoe vind je de constraint in de praktijk?</p>\n<ul>\n<li><strong>Waar stapelt werk zich op?</strong> Voor een bottleneck groeit de wachtrij (Herbie: de jongens vóór hem lopen weg, de afstand groeit).</li>\n<li><strong>Waar wordt het meest om gevochten?</strong> De resource waar iedereen zijn order voorrang wil geven.</li>\n<li><strong>Waar wordt het vaakst gewacht?</strong> Als klanten wachten omdat de fabriek niet kan leveren, zit de constraint intern. Als de fabriek wacht op orders, is de markt de constraint.</li>\n<li><strong>Belastingsanalyse.</strong> Vergelijk per resource de benodigde uren (vraag maal bewerkingstijd) met de beschikbare uren. De resource met het hoogste percentage is de kandidaat.</li>\n</ul>\n<p>Een valkuil: beleid kan een resource als bottleneck laten lijken terwijl het dat niet is. De Dictionary noemt batchbeleid, \"process batch gelijk aan transfer batch\", sturen op efficiëntie en het eindemaandsyndroom. Zulke resources blijken na stap 2 en 3 ruim voldoende capaciteit te hebben. Daarom is stap 1 nooit definitief: je identificeert de constraint zoals hij <strong>nu</strong> is.</p>\n<p>Voorbeeld: in een softwarebedrijf blijven alle projecten hangen bij de testafdeling. De testafdeling is de kandidaat-constraint. Maar bij nader inzien ontvangt zij alle werk op de laatste dag van de sprint (batchbeleid). Met een gelijkmatige aanvoer heeft zij genoeg capaciteit. De echte constraint zit dan mogelijk elders, bijvoorbeeld in de markt of bij de architecten.</p>\n<h2 id=\"33-stap-2-exploit\">3.3 Stap 2: Exploit</h2>\n<p><em>Exploit</em> (benutten) betekent bij een interne resource constraint: meer goal units halen door acties die het beste gebruik maken van de constraint. Engelse kern: \"get more goal units by taking actions that make the best use of the constraint.\"</p>\n<p>Het sleutelwoord is <strong>zonder grote investering</strong>. Exploit gaat over slim gebruiken wat je hebt. De Dictionary geeft de acties uit <em>The Goal</em> bij de NCX-10 en noemt algemene acties:</p>\n<table>\n<thead>\n<tr>\n<th>Actie</th>\n<th>Waarom het werkt</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>De constraint bemensen tijdens lunch, pauzes en ploegwissel</td>\n<td>Elk uur stilstand op de constraint is systeemverlies</td>\n</tr>\n<tr>\n<td>Kwaliteitscontrole <strong>vóór</strong> de constraint plaatsen</td>\n<td>Defecte onderdelen verspillen anders constraint-tijd (garbage time)</td>\n</tr>\n<tr>\n<td>Een schema (drum) maken voor de constraint</td>\n<td>De constraint werkt aan de juiste orders in de juiste volgorde</td>\n</tr>\n<tr>\n<td>Omsteltijden op de constraint verkorten (SMED)</td>\n<td>Meer productieve uren</td>\n</tr>\n<tr>\n<td>Total productive maintenance op de constraint</td>\n<td>Minder storingen op de plek waar dat het meest kost</td>\n</tr>\n<tr>\n<td>Werk offloaden naar andere resources of oude machines</td>\n<td>Alleen werk dat echt op de constraint moet, blijft daar</td>\n</tr>\n<tr>\n<td>Alleen produceren wat verkocht wordt</td>\n<td>Geen constraint-tijd aan voorraad besteden</td>\n</tr>\n<tr>\n<td>Bij een market constraint: een <em>unrefusable offer</em> (onweerstaanbaar aanbod)</td>\n<td>Meer orders halen uit de bestaande markt</td>\n</tr>\n</tbody>\n</table>\n<p>Merk op dat \"offload\" (werk weghalen bij de constraint) in de literatuur soms onder exploit en soms onder elevate wordt geplaatst. De Dictionary noemt bij <em>elevate</em> het terughalen van oude machines die hetzelfde kunnen als de NCX-10. Het onderscheid: offloaden naar bestaande capaciteit zonder investering is exploit; capaciteit toevoegen (oude machines terugkopen, uitbesteden tegen kosten) is elevate.</p>\n<h3 id=\"exploit-bij-een-market-constraint\">Exploit bij een market constraint</h3>\n<p>Als de markt de constraint is, betekent exploit: haal het maximale uit de bestaande vraag. Lever 100 procent op tijd, verlies geen enkele order door slechte service, en doe een aanbod dat de klant niet kan weigeren (bijvoorbeeld snelle en betrouwbare levering). Het is een misverstand dat de 5FS alleen voor fabrieken gelden.</p>\n<h2 id=\"34-stap-3-subordinate\">3.4 Stap 3: Subordinate</h2>\n<p><em>Subordinate</em> (ondergeschikt maken) is de derde stap: maak al het overige ondergeschikt aan het exploit-besluit. De Dictionary noemt subordinatie vitaal om volledige exploitatie te bereiken en onderscheidt twee componenten:</p>\n<ol>\n<li>Alle non-constraint resources worden zo gemanaged dat de constraint <strong>altijd precies heeft wat hij nodig heeft, wanneer hij het nodig heeft</strong>.</li>\n<li>Alle non-constraint resources mogen <strong>niet meer werk verwerken dan nodig is</strong> voor de constraint.</li>\n</ol>\n<p>Engelse kern: \"Subordinate everything else to the above decision.\"</p>\n<p>Component 1 gaat over voeden: de constraint mag nooit verhongeren (starvation) of geblokkeerd raken (blockage). Component 2 gaat over afremmen: geen over activation, geen voorraadbergen.</p>\n<p>Voorbeeld uit de Dictionary: non-bottleneck resources moeten lokale efficiëntie negeren en kleinere batches draaien, zodat de constraint niet verhongert.</p>\n<h3 id=\"waarom-subordinate-de-moeilijkste-stap-is\">Waarom subordinate de moeilijkste stap is</h3>\n<p>Stap 3 raakt gedrag en metingen. Een operator die altijd op output is beoordeeld, moet nu soms stilstaan. Een verkoper die op omzet wordt beoordeeld, moet soms een order weigeren die de constraint overbelast. Een inkoper die op prijs wordt beoordeeld, moet soms duurder inkopen om de constraint niet te laten wachten. Subordinatie vereist dat de organisatie de constraint boven de lokale prestatie stelt.</p>\n<h3 id=\"subordinatie-en-buffers\">Subordinatie en buffers</h3>\n<p>Buffers zijn het belangrijkste instrument van subordinatie. Een <em>buffer</em> (buffer) is bescherming tegen onzekerheid, in de vorm van tijd, voorraad of capaciteit. In drum-buffer-rope (deel 3) beschermt een <em>constraint buffer</em> (een tijdbuffer vóór de constraint) tegen verhongering: materiaal wordt zoveel eerder vrijgegeven dat de constraint altijd werk heeft, ook als er ergens stroomopwaarts iets misgaat. Het <em>rope</em> (touw) koppelt de materiaalvrijgave aan het tempo van de constraint, zodat non-constraints niet meer verwerken dan nodig. Beide zijn concrete vormen van \"subordinate everything else\".</p>\n<p>De <em>protective capacity</em> op non-constraints (hoofdstuk 2) is eveneens subordinatie: non-constraints houden reserve om na Murphy de buffer voor de constraint weer te vullen.</p>\n<h3 id=\"het-drum\">Het drum</h3>\n<p>Het <em>drum</em> (trommel) is in operations het schema van de constraint, de \"drumbeat\" van de organisatie. Engelse kern: \"the schedule of the constraint, the drumbeat of the organization.\" Het drum is het resultaat van stap 2 (besluit hoe de constraint wordt benut, in welke volgorde) en het uitgangspunt van stap 3 (alles wordt op het drum afgestemd). De <em>drum resource</em> is de resource die als drum dient: een constraint of een CCR. In simplified drum-buffer-rope is de markt het drum en krijgt een eventuele CCR secundaire aandacht.</p>\n<h2 id=\"35-stap-4-elevate\">3.5 Stap 4: Elevate</h2>\n<p><em>Elevate</em> (verhogen) betekent: acties nemen die niet exploiteren of subordineren, maar die er toch toe leiden dat het systeem meer goal units produceert. Deze acties vereisen meestal investering of uitbesteding. Engelse kern: \"actions that... usually require investment or outsourcing.\"</p>\n<p>Voorbeelden:</p>\n<ul>\n<li>Een tweede machine kopen.</li>\n<li>Extra personeel aannemen of een extra ploeg starten.</li>\n<li>Werk uitbesteden aan een leverancier.</li>\n<li>Bij een market constraint: nieuwe markten of segmenten openen, een nieuw product lanceren.</li>\n</ul>\n<p>Het voorbeeld uit <em>The Goal</em>: na alle exploit- en subordinate-acties kon UNICO nog steeds niet aan de vraag voldoen. Ze haalden oude, minder efficiënte machines terug die hetzelfde konden als de NCX-10.</p>\n<h3 id=\"waarom-elevate-pas-na-exploit-en-subordinate\">Waarom elevate pas na exploit en subordinate?</h3>\n<p>Dit is een klassieke examenvraag. Drie redenen:</p>\n<ol>\n<li><strong>Exploit en subordinate kosten weinig en leveren vaak veel.</strong> In veel bedrijven blijkt de constraint na stap 2 en 3 helemaal geen constraint meer te zijn. Investeren in stap 4 zou dan geld verspillen aan capaciteit die je niet nodig hebt.</li>\n<li><strong>Zonder subordinatie is elevate zinloos.</strong> Als non-constraints de nieuwe capaciteit niet kunnen voeden, staat de dure nieuwe machine ook stil.</li>\n<li><strong>Je weet pas na exploit hoeveel je moet elevaten.</strong> De werkelijke capaciteit van de constraint blijkt pas na optimaal gebruik.</li>\n</ol>\n<p>Vuistregel: nooit investeren in de constraint voordat je zeker weet dat je hem al maximaal benut.</p>\n<h2 id=\"36-stap-5-go-back-en-pas-op-voor-inertia\">3.6 Stap 5: Go back, en pas op voor inertia</h2>\n<p>Als in de vorige stappen de constraint is doorbroken (hij is geen constraint meer), ga dan terug naar stap 1. Er is nu een nieuwe constraint. Dat kan een andere resource zijn, of de markt.</p>\n<p>De waarschuwing: <strong>laat inertia geen constraint van het systeem worden.</strong> <em>Inertia</em> (inertie, traagheid) betekent hier dat regels, beleid en gedrag die zijn ingevoerd om de oude constraint te managen, blijven bestaan nadat die constraint is verdwenen. Die oude regels beperken dan de nieuwe situatie.</p>\n<p>Voorbeeld: toen de warmtebehandelingsoven de constraint was, was de regel \"grote batches op de oven\". Nu de oven ruim capaciteit heeft, zijn grote batches alleen nog schadelijk: ze verlengen de doorlooptijd en laten de nieuwe constraint wachten. Als niemand de regel intrekt, wordt de regel zelf de beperking.</p>\n<p>De Dictionary beschrijft inertia ook als een <em>engine of disharmony</em> (een proces dat het goal tegenwerkt): veel mensen voeren taken uit waarvoor de reden niet meer bestaat.</p>\n<p>Stap 5 maakt de 5FS tot een cyclus: een POOGI. Zonder stap 5 is het een eenmalig project.</p>\n<pre><code>        +---&gt; 1. IDENTIFY ---&gt; 2. EXPLOIT ---&gt; 3. SUBORDINATE ---&gt; 4. ELEVATE ---+\n        |                                                                          |\n        +------------- 5. constraint doorbroken? terug; pas op INERTIA &lt;-----------+\n</code></pre>\n<h2 id=\"37-prerequisite-steps-en-de-seven-focusing-steps\">3.7 Prerequisite steps en de seven focusing steps</h2>\n<p>De 5FS veronderstellen dat je weet wat \"het systeem\" en \"het goal\" zijn. In praktijk is dat niet altijd zo. Daarom kent TOC <em>prerequisite steps</em> (voorbereidende stappen):</p>\n<ol>\n<li>Definieer het systeem en de grenzen ervan.</li>\n<li>Definieer het goal van het systeem.</li>\n<li>Definieer de metingen waarmee je vaststelt of het systeem dichter bij het goal komt.</li>\n</ol>\n<p>De Dictionary formaliseert dit als de <em>seven focusing steps</em>: de vijf oorspronkelijke stappen plus twee stappen ervoor:</p>\n<table>\n<thead>\n<tr>\n<th>Stap</th>\n<th>Inhoud</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>State the goal of the organization (formuleer het goal)</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Define global performance measures (definieer de globale prestatiemetingen)</td>\n</tr>\n<tr>\n<td>3-7</td>\n<td>Identify, exploit, subordinate, elevate, go back</td>\n</tr>\n</tbody>\n</table>\n<p>Engelse kern: \"the original five focusing steps plus two additional steps inserted at the beginning.\"</p>\n<p>De Dictionary zegt expliciet voor wie dit is bedoeld: <strong>not-for-profit- en overheidsorganisaties</strong>, waar het goal anders is dan geld verdienen en er dus eerst een heldere definitie van throughput in goal units nodig is om een globaal meetsysteem te bouwen. Voor een commercieel bedrijf zijn goal en metingen (T, I, OE) al bekend en volstaan de vijf stappen.</p>\n<h2 id=\"38-pareto-principle-en-focus\">3.8 Pareto principle en focus</h2>\n<p>Het <em>Pareto principle</em> (Pareto-principe) stelt dat bij veel verschijnselen ongeveer 80 procent van de effecten voortkomt uit 20 procent van de oorzaken. Engelse kern: \"approximately 80% of the effects result from 20% of the causes.\"</p>\n<p>Goldratt ging verder. De Dictionary citeert zijn standpunt: Pareto geldt voor <strong>onafhankelijke</strong> items. In de meeste systemen bestaat echter afhankelijkheid. Bij afhankelijke items is de verhouding veel schever dan 80/20: bijvoorbeeld 0,1 procent van de items veroorzaakt 99,9 procent van de effecten.</p>\n<p>Dit is de rechtvaardiging voor de 5FS. Als één constraint vrijwel alle output bepaalt, is focus op die ene constraint niet slechts \"efficiënt\", maar de enige aanpak die werkt. Verbeterprogramma's die overal tegelijk verbeteren (klassieke TQM, kaizen zonder focus) verspreiden de inspanning over de 99,9 procent die er niet toe doet.</p>\n<h2 id=\"39-policies-measurements-and-behaviors-pmbs\">3.9 Policies, measurements and behaviors (PMBs)</h2>\n<p>Waarom gedragen mensen zich zoals ze doen? De Dictionary beschrijft <em>policies, measurements and behaviors</em> (PMBs; beleid, metingen en gedrag) als een reeks van drie entiteiten die de oorzaak-gevolgrelatie documenteert tussen een beleid, de bijbehorende meting en het resulterende gedrag.</p>\n<pre><code> POLICY (beleid)          --&gt;  MEASUREMENT (meting)      --&gt;  BEHAVIOR (gedrag)\n &quot;Houd iedereen bezig,        Lokale efficiëntie en          Werk wordt te vroeg\n  dat verlaagt de kostprijs&quot;   resourcebenutting              vrijgegeven; overproductie\n</code></pre>\n<p>Het voorbeeld uit de Dictionary: op basis van de aanname dat hogere lokale efficiëntie wenselijk is, bestaat het (informele) beleid om medewerkers altijd bezig te houden. De metingen zijn lokale efficiëntie en benutting. Het gedrag is dat werk vroeg wordt vrijgegeven. De ongewenste effecten: te veel onderhanden werk en gereed product, verwaterde prioriteiten, slechte leverbetrouwbaarheid, lage kaspositie.</p>\n<p>PMBs zijn belangrijk voor de 5FS om twee redenen:</p>\n<ul>\n<li><strong>Subordinate (stap 3) mislukt als de PMBs niet veranderen.</strong> Je kunt operators niet vragen stil te staan als ze op efficiëntie worden afgerekend. \"Tell me how you measure me and I will tell you how I will behave\" is een bekende uitspraak van Goldratt.</li>\n<li><strong>Inertia (stap 5) is vaak een PMB die is blijven hangen.</strong> De oude constraint is weg, maar het beleid en de meting die erbij hoorden, sturen nog steeds het gedrag.</li>\n</ul>\n<p>Bij het bouwen van een current reality tree (deel 2) worden PMB-reeksen expliciet vastgelegd, omdat ze vaak de bron zijn van meerdere ongewenste effecten.</p>\n<h2 id=\"310-mini-case-de-fietsenfabriek\">3.10 Mini-case: de fietsenfabriek</h2>\n<p>Fietsenfabriek Velo maakt 400 fietsen per week; de markt vraagt er 500. De lakstraat kan 400 frames per week aan. Alle andere afdelingen kunnen 550 of meer.</p>\n<p><strong>Stap 1, identify.</strong> Voor de lakstraat staan rekken vol frames. De lakstraat is de constraint (bottleneck: capaciteit 400 &lt; vraag 500).</p>\n<p><strong>Stap 2, exploit.</strong> Analyse van de lakstraat:\n- De lakstraat staat elke dag 45 minuten stil bij ploegwissel en 30 minuten bij lunch. Doorlopend bemensen: +8 procent capaciteit.\n- 5 procent van de gelakte frames wordt afgekeurd wegens lasfouten die al vóór het lakken zichtbaar waren. Lascontrole vóór de lakstraat: +5 procent.\n- De lakstraat lakt ook frames voor een goedkoop model dat op voorraad wordt gemaakt en slecht verkoopt. Alleen op order lakken: +4 procent.\nResultaat: ongeveer 470 frames per week, zonder investering.</p>\n<p><strong>Stap 3, subordinate.</strong> Het lasserij-team wordt niet langer op output beoordeeld, maar op het op tijd en foutloos aanleveren van precies de frames die de lakstraat nodig heeft. Materiaalvrijgave wordt gekoppeld aan het lakschema (rope). Voor de lakstraat wordt een buffer van twee dagen werk aangehouden. De lasserij houdt reserve (protective capacity) om na een storing snel bij te lopen.</p>\n<p><strong>Stap 4, elevate.</strong> Er ontbreken nog 30 fietsen per week. Nu pas wordt geïnvesteerd: een tweede droogoven in de lakstraat, waardoor de capaciteit naar 560 gaat.</p>\n<p><strong>Stap 5, go back.</strong> De lakstraat (560) is nu ruimer dan de markt (500). De markt is de nieuwe constraint. Verkoop moet nu de constraint exploiteren. En de oude regel \"grote lakbatches per kleur\" moet worden ingetrokken, anders veroorzaakt inertia lange doorlooptijden die klanten wegjagen.</p>\n<h2 id=\"examenvallen\">Examenvallen</h2>\n<ul>\n<li><strong>Volgorde.</strong> Identify, exploit, subordinate, elevate, go back. Een antwoordoptie met elevate vóór exploit is fout.</li>\n<li><strong>\"Decide how to exploit\".</strong> Stap 2 is een beslissing; stap 3 subordineert aan \"the above decision\". Het examen kan letterlijk citeren.</li>\n<li><strong>Exploit versus elevate.</strong> Exploit: beter gebruiken zonder wezenlijke investering. Elevate: capaciteit toevoegen, meestal met investering of uitbesteding. Kwaliteitscontrole vóór de constraint is exploit; een tweede machine kopen is elevate.</li>\n<li><strong>Subordinate heeft twee kanten.</strong> Voeden (de constraint mag niets tekortkomen) én afremmen (niet meer produceren dan de constraint nodig heeft).</li>\n<li><strong>Inertia</strong> is geen luiheid, maar het laten voortbestaan van regels voor een constraint die niet meer bestaat.</li>\n<li><strong>Seven focusing steps</strong> zijn de 5FS plus \"state the goal\" en \"define global measures\" vooraf, bedoeld voor non-profit en overheid.</li>\n<li><strong>Pareto.</strong> Goldratt stelt dat 80/20 geldt voor onafhankelijke items; bij afhankelijkheid is de verhouding veel schever (bijvoorbeeld 0,1/99,9).</li>\n<li><strong>PMB-volgorde.</strong> Policy leidt tot measurement leidt tot behavior. Niet andersom.</li>\n</ul>\n<h2 id=\"samenvatting\">Samenvatting</h2>\n<ul>\n<li>De five focusing steps: 1 identify, 2 decide how to exploit, 3 subordinate everything else to that decision, 4 elevate, 5 if the constraint is broken go back to step 1 but don't let inertia become the constraint.</li>\n<li>De 5FS zijn een van de drie POOGI's van TOC.</li>\n<li>Identify: bepaal wat het goal nu het meest beperkt; let op beleid dat een resource ten onrechte als bottleneck laat lijken.</li>\n<li>Exploit: haal het maximale uit de constraint zonder grote investering (bemensen in pauzes, kwaliteitscontrole ervoor, drum-schema, omsteltijd, TPM, alleen op order, unrefusable offer bij market constraint).</li>\n<li>Subordinate: non-constraints geven de constraint precies wat hij nodig heeft en doen niet meer dan dat; buffers, rope en protective capacity zijn de instrumenten.</li>\n<li>Het drum is het schema van de constraint, resultaat van exploit en basis voor subordinate.</li>\n<li>Elevate: capaciteit toevoegen, meestal met investering; pas na exploit en subordinate, omdat die vaak al voldoende zijn en je anders in ongebruikte capaciteit investeert.</li>\n<li>Stap 5 maakt de 5FS tot een cyclus; inertia (oude regels die blijven hangen) is het gevaar.</li>\n<li>Prerequisite steps: definieer systeem, goal en metingen; de seven focusing steps voegen \"state the goal\" en \"define global measures\" toe, vooral voor non-profit en overheid.</li>\n<li>Pareto: 80/20 bij onafhankelijke items; bij afhankelijkheid veel schever, wat focus op één constraint rechtvaardigt.</li>\n<li>PMBs: beleid leidt tot metingen leidt tot gedrag; subordinatie en het vermijden van inertia vereisen het aanpassen van PMBs.</li>\n</ul>", "q": [{"n": 1, "q": "Wat is de juiste volgorde van de five focusing steps?", "opts": {"A": "Identify, elevate, exploit, subordinate, go back", "B": "Identify, exploit, subordinate, elevate, go back", "C": "Exploit, identify, subordinate, elevate, go back", "D": "Identify, subordinate, exploit, elevate, go back"}, "gebied": 1, "a": "B", "e": "Identify, exploit, subordinate, elevate, go back is de volgorde uit de Dictionary. A, C en D verwissele raint mag nooit worden verplaatst", "D": "Investeringen in de oude constraint moeten worden terugverdiend"}, "gebied": 1, "a": "B", "e": "Inertia is het laten voortbestaan van regels en metingen die bij een verdwenen constraint hoorden. A verwart inertia met inzet. C is onjuist; de constraint verplaatst juist. D is geen TOC-principe."}, {"n": 6, "q": "Voor welk type organisatie zijn de <em>seven focusing steps</em> volgens de Dictionary vooral bedoeld?", "opts": {"A": "Beursgenoteerde productiebedrijven", "B": "Not-for-profit- en overheidsorganisaties", "C": "Projectorganisaties", "D": "Distributiebedrijven"}, "gebied": 1, "a": "B", "e": "De Dictionary noemt expliciet not-for-profit en government, omdat daar het goal niet geld is en throughput in goal units eerst gedefinieerd moet worden. A, C en D zijn niet wat de Dictionary zegt."}, {"n": 7, "q": "Welke twee stappen worden in de seven focusing steps vóór de five focusing steps geplaatst?", "opts": {"A": "Define the buffer; define the rope", "B": "State the goal; define global performance measures", "C": "Identify the market; identify the drum", "D": "Exploit the constraint; elevate the constraint"}, "gebied": 1, "a": "B", "e": "State the goal en define global performance measures. A en C zijn DBR-begrippen. D zijn bestaande stappen."}, {"n": 8, "q": "Wat stelt Goldratt over het <em>Pareto principle</em> volgens de Dictionary?", "opts": {"A": "Het geldt in alle situaties exact als 80/20", "B": "Het geldt voor onafhankelijke items; bij afhankelijkheid is de verhouding veel schever", "C": "Het is niet van toepassing op TOC", "D": "Het geldt alleen voor voorraadbeheer"}, "gebied": 1, "a": "B", "e": "Goldratt: Pareto geldt voor onafhankelijke items; bij afhankelijkheid kan 0,1 procent van de items 99,9 procent van de effecten veroorzaken. A, C en D zijn onjuist."}, {"n": 9, "q": "Een beleid \"houd iedereen bezig\" leidt tot de meting \"lokale efficiëntie\" en het gedrag \"werk te vroeg vrijgeven\". Hoe noemt de Dictionary deze reeks?", "opts": {"A": "Five focusing steps", "B": "Policies, measurements and behaviors (PMBs)", "C": "Engines of harmony", "D": "Dependent events"}, "gebied": 1, "a": "B", "e": "Policy, measurement, behavior: precies de PMB-reeks uit de Dictionary. A is het verbeterproces. C is het tegenovergestelde (engines of harmony ondersteunen het goal). D gaat over afhankelijke gebeurtenissen."}, {"n": 10, "q": "Een bedrijf koopt een tweede machine voor de constraint-bewerking nadat exploit en subordinate onvoldoende bleken. Welke stap is dit?", "opts": {"A": "Exploit", "B": "Subordinate", "C": "Elevate", "D": "Identify"}, "gebied": 1, "a": "C", "e": "Capaciteit toevoegen met investering is elevate. A en B zijn de goedkope stappen daarvoor. D is het vinden van de constraint."}]}];

      const read = store.get('read.'+c.id,false);
      const sc = c.q.length ? (b!==null ? `<span class="zone ${zone(b)}">${b}%</span>` : `<span class="s">${c.q.length} ${T.questions}</span>`) : '';
      h += `<div class="row" data-ch="${c.id}"><div class="n">${c.num}</div><div class="t"><b>${esc(c.title)}</b><small>${read?T.read:T.unread}${c.q.length?' · '+c.q.length+' '+T.questions:''}</small></div>${sc}</div>`;
    }
    h += `</div>`;
  }
  if(T.trial){
    h += `<div class="card"><h2>${esc(T.trial.lockedHead)}</h2>`;
    for(const l of T.trial.locked){
      h += `<div class="row locked"><div class="n">${l.num}</div><div class="t"><b>${esc(l.title)}</b><small>${esc(T.trial.lockedNote)}</small></div><span class="s">🔒</span></div>`;
    }
    h += `</div>` + buyCard();
  }
  main.innerHTML = h;
  main.querySelectorAll('.row:not(.locked)').forEach(r=>r.onclick=()=>go({view:'chapter', id:r.dataset.ch}));
  main.querySelectorAll('.row.locked').forEach(r=>r.onclick=()=>window.open(T.trial.buyUrl,'_blank','noopener'));
  $('#mixBtn').onclick = ()=>mixSetup();
  if(hasExam) $('#examBtn').onclick = ()=>examSetup();
}

function buyCard(){
  return `<div class="card buy"><h2>${esc(T.trial.head)}</h2><p style="margin:0 0 10px">${esc(T.trial.text)}</p>
    <a class="btn block" href="${T.trial.buyUrl}" target="_blank" rel="noopener">${esc(T.trial.button)}</a></div>`;
}

function mixSetup(){
  title.textContent = T.mix;
  back.classList.remove('hidden');
  main.innerHTML = `<div class="card"><h2>${T.chooseArea}</h2>
    ${[1,2,3].map(g=>`<label class="chk"><input type="checkbox" class="g" value="${g}" checked> ${T.area} ${g} · ${T.areaNames[g]} (${T.areaRanges[g]})</label>`).join('')}
    <h2 style="margin-top:14px">${T.numQuestions}</h2>
    <div class="grid2"><button class="btn sec" data-n="10">10</button><button class="btn sec" data-n="20">20</button><button class="btn sec" data-n="40">40</button><button class="btn sec" data-n="999">${T.all}</button></div>
    <label class="chk" style="margin-top:12px"><input type="checkbox" id="onlyWrong"> ${T.onlyWrong}</label>
  </div>`;
  main.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{
    const gs = [...main.querySelectorAll('.g:checked')].map(x=>+x.value);
    const wrong = store.get('wrong', {});
    let pool = [];
    DATA.filter(c=>c.gebied && gs.includes(c.gebied)).forEach(c=>c.q.forEach(q=>pool.push({...q, ch:c.id, chTitle:c.title, key:c.id+':'+q.n})));
    if($('#onlyWrong').checked) pool = pool.filter(q=>wrong[q.key]);
    if(!pool.length){ alert(T.noQuestions); return; }
    shuffle(pool);
    pool = pool.slice(0, +b.dataset.n);
    go({view:'quiz', mode:'mix', qs:pool, i:0, ans:{}, label:fmt(T.mixLabel,{n:pool.length})});
  });
}

function examSetup(){
  const c = CH['ch15'];
  title.textContent = T.exam;
  back.classList.remove('hidden');
  const b = bestOf('ch15');
  main.innerHTML = `<div class="card content">${c.html}</div>
    <div class="card"><h2>${T.settings}</h2>
    <label class="chk"><input type="checkbox" id="exFeedback"> ${T.directFeedback}</label>
    <label class="chk"><input type="checkbox" id="exTimer" checked> ${T.showTimer}</label>
    ${b!==null?`<p class="small muted">${T.bestSoFar} <b>${b}%</b></p>`:''}
    <button class="btn block" id="startEx">${T.startExam}</button></div>`;
  $('#startEx').onclick = ()=>{
    const qs = c.q.map(q=>({...q, ch:'ch15', key:'ch15:'+q.n}));
    go({view:'quiz', mode:'exam', qs, i:0, ans:{}, label:T.exam, feedback:$('#exFeedback').checked, timer:$('#exTimer').checked, start:Date.now()});
  };
}

function chapter(){
  const c = CH[state.id];
  title.textContent = T.chAbbr+c.num+' · '+c.title;
  store.set('read.'+c.id, true);
  if(c.id==='ch15'){ examSetup(); return; }
  const qbtn = c.q.length ? `<button class="btn block" id="startQ">${T.practiceBtn} (${c.q.length}) →</button>` : '';
  const search = c.id==='ch16' ? `<input class="search sans" id="srch" placeholder="${T.searchTerm}">` : '';
  const tail = (T.trial && DATA.indexOf(c)===DATA.length-1) ? buyCard() : '';
  main.innerHTML = `${search}<div class="card content" id="cnt"><h1>${T.chapterWord} ${c.num}. ${esc(c.title)}</h1>${c.html}</div>${qbtn}${tail}`;
  if(c.q.length){
    $('#startQ').onclick = startChapterQuiz;
    bnav.classList.remove('hidden');
    bnav.innerHTML = `<button class="btn sec" id="prevCh">‹ ${T.prev}</button><button class="btn" id="quizNav">${T.practiceBtn}</button><button class="btn sec" id="nextCh">${T.next} ›</button>`;
    $('#quizNav').onclick = startChapterQuiz;
  } else {
    bnav.classList.remove('hidden');
    bnav.innerHTML = `<button class="btn sec" id="prevCh">‹ ${T.prev}</button><button class="btn sec" id="nextCh">${T.next} ›</button>`;
  }
  const idx = DATA.indexOf(c);
  $('#prevCh').disabled = idx===0; $('#nextCh').disabled = idx===DATA.length-1;
  $('#prevCh').onclick = ()=>go({view:'chapter', id:DATA[idx-1].id});
  $('#nextCh').onclick = ()=>go({view:'chapter', id:DATA[idx+1].id});
  function startChapterQuiz(){
    const qs = c.q.map(q=>({...q, ch:c.id, key:c.id+':'+q.n}));
    go({view:'quiz', mode:'chapter', id:c.id, qs, i:0, ans:{}, label:T.chAbbr+c.num+' · '+T.practiceBtn, feedback:true});
  }
  if(c.id==='ch16'){
    const cnt = $('#cnt');
    const items = [...cnt.querySelectorAll('p, li')];
    $('#srch').oninput = e=>{
      const v = e.target.value.trim().toLowerCase();
      items.forEach(el=>el.classList.toggle('hidden', v.length>1 && !el.textContent.toLowerCase().includes(v)));
      cnt.querySelectorAll('h2').forEach(h=>h.classList.toggle('hidden', v.length>1));
    };
  }
}

function quiz(){
  const st = state, q = st.qs[st.i], n = st.qs.length;
  const feedback = st.mode==='exam' ? !!st.feedback : true;
  title.textContent = `${st.label}  ${st.i+1}/${n}`;
  if(st.mode==='exam' && st.timer){
    timerEl.classList.remove('hidden');
    const tick = ()=>{ const left = 150*60*1000 - (Date.now()-st.start); const s = Math.max(0,Math.floor(left/1000)); timerEl.textContent = `${Math.floor(s/3600)}:${String(Math.floor(s%3600/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; if(left<=0){ stopTimer(); finish(); } };
    tick(); timerId = setInterval(tick, 1000);
  }
  const given = st.ans[st.i];
  const src = st.mode==='mix' ? `<span class="pill">${esc(CH[q.ch].title)}</span>` : (q.gebied && st.mode==='exam' ? `<span class="pill">${T.area} ${q.gebied}</span>`:'');
  let h = `<div class="prog"><i style="width:${Math.round(st.i/n*100)}%"></i></div>
    <div class="card"><p class="q"><span class="nr">${src}${fmt(T.questionOf,{i:st.i+1,n})}</span>${q.q}</p>`;
  for(const k of Object.keys(q.opts)){
    let cls = 'opt';
    if(given!==undefined){
      if(feedback){ if(k===q.a) cls+=' ok'; else if(k===given) cls+=' bad'; }
      else if(k===given) cls+=' sel';
    }
    h += `<button class="${cls}" data-k="${k}" ${given!==undefined && feedback?'disabled':''}><b>${k}</b><span>${q.opts[k]}</span></button>`;
  }
  if(given!==undefined && feedback){
    const ok = given===q.a;
    h += `<div class="expl ${ok?'ok':'bad'}"><span class="v">${ok?T.correct:T.wrongIs+q.a}</span>${q.e}</div>`;
  }
  h += `</div>`;
  main.innerHTML = h;
  main.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(feedback && st.ans[st.i]!==undefined) return;
    st.ans[st.i] = b.dataset.k;
    const wrong = store.get('wrong', {});
    if(b.dataset.k===q.a) delete wrong[q.key]; else wrong[q.key]=1;
    store.set('wrong', wrong);
    history.replaceState(st,'');
    if(feedback) render(); else next();
  });
  bnav.classList.remove('hidden');
  const answered = Object.keys(st.ans).length;
  bnav.innerHTML = `<button class="btn sec" id="pq" ${st.i===0?'disabled':''}>‹</button>
    ${st.i<n-1 ? `<button class="btn" id="nq">${T.next} ›</button>` : `<button class="btn" id="fin">${T.finish} (${answered}/${n})</button>`}
    ${st.mode==='exam' && st.i<n-1 ? `<button class="btn sec" id="fin2">${T.stop}</button>`:''}`;
  $('#pq').onclick = ()=>{ st.i--; history.replaceState(st,''); render(); window.scrollTo(0,0); };
  const nq = $('#nq'); if(nq) nq.onclick = next;
  const f = $('#fin'); if(f) f.onclick = finish;
  const f2 = $('#fin2'); if(f2) f2.onclick = ()=>{ if(confirm(T.confirmFinish)) finish(); };
  function next(){ if(st.i<n-1){ st.i++; history.replaceState(st,''); render(); window.scrollTo(0,0);} else finish(); }
  function finish(){
    stopTimer();
    let correct = 0; const perG = {};
    st.qs.forEach((qq,i)=>{ const g = qq.gebied||0; perG[g] = perG[g]||{c:0,n:0}; perG[g].n++; if(st.ans[i]===qq.a){ correct++; perG[g].c++; } });
    const pct = Math.round(correct/n*100);
    const bestKey = st.mode==='chapter' ? st.id : (st.mode==='exam' ? 'ch15' : null);
    if(bestKey){ const b = bestOf(bestKey); if(b===null || pct>b) store.set('best.'+bestKey, pct); }
    go({view:'result', qs:st.qs, ans:st.ans, correct, pct, perG, mode:st.mode, id:st.id, label:st.label, feedback:st.feedback});
  }
}

function result(){
  const st = state, n = st.qs.length;
  title.textContent = T.result;
  let h = `<div class="card score"><div class="big ${zone(st.pct)}">${st.pct}%</div><div class="sub">${fmt(T.ofCorrect,{c:st.correct,n})} · ${st.pct>=80?T.msg80:st.pct>=70?T.msg70:T.msgLow}</div>`;
  if(st.mode==='exam'){
    h += `<table style="width:100%;font-size:.95em;border-collapse:collapse"><tr><th style="text-align:left">${T.colArea}</th><th>${T.colCorrect}</th><th>${T.colRepeat}</th></tr>`;
    for(const g of [1,2,3]){ const p = st.perG[g]; if(!p) continue; h += `<tr><td style="text-align:left">${g} · ${GEB_NAMES[g]}</td><td>${p.c}/${p.n}</td><td>${p.c/p.n<0.8?T.areaRanges[g]:'–'}</td></tr>`; }
    h += `</table>`;
  }
  h += `<div class="grid2" style="margin-top:14px"><button class="btn" id="again">${T.again}</button><button class="btn sec" id="wrongOnly">${T.wrongOnly}</button></div></div>`;
  h += `<div class="card"><h2>${T.overview}</h2>`;
  st.qs.forEach((q,i)=>{
    const g = st.ans[i], ok = g===q.a;
    h += `<div style="padding:10px 0;border-top:1px solid var(--line)"><div class="small muted">${fmt(T.questionOf,{i:i+1,n})} · ${ok?'<span style="color:var(--ok)">'+T.good+'</span>':(g===undefined?T.unanswered:'<span style="color:var(--bad)">'+T.wrong+' ('+g+')</span>')} · ${T.right}: ${q.a}</div><div>${q.q}</div><div class="small" style="margin-top:4px"><b>${q.a}.</b> ${q.opts[q.a]}</div><div class="small muted" style="margin-top:4px">${q.e}</div></div>`;
  });
  h += `</div>`;
  main.innerHTML = h;
  $('#again').onclick = ()=>go({view:'quiz', mode:st.mode, id:st.id, qs:shuffle([...st.qs]), i:0, ans:{}, label:st.label, feedback:st.feedback, timer:false, start:Date.now()});
  $('#wrongOnly').onclick = ()=>{
    const qs = st.qs.filter((q,i)=>st.ans[i]!==q.a);
    if(!qs.length){ alert(T.noWrong); return; }
    go({view:'quiz', mode:st.mode==='exam'?'mix':st.mode, id:st.id, qs, i:0, ans:{}, label:fmt(T.retake,{n:qs.length}), feedback:true});
  };
}

function zone(p){ return p>=80?'g':p>=60?'y':'r'; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

history.replaceState(state,'');
render();
})();
</script>
</body>
</html>
