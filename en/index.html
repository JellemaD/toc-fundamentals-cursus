<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TOC Fundamentals Course</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
:root{
  --bg:#f6f4ee; --card:#ffffff; --ink:#1d1d1b; --muted:#6b6b66; --line:#dcd9d0;
  --accent:#1b4d89; --accent-ink:#ffffff; --gold:#c99a2e;
  --ok:#2e7d4f; --ok-bg:#e3f3e8; --bad:#b3362b; --bad-bg:#fbe6e3;
  --code-bg:#efece4; --shadow:0 1px 3px rgba(0,0,0,.08);
  --zg:#2e7d4f; --zy:#b8860b; --zr:#b3362b; --zg-bg:#e3f3e8; --zy-bg:#fbf1d6; --zr-bg:#fbe6e3;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171a; --card:#1f2226; --ink:#e9e7e1; --muted:#a09d95; --line:#33373d;
    --accent:#6ea3e6; --accent-ink:#0f1a2a; --gold:#e0b04a;
    --ok:#6fcf97; --ok-bg:#1f3a2b; --bad:#f08c7d; --bad-bg:#3f221f;
    --code-bg:#262a30; --shadow:0 1px 3px rgba(0,0,0,.4);
    --zg:#6fcf97; --zy:#e0b04a; --zr:#f08c7d; --zg-bg:#1f3a2b; --zy-bg:#3a3120; --zr-bg:#3f221f;
  }
}
:root[data-theme="dark"]{
  --bg:#15171a; --card:#1f2226; --ink:#e9e7e1; --muted:#a09d95; --line:#33373d;
  --accent:#6ea3e6; --accent-ink:#0f1a2a; --gold:#e0b04a;
  --ok:#6fcf97; --ok-bg:#1f3a2b; --bad:#f08c7d; --bad-bg:#3f221f;
  --code-bg:#262a30; --shadow:0 1px 3px rgba(0,0,0,.4);
  --zg:#6fcf97; --zy:#e0b04a; --zr:#f08c7d; --zg-bg:#1f3a2b; --zy-bg:#3a3120; --zr-bg:#3f221f;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Serif 4",Georgia,"Times New Roman",serif;font-size:var(--fs,17px);line-height:1.5}
.sans,.btn,.opt b,.pill,.row .s,.card h2,.timer,.zone{font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--accent);color:var(--accent-ink);padding:env(safe-area-inset-top) 0 0;box-shadow:var(--shadow)}
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px;min-height:52px}
.bar h1{font-size:16px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.bar button{background:transparent;border:0;color:inherit;font-size:22px;padding:4px 8px;line-height:1;cursor:pointer;border-radius:8px}
.bar button:active{background:rgba(255,255,255,.2)}
.langs{display:flex;gap:5px}
.langbtn{color:inherit;text-decoration:none;font-size:13px;font-weight:600;border:1.5px solid rgba(255,255,255,.7);border-radius:6px;padding:3px 7px;letter-spacing:.04em}
main{max-width:760px;margin:0 auto;padding:14px 14px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 12px;box-shadow:var(--shadow)}
.card h2{margin:0 0 6px;font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;border:0}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer;-webkit-tap-highlight-color:transparent}
.row:first-of-type{border-top:0}
.row .n{flex:0 0 34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:16px;line-height:1.25}
.row .t small{color:var(--muted);font-size:13px}
.row .s{font-size:13px;color:var(--muted);white-space:nowrap}
.zone{display:inline-block;padding:3px 9px;border-radius:6px;font-size:13px;font-weight:600;white-space:nowrap}
.zone.g{background:var(--zg-bg);color:var(--zg)}.zone.y{background:var(--zy-bg);color:var(--zy)}.zone.r{background:var(--zr-bg);color:var(--zr)}
.score .big.g{color:var(--zg)}.score .big.y{color:var(--zy)}.score .big.r{color:var(--zr)}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 18px;font-size:16px;font-weight:600;cursor:pointer;text-align:center;-webkit-tap-highlight-color:transparent}
.btn.sec{background:transparent;color:var(--accent);border:2px solid var(--accent)}
a.btn{text-decoration:none}
.card.buy{border:2px solid var(--gold)}
.row.locked{opacity:.6}
.btn.block{display:block;width:100%;margin:8px 0}
.btn:disabled{opacity:.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 2px}
.prog i{display:block;height:100%;background:var(--gold)}
/* content */
.content h1{font-size:1.45em;line-height:1.25;margin:.2em 0 .6em}
.content h2{font-size:1.2em;margin:1.4em 0 .5em;padding-bottom:.2em;border-bottom:1px solid var(--line)}
.content h3{font-size:1.05em;margin:1.2em 0 .4em}
.content p{margin:0 0 .8em}
.content ul,.content ol{padding-left:1.3em;margin:0 0 .9em}
.content li{margin-bottom:.3em}
.content table{border-collapse:collapse;width:100%;font-size:.9em;margin:.6em 0 1em;display:block;overflow-x:auto}
.content th,.content td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
.content th{background:var(--code-bg)}
.content pre{background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;font-size:.78em;line-height:1.3}
.content code{font-family:Menlo,Consolas,monospace;font-size:.9em}
.content blockquote{margin:.6em 0;padding:.2em 0 .2em .9em;border-left:3px solid var(--gold);color:var(--muted)}
.content hr{border:0;border-top:1px solid var(--line);margin:1.4em 0}
.content img{max-width:100%}
.content p.diagram{text-align:center;margin:.9em 0 1.1em}
.content p.diagram img{width:100%;max-width:560px;height:auto;background:#fff;border:1px solid var(--line);border-radius:8px}
/* quiz */
.q{font-size:1.05em;margin:0 0 14px}
.q .nr{color:var(--muted);font-size:.85em;display:block;margin-bottom:4px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:11px 12px;margin:0 0 8px;font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.opt b{flex:0 0 22px;color:var(--accent)}
.opt.sel{border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default;opacity:1}
.expl{border-left:4px solid var(--gold);background:var(--card);padding:10px 12px;margin:10px 0;border-radius:0 10px 10px 0}
.expl.ok{border-color:var(--ok)}
.expl.bad{border-color:var(--bad)}
.expl .v{font-weight:700;display:block;margin-bottom:4px}
.score{text-align:center;padding:18px 0}
.score .big{font-size:52px;font-weight:700;line-height:1;color:var(--accent)}
.score .sub{color:var(--muted);margin:6px 0 14px}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;background:var(--code-bg);color:var(--muted);margin-right:6px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.toolbar .btn{padding:9px 13px;font-size:14px;flex:1}
.timer{font-variant-numeric:tabular-nums;font-family:Menlo,Consolas,monospace;font-size:14px;opacity:.9}
input.search{width:100%;padding:11px 12px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin:0 0 12px}
.hidden{display:none!important}
.bottomnav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 10px calc(6px + env(safe-area-inset-bottom));gap:8px;z-index:5}
.bottomnav .btn{flex:1;padding:10px;font-size:15px}
.chk{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:15px}
.muted{color:var(--muted)}
.small{font-size:.9em}
</style>
</head>

<script>
const DATA = [{"id": "ch00", "num": 0, "title": "The TOCFC Exam and How to Use This Course", "part": 0, "partShort": "Part 0", "partLong": "The Exam", "gebied": null, "html": "<h2 id=\"what-this-course-is-for\">What this course is for</h2>\n<p>This course prepares you for the <em>TOC Fundamentals Certification</em> (TOCFC) of TOCICO, the Theory of Constraints International Certification Organization. The exam tests whether you recognize and understand the basic concepts, beliefs and principles of the Theory of Constraints (TOC). You do not have to implement anything yet. You do have to know the terminology flawlessly, because almost every exam question turns on a definition or on the distinction between two concepts that resemble each other.</p>\n<p>This is the English edition of the course (a Dutch edition also exists). The exam itself is in English, so every technical term appears here exactly as it is used in the TOCICO Dictionary and on the exam. Learn the terms precisely. The practice exam in chapter 15 follows the wording of the real exam, so that you get used to the phrasing.</p>\n<h2 id=\"the-three-certification-levels\">The three certification levels</h2>\n<p>TOCICO has three levels. Each level builds on the previous one.</p>\n<table>\n<thead>\n<tr>\n<th>Level</th>\n<th>Name</th>\n<th>What you demonstrate</th>\n<th>Format</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>Fundamentals (TOCFC)</td>\n<td>Recognizing and understanding basic concepts and terminology</td>\n<td>Online multiple-choice</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Practitioner (TOCPC)</td>\n<td>Applying, analyzing and evaluating in a specific application area</td>\n<td>Exam per area, after Fundamentals</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Implementer (TOCIC)</td>\n<td>Extensive application in your own work</td>\n<td>Assessment</td>\n</tr>\n</tbody>\n</table>\n<p>At level 1, alongside the broad <em>TOC Fundamentals</em> exam, there are also separate Fundamentals exams per area: Critical Chain Project Management (CCPM), Thinking Processes (TP), Supply Chain Logistics (SCL), Production and Operations Management (POM) and Finance and Measures (FM). This course focuses on the broad TOC Fundamentals exam. That exam covers all areas at a basic level, and is the first step toward any Practitioner exam.</p>\n<h2 id=\"the-exam-in-numbers\">The exam in numbers</h2>\n<table>\n<thead>\n<tr>\n<th>Item</th>\n<th>Value</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Number of questions</td>\n<td>60, multiple-choice</td>\n</tr>\n<tr>\n<td>Time</td>\n<td>2.5 hours</td>\n</tr>\n<tr>\n<td>Language</td>\n<td>English (online). Chinese planned for 2027, on-site only</td>\n</tr>\n<tr>\n<td>Cost for members</td>\n<td>$99</td>\n</tr>\n<tr>\n<td>Cost for non-members</td>\n<td>$196, including 1 year of TOCICO membership</td>\n</tr>\n<tr>\n<td>Prior knowledge required</td>\n<td>None</td>\n</tr>\n<tr>\n<td>Supervision</td>\n<td>Online proctoring via MonitorEDU, with two cameras</td>\n</tr>\n<tr>\n<td>Result</td>\n<td>Digital certificate, title \"TOC Fundamentals Certified (TOCFC)\"</td>\n</tr>\n</tbody>\n</table>\n<p>TOCICO does not publish an official passing score on the exam page. Count on a minimum of 70 percent and aim for 80 percent on the practice exam before you book the real exam. You have an average of 2.5 minutes per question. That is ample. Read every question twice.</p>\n<h2 id=\"the-official-learning-objectives\">The official learning objectives</h2>\n<p>TOCICO divides the exam into three areas. The text below is the official wording from the exam page. Each area is one part of this course.</p>\n<h3 id=\"area-1-toc-fundamentals-concepts-part-1-chapters-1-to-5\">Area 1: TOC Fundamentals Concepts (Part 1, chapters 1 to 5)</h3>\n<p>\"Demonstrate recognition and understanding of the foundational TOC principles, core metrics, and key distinctions in TOC thinking.\"</p>\n<ul>\n<li>\"Understand and apply basic TOC beliefs, paradigms, and the Five Focusing Steps\"</li>\n<li>\"Distinguish between simple vs. complex systems\"</li>\n<li>\"Explain goals, necessary conditions, constraints, and global TOC metrics\"</li>\n<li>\"Differentiate 'cost world' vs. 'throughput world' thinking\"</li>\n</ul>\n<h3 id=\"area-2-toc-thinking-processes-part-2-chapters-6-to-9\">Area 2: TOC Thinking Processes (Part 2, chapters 6 to 9)</h3>\n<p>\"Demonstrate recognition and understanding of core TOC Thinking Processes concepts, tools, and basic logical relationships used to support structured problem-solving.\"</p>\n<ul>\n<li>\"Identify the Change Sequence and core TP tools\"</li>\n<li>\"Apply logical relationships, categories of legitimate reservations, and assumptions\"</li>\n<li>\"Create conflict clouds and logical branches for given scenarios\"</li>\n<li>\"Describe injections, entity relationships, and win-win conflict resolution\"</li>\n</ul>\n<h3 id=\"area-3-toc-applications-part-3-chapters-10-to-14\">Area 3: TOC Applications (Part 3, chapters 10 to 14)</h3>\n<p>\"Demonstrate recognition and understanding of TOC principles across supply chain, finance, and project management, including identifying bottlenecks, using buffers, and supporting effective communication and change management.\"</p>\n<ul>\n<li>\"Demonstrate TOC principles in: 1. Supply chain/logistics (Simplified-DBR) 2. Finance and measurements 3. Critical Chain Project Management (CCPM), single &amp; multi-project environments\"</li>\n<li>\"Identify bottlenecks, use buffers, and develop effective communication flows\"</li>\n<li>\"Understand and address resistance to change using TOC's layered approach\"</li>\n</ul>\n<h2 id=\"the-official-study-material\">The official study material</h2>\n<p>With a TOCICO membership you get access to:</p>\n<ul>\n<li>The <em>TOCICO Dictionary</em> (2nd edition, 2012). This is the most important source. The exam questions follow the definitions in this dictionary. This course is based on it.</li>\n<li>The videos <em>What is TOC</em> and <em>Basics of TOC</em>.</li>\n<li><em>A Guide to Implementing the Theory of Constraints</em>.</li>\n</ul>\n<p>Not included, but recommended by TOCICO:</p>\n<ul>\n<li><em>Theory of Constraints Handbook</em> (Cox and Schleier).</li>\n<li><em>The Goal</em> (book and film) by Eliyahu Goldratt. Read the book in any case. It is the fastest way to get a feel for the concepts bottleneck, dependent events and statistical fluctuations.</li>\n<li><em>TOC Self Learning Program</em> (Goldratt Satellite Program).</li>\n<li><em>Beyond the Goal</em> (Necessary and Sufficient series).</li>\n<li><em>Production the TOC Way with Simulator</em>.</li>\n<li><em>TOC Insights</em> for Operations, Finance and Measurements, Project Management and Distribution.</li>\n</ul>\n<h2 id=\"how-this-course-is-structured\">How this course is structured</h2>\n<p>Every chapter (1 to 14) has the same structure:</p>\n<ol>\n<li><strong>Learning Objectives.</strong> What you must be able to do after the chapter.</li>\n<li><strong>Explanation with examples.</strong> Technical terms in italics, each defined where it first appears.</li>\n<li><strong>Exam Traps.</strong> Concepts that get mixed up on the exam.</li>\n<li><strong>Summary.</strong> Point by point, for review.</li>\n<li><strong>Practice Questions.</strong> Ten multiple-choice questions in exam style.</li>\n<li><strong>Answers.</strong> With an explanation of why the correct answer is correct and the distractors are wrong.</li>\n</ol>\n<p>Part 4 contains the practice exam (60 questions), a glossary of key terms and a cheat sheet with formulas and lists.</p>\n<h2 id=\"four-week-study-plan\">Four-week study plan</h2>\n<p>Plan roughly 4 to 6 hours per week. Read first, then do the practice questions without looking back, and only then check your answers.</p>\n<table>\n<thead>\n<tr>\n<th>Week</th>\n<th>Chapters</th>\n<th>Extra</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>1 to 5 (Fundamentals Concepts)</td>\n<td>Read or reread The Goal</td>\n</tr>\n<tr>\n<td>2</td>\n<td>6 to 9 (Thinking Processes)</td>\n<td>Draw a cloud of a conflict of your own</td>\n</tr>\n<tr>\n<td>3</td>\n<td>10 to 14 (Applications)</td>\n<td>Watch the What is TOC and Basics of TOC videos</td>\n</tr>\n<tr>\n<td>4</td>\n<td>15 (practice exam), 16 and 17</td>\n<td>Review the chapters where you scored below 80 percent</td>\n</tr>\n</tbody>\n</table>\n<p>Take the practice exam in one sitting, with a clock running, without any aids. That way you simulate the real situation.</p>\n<h2 id=\"booking-the-exam-and-exam-day\">Booking the exam and exam day</h2>\n<p>The exam is administered online by MonitorEDU. TOCICO's \"Welcome and Student Directions\" contain the rules. The main points are listed below.</p>\n<h3 id=\"arrange-in-advance\">Arrange in advance</h3>\n<ul>\n<li>Book the exam via MonitorEDU's scheduling form (link in the Welcome letter). Rescheduling or questions: by e-mail to MonitorEDU.</li>\n<li>Read the FAQ and the proctoring policy on monitoredu.com.</li>\n<li>Watch the two instruction videos: \"Two Camera Proctoring\" and \"How to Set Up Your Room\".</li>\n<li>Install the Google Meet app on your phone.</li>\n<li>Test the webcam, microphone, phone camera and screen sharing on your computer.</li>\n</ul>\n<h3 id=\"what-you-need\">What you need</h3>\n<ul>\n<li><strong>Two devices.</strong> A computer or laptop with a working webcam to take the exam on. A smartphone with a working camera and Google Meet as the second camera.</li>\n<li>Both devices plugged into power and with a reliable internet connection.</li>\n<li>A valid photo ID, at hand at the start of the session.</li>\n</ul>\n<h3 id=\"the-room\">The room</h3>\n<ul>\n<li>Alone in the room. Nobody else present.</li>\n<li>Clean workspace. No papers, notes or other items.</li>\n<li>At a hard table or desk, on a chair. No couch or bed.</li>\n<li>Fully dressed. No cap, hood, headphones, watch or smart glasses.</li>\n<li>You do a 360-degree scan of the room: four walls, on the desk, above and below the desk.</li>\n<li>The phone is positioned so that you, your workspace and your computer screen are visible. Permitted materials lie between you and the phone.</li>\n</ul>\n<h3 id=\"on-exam-day-step-by-step\">On exam day, step by step</h3>\n<ol>\n<li>On the computer, click the link \"Connect with Proctor\" and then \"Connect to Proctor\".</li>\n<li>Confirm that you are in the right environment and that your phone can be positioned properly.</li>\n<li>Complete the \"Mobile Device Readiness Agreement\".</li>\n<li>Go through the \"Testing Device Readiness Check\": allow camera, allow microphone, share full screen.</li>\n<li>Confirm power and internet.</li>\n<li>Fill in the form and upload a photo of your ID and a selfie.</li>\n<li>Accept MonitorEDU's rules.</li>\n<li>Click \"Connect to Proctor\", check your details, click \"New Conversation\" and then \"Start Chat\".</li>\n<li>Stay active until the proctor enters the chat. The proctor's name appears at the top of the chat.</li>\n<li>If the chat does not work, click \"Trouble Connecting\" for a backup channel.</li>\n<li>Follow the proctor's instructions when starting the exam.</li>\n</ol>\n<h3 id=\"tips-for-the-questions-themselves\">Tips for the questions themselves</h3>\n<ul>\n<li>Read the question twice. Watch for words such as \"not\", \"except\", \"always\", \"never\", \"best\".</li>\n<li>First eliminate the answers that are certainly wrong.</li>\n<li>When in doubt between two answers: choose the answer that is closest to the literal definition in the TOCICO Dictionary.</li>\n<li>Calculation questions are simple (throughput, net profit, order quantity). Write out the formula before you calculate. Chapter 17 has all the formulas.</li>\n<li>A bottleneck and a capacity-constrained resource are not the same thing. Neither are a constraint and a bottleneck. This kind of distinction is the core of the exam.</li>\n</ul>", "q": []}, {"id": "ch01", "num": 1, "title": "What Is the Theory of Constraints?", "part": 1, "partShort": "Part 1", "partLong": "TOC Fundamentals Concepts", "gebied": 1, "html": "<h2 id=\"learning-objectives\">Learning Objectives</h2>\n<p>After this chapter you can:</p>\n<ul>\n<li>Explain what the <em>goal</em> of a system is and how <em>necessary conditions</em> relate to it.</li>\n<li>Apply the chain analogy: a system is as strong as its weakest link.</li>\n<li>Recognize the official TOCICO definition of <em>theory of constraints</em> (TOC) and distinguish it from <em>constraints management</em>.</li>\n<li>Name the four <em>fundamental assumptions</em> (pillars) of TOC and recognize them in exam questions.</li>\n<li>Correctly place concepts such as <em>holistic approach</em>, <em>leverage point</em>, <em>Archimedes lever point</em> and <em>focus</em>.</li>\n<li>Briefly state what a <em>process of ongoing improvement</em> (POOGI) is and what the three <em>stages of a science</em> are.</li>\n</ul>\n<h2 id=\"11-why-does-an-organization-exist-the-goal\">1.1 Why does an organization exist? The goal</h2>\n<p>Every organization is a system that someone founded with a purpose. TOC calls that purpose the <em>goal</em>: the purpose for which the system was created, as determined by the owners. The Dictionary wording is \"The purpose for which the system was created as determined by the owners.\"</p>\n<p>Note two things in that definition:</p>\n<ol>\n<li>The goal is determined by the <strong>owners</strong>, not by management or the employees.</li>\n<li>The goal is a <strong>purpose</strong>, not a yardstick. Measuring comes later.</li>\n</ol>\n<p>For most commercial companies the goal reads: \"make more money now and in the future\". This is the wording from Goldratt's novel <em>The Goal</em> (1984), in which plant manager Alex Rogo, with the help of his old physics teacher Jonah, discovers that his plant does not exist to be efficient, but to make money.</p>\n<p>The unit in which the goal is expressed is called a <em>goal unit</em>. For a for-profit company that is money. For a hospital it could be \"number of patients cured\", for an army \"number of objectives achieved\". The exam mainly tests the commercial case, but the term goal unit returns in the definition of throughput (chapter 4).</p>\n<h3 id=\"necessary-conditions\">Necessary conditions</h3>\n<p>Besides a goal, every system has <em>necessary conditions</em>: requirements that are not sufficient in themselves, but without which the goal cannot be achieved. The Dictionary calls it \"A requirement which by itself is not sufficient... to achieve the goal.\"</p>\n<p>The classic example:</p>\n<table>\n<thead>\n<tr>\n<th>Element</th>\n<th>Wording</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Goal</td>\n<td>Make more money now and in the future</td>\n</tr>\n<tr>\n<td>Necessary condition 1</td>\n<td>Satisfy customers now and in the future</td>\n</tr>\n<tr>\n<td>Necessary condition 2</td>\n<td>Provide a secure and satisfying environment for employees now and in the future</td>\n</tr>\n</tbody>\n</table>\n<p>The relationship matters for the exam. Customer satisfaction is <strong>not</strong> a goal, but a necessary condition. A company that drives customers away will eventually stop making money. A company that exhausts its employees, likewise. But a company that has nothing but satisfied customers and happy employees and makes no profit does not achieve its goal.</p>\n<p>An organization that performs exceptionally well on both the goal and the necessary conditions is called <em>ever-flourishing</em> in the Dictionary.</p>\n<p>A subtle point: the Dictionary contrasts necessary condition with <em>sufficient condition</em>. A sufficient condition can by itself produce the result, but is not required. The example in the Dictionary: the iPod was a sufficient condition for Apple's turnaround, but not a necessary one; Apple could also have recovered in another way.</p>\n<h2 id=\"12-the-system-as-a-chain\">1.2 The system as a chain</h2>\n<p>TOC looks at an organization as a <strong>chain</strong> of dependent links. Purchasing supplies production, production supplies sales, sales supplies the customer. Each part depends on the previous one.</p>\n<p>The key question about a chain is: what determines its strength? The answer: <strong>the weakest link</strong>. It does not matter how strong the other links are. Pull on the chain and it breaks at the weakest point.</p>\n<pre><code> [L1]--[L2]--[L3]--[l4]--[L5]--[L6]\n  10    12    15     4    11    13   &lt;- load capacity per link\n                     ^\n             weakest link = 4\n             chain strength = 4\n</code></pre>\n<p>The consequences of this analogy are the basis of all TOC logic:</p>\n<ul>\n<li><strong>Strengthening a link that is not the weakest</strong> does not change the strength of the chain. Taking L1 from 10 to 20 costs money and delivers nothing.</li>\n<li><strong>Strengthening the weakest link</strong> raises the chain strength directly. Taking L4 from 4 to 8 doubles the chain strength.</li>\n<li><strong>As soon as L4 becomes stronger than 10</strong>, L1 is the new weakest link. The focus shifts.</li>\n</ul>\n<p>Translated to an organization: the \"strength\" is the rate at which the system produces goal units. The weakest link is the <em>constraint</em>. Chapter 2 goes into that in depth.</p>\n<p>This also explains why TOC is so skeptical of the idea \"improve a little everywhere\". If you make ten links each 5 percent stronger, the chain may become 5 percent stronger. If you make one link (the right one) 50 percent stronger, the chain becomes 50 percent stronger.</p>\n<h3 id=\"chain-versus-sum\">Chain versus sum</h3>\n<p>The opposite model is the organization as a <strong>sum of independent parts</strong>. In that model the performance of the whole equals the sum of the performances of the parts. So: improve each part, and the whole improves. TOC calls this the <em>cost-world</em> way of thinking (chapter 4). The chain analogy says that this model fails as soon as the parts depend on each other.</p>\n<h2 id=\"13-goldratt-and-the-goal\">1.3 Goldratt and The Goal</h2>\n<p>Dr. Eliyahu M. Goldratt (1947-2011) was an Israeli physicist who applied his scientific way of thinking to organizations. He started in the 1970s with scheduling software (OPT), discovered that software alone changed nothing as long as managers kept thinking the same way, and therefore wrote the business novel <em>The Goal</em> in 1984.</p>\n<p>The core story of <em>The Goal</em>: the UNICO plant (Bearington) is threatened with closure. Alex Rogo discovers with Jonah that two machines limit the output: the NCX-10 and the heat treat furnace. By protecting those two and using them to the fullest, profit rises. Eventually the plant produces more than the market buys: the market becomes the new constraint.</p>\n<p>Two scenes from the book are almost certain to return in exam questions and are worked out in chapter 2:</p>\n<ul>\n<li>The <strong>boy scout hike</strong> with Herbie (the slowest boy sets the pace of the whole group).</li>\n<li>The <strong>match-bowl game</strong> with dice, which shows what variation does in a dependent chain.</li>\n</ul>\n<p>Goldratt's later books extend TOC: <em>It's Not Luck</em> (thinking processes), <em>Critical Chain</em> (project management), <em>Necessary But Not Sufficient</em> (IT), <em>The Choice</em> (the four pillars) and <em>Isn't It Obvious?</em> (distribution).</p>\n<h2 id=\"14-definition-of-theory-of-constraints\">1.4 Definition of theory of constraints</h2>\n<p>The TOCICO Dictionary defines <em>theory of constraints</em> (TOC) as a holistic management philosophy developed by Goldratt that is based on the principle that complex systems exhibit <em>inherent simplicity</em>. In the Dictionary's words: \"A holistic management philosophy... based on the principle that complex systems exhibit inherent simplicity.\"</p>\n<p>The definition continues: even a very complex system with thousands of people and machines has, at any moment, only a very small number of variables, perhaps only one, that truly limit how many goal units the system can generate. That variable is called the constraint.</p>\n<p>Remember three characteristics from the definition:</p>\n<ol>\n<li><strong>Holistic</strong>: it is about the whole, not about the parts separately.</li>\n<li><strong>Management philosophy</strong>: not a technique or tool, but a way of thinking.</li>\n<li><strong>Inherent simplicity</strong>: few variables determine the performance.</li>\n</ol>\n<h3 id=\"constraints-management\">Constraints management</h3>\n<p>The exam may ask about the difference with <em>constraints management</em>. That is a term coined by APICS for the logistics part of TOC: drum-buffer-rope, buffer management, VATI analysis, throughput, inventory, operating expense, throughput-dollar-days and inventory-dollar-days. The Dictionary describes it as \"A term coined by APICS... to describe the logistics paradigm.\"</p>\n<table>\n<thead>\n<tr>\n<th>Term</th>\n<th>Origin</th>\n<th>Scope</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Theory of constraints</td>\n<td>Goldratt</td>\n<td>Complete management philosophy, including thinking processes, finance, strategy</td>\n</tr>\n<tr>\n<td>Constraints management</td>\n<td>APICS</td>\n<td>Mainly the operational and logistics applications</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"where-does-the-name-come-from\">Where does the name come from?</h3>\n<p>Under <em>interactive constraints</em> the Dictionary records a historical detail: while studying project management, Goldratt saw that the <em>critical chain</em> is the constraint of a project. Shortly afterwards he renamed his body of knowledge \"Theory of Constraints\". So the word constraint is broader than a machine in a factory. It can be a resource, a critical chain, the market, and so on.</p>\n<h2 id=\"15-the-four-pillars-fundamental-assumptions-of-toc\">1.5 The four pillars: fundamental assumptions of TOC</h2>\n<p>The Dictionary calls them <em>fundamental assumptions (of TOC)</em>: basic beliefs that apply to all social systems. In <em>The Choice</em> Goldratt calls them the four pillars. The exam uses both names.</p>\n<table>\n<thead>\n<tr>\n<th>No.</th>\n<th>Pillar</th>\n<th>Explanation</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>People are good</td>\n<td>People are good, but we all carry \"bad\" assumptions that prevent us from seeing the potential in ourselves, others and organizations.</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Every conflict can be removed</td>\n<td>Every conflict can be resolved if we find and challenge the faulty assumption that causes the conflict. No compromise, but a win-win.</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Every situation is exceedingly simple</td>\n<td>Every situation, however complex it seems, is exceedingly simple once we find the few leverage points (inherent simplicity).</td>\n</tr>\n<tr>\n<td>4</td>\n<td>Every situation can be substantially improved</td>\n<td>Every situation can be substantially improved if we think clearly. This is often summarized as \"never say I know\".</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"origin-two-assumptions-from-the-hard-sciences\">Origin: two assumptions from the hard sciences</h3>\n<p>The Dictionary explains that the four pillars are an extension of two basic beliefs of the natural sciences, summarized in Newton's statement \"Natura valde simplex est et sibi consona\": nature is exceedingly simple and in harmony with itself.</p>\n<ul>\n<li><strong>Inherent simplicity</strong>: the universe and all complex systems are governed by inherent simplicity.</li>\n<li><strong>Inherent harmony</strong>: within such systems there are no contradictions in the rules that govern them. Translated to organizations: every conflict can be resolved.</li>\n</ul>\n<p>Goldratt added two assumptions because organizations are social systems with people: \"people are good\" and \"every situation can be substantially improved\".</p>\n<h3 id=\"how-the-pillars-fit-together\">How the pillars fit together</h3>\n<pre><code> Hard science (Newton)               Social systems (Goldratt)\n ------------------------            ---------------------------\n Inherent simplicity        ---&gt;     3. Every situation is exceedingly simple\n Inherent harmony           ---&gt;     2. Every conflict can be removed\n                                     1. People are good\n                                     4. Every situation can be substantially improved\n                                        (&quot;never say I know&quot;)\n</code></pre>\n<h3 id=\"never-say-i-know\">Never say I know</h3>\n<p>In practice the fourth pillar is most often quoted as \"never say I know\". The reasoning: as soon as you think you fully understand a situation, you stop looking for improvement. Whoever believes that every situation can be substantially improved keeps asking questions. The editors of the Dictionary themselves write in the preface that they have learned to accept Goldratt's fourth pillar: the more you define, the more you discover what you do not know.</p>\n<h3 id=\"win-win\">Win-win</h3>\n<p>Pillar 2 comes with the concept of win-win. TOC holds that a real conflict does not exist in reality; a conflict is always the result of at least one faulty assumption. Find that assumption, and the conflict disappears without either party losing. The instrument for this is the <em>evaporating cloud</em>, a logical diagram that describes a conflict precisely. It is covered in part 2 of this course. For now the core is: TOC does not look for a compromise, because a compromise means that both parties give something up.</p>\n<h2 id=\"16-holistic-approach\">1.6 Holistic approach</h2>\n<p>TOC calls itself a holistic philosophy. The Dictionary defines <em>holistic approach</em> as the belief that a change in one place in a system has ramifications in other parts of the system. Therefore, to find the right place for change, you must rigorously examine the whole network of cause and effect among the system's undesirable effects.</p>\n<p>In practice this means:</p>\n<ul>\n<li>You judge a decision not by its effect on one department, but by its effect on the whole.</li>\n<li>You use <em>holistic measures</em> (measures of the whole organization) such as throughput, investment and operating expense, and not only local efficiency.</li>\n<li>You look for the place where change yields the most for the whole: the leverage point.</li>\n</ul>\n<h2 id=\"17-leverage-point-and-archimedes-lever-point\">1.7 Leverage point and Archimedes lever point</h2>\n<p>A <em>leverage point</em> is a point, physical or logical, where a specific action would provide significant improvement of the whole system. The Dictionary wording is \"A point... where a specific action would provide significant system improvement.\"</p>\n<p>The Dictionary gives two examples:</p>\n<ul>\n<li>In a physical flow of goal units, the <strong>constraint</strong> is the leverage point.</li>\n<li>In a cause-and-effect analysis, the <strong>core problem</strong> is the leverage point.</li>\n</ul>\n<p>The related concept <em>Archimedes lever point</em> refers to the statement of Archimedes: give me a place to stand and a lever long enough, and I will move the earth. TOC applies this to systems with many components: a change to only one or a few components causes a large change in the performance of the whole. The TOC improvement processes revolve around finding and managing those points.</p>\n<p>A misconception the exam may test: a leverage point is not necessarily the most expensive or largest component. It is the component where the <strong>leverage</strong> is greatest. In the chain analogy that is the weakest link, even if it is small and cheap.</p>\n<h2 id=\"18-focus\">1.8 Focus</h2>\n<p><em>Focus</em> is a technical term in TOC: identifying one or a few elements or leverage points that have a significant positive impact on achieving the goal. The Dictionary describes it as \"Identifying one (or a few) elements or leverage points that have significant positive impact.\"</p>\n<p>The Dictionary adds an important second part: focus includes <strong>both doing what should be done and not doing what should not be done</strong>. This is subtle. Many managers think focus means \"working hard on the most important thing\". TOC adds: and stopping the rest. Concretely, focus translates into strongly reducing or eliminating <em>multitasking</em> (stopping a task before it is finished in order to start another).</p>\n<p>Without focus an organization spreads its attention across all links. With focus it concentrates on the weakest. That is why the five steps of TOC are also called the <em>five focusing steps</em>.</p>\n<h2 id=\"19-process-of-ongoing-improvement-poogi\">1.9 Process of ongoing improvement (POOGI)</h2>\n<p>The aim is not to strengthen the weakest link once, but to keep doing so. TOC calls this a <em>process of ongoing improvement</em> (POOGI): the methods used to achieve continuous improvement with respect to one's goal.</p>\n<p>The Dictionary distinguishes <strong>three</strong> POOGIs within TOC:</p>\n<ol>\n<li>The <strong>five focusing steps</strong> (chapter 3).</li>\n<li>The <strong>change question sequence</strong> (the questions \"what to change?\", \"to what to change?\" and \"how to cause the change?\"; part 2).</li>\n<li><strong>Buffer management</strong> (part 3).</li>\n</ol>\n<p>An exam question may ask which of these three is a POOGI. The answer: all three. A distractor such as \"throughput accounting\" or \"evaporating cloud\" is not a POOGI in itself.</p>\n<h2 id=\"110-toc-as-a-science-stages-of-a-science\">1.10 TOC as a science: stages of a science</h2>\n<p>Goldratt saw himself as a scientist who applied the method of physics to organizations. The Dictionary defines <em>science</em> as the search for a minimum number of assumptions that, through logical deduction, explain a maximum number of phenomena. Assumptions can never be proven; they are valid until one phenomenon refutes them. Science is not about truth, but about validity. That is why everything is open to testing. This fits seamlessly with \"never say I know\".</p>\n<p>The Dictionary also describes the <em>stages of a science</em>. Knowledge about a subject develops in three stages:</p>\n<table>\n<thead>\n<tr>\n<th>Stage</th>\n<th>Question</th>\n<th>Result</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Classification</td>\n<td>What is this?</td>\n<td>A classification and definitions</td>\n</tr>\n<tr>\n<td>Correlation</td>\n<td>How does this relate to other things?</td>\n<td>A statement about the relationship</td>\n</tr>\n<tr>\n<td>Effect-cause-effect</td>\n<td>Why does this happen?</td>\n<td>A logical explanation of the relationship</td>\n</tr>\n</tbody>\n</table>\n<p>The Dictionary's example for the logistics function: MRP (material requirements planning) is the classification stage, just-in-time is the correlation stage and TOC is the effect-cause-effect stage. The exam may ask this pairing literally.</p>\n<h2 id=\"111-mini-case-the-print-shop\">1.11 Mini-case: the print shop</h2>\n<p>A print shop has four departments: prepress, printing, finishing and shipping. Management complains that profit is falling and asks every department to become 10 percent more efficient.</p>\n<ul>\n<li>Prepress buys faster software. They now deliver faster to printing.</li>\n<li>Printing is the weakest link: the press already runs 24 hours a day. They cannot go faster.</li>\n<li>Finishing and shipping already often sit without work, because printing does not deliver faster.</li>\n</ul>\n<p>Result: prepress has spent money, more work-in-process is piling up in front of the press, and the output of the print shop has not risen. The goal (\"more money\") has not come any closer.</p>\n<p>The TOC view: the press is the leverage point. Only actions on or around the press raise the output. All other departments must subordinate themselves to the press. That is holistic thinking with focus.</p>\n<h2 id=\"exam-traps\">Exam Traps</h2>\n<ul>\n<li><strong>Goal versus necessary condition.</strong> \"Satisfy customers\" is a necessary condition, not a goal. The goal of a commercial company is \"make more money now and in the future\". When in doubt, choose the wording the owners would choose.</li>\n<li><strong>Necessary versus sufficient.</strong> In the Dictionary, a necessary condition is needed but by itself not enough. A sufficient condition is enough by itself. Do not swap them.</li>\n<li><strong>Theory of constraints versus constraints management.</strong> Constraints management is the APICS term for the logistics part. TOC is the complete philosophy.</li>\n<li><strong>Mixing up the four pillars.</strong> \"Never say I know\" is the popular summary of pillar 4 (\"every situation can be substantially improved\"). Pillar 3 is inherent simplicity. Pillar 2 is \"every conflict can be removed\". Pillar 1 is \"people are good\".</li>\n<li><strong>Win-win versus compromise.</strong> TOC does not seek a compromise. In a compromise both parties give something up. In a win-win a faulty assumption is removed so that both parties get what they need.</li>\n<li><strong>A leverage point is not always expensive or large.</strong> It is about leverage, not size.</li>\n<li><strong>Three POOGIs.</strong> Five focusing steps, change question sequence and buffer management. Throughput accounting is not a POOGI.</li>\n<li><strong>Stages of a science.</strong> Classification, correlation, effect-cause-effect. TOC belongs to the third stage; MRP to the first; JIT to the second.</li>\n</ul>\n<h2 id=\"summary\">Summary</h2>\n<ul>\n<li>The goal is the purpose for which the system was created, determined by the owners. For companies: make more money now and in the future.</li>\n<li>Necessary conditions (satisfied customers, secure and satisfied employees) are required but not sufficient to achieve the goal.</li>\n<li>An organization is a chain of dependent links. The chain strength is determined by the weakest link: the constraint.</li>\n<li>Improvements to links that are not the weakest do not raise the chain strength.</li>\n<li>TOC is a holistic management philosophy developed by Goldratt, based on inherent simplicity: few variables determine performance.</li>\n<li>Constraints management is the APICS name for the logistics applications of TOC.</li>\n<li>The four fundamental assumptions (pillars): people are good; every conflict can be removed; every situation is exceedingly simple; every situation can be substantially improved (never say I know).</li>\n<li>The pillars build on two assumptions of the hard sciences: inherent simplicity and inherent harmony.</li>\n<li>A leverage point is the place where a small action produces a large system improvement (Archimedes lever point). In a physical flow that is the constraint; in a cause-and-effect analysis the core problem.</li>\n<li>Focus means doing what should be done and not doing what should not be done, resulting in less multitasking.</li>\n<li>POOGI is a process of ongoing improvement. TOC has three: five focusing steps, change question sequence, buffer management.</li>\n<li>Science seeks validity, not truth. The stages of a science are classification, correlation and effect-cause-effect; TOC belongs to the last.</li>\n</ul>", "q": [{"n": 1, "q": "According to the TOCICO Dictionary, what is the <em>goal</em> of a system?", "opts": {"A": "The yardstick by which management judges performance", "B": "The purpose for which the system was created, as determined by the owners", "C": "The sum of all necessary conditions", "D": "The level of throughput the market allows"}, "gebied": 1, "a": "B", "e": "The goal is the purpose for which the system was created, determined by the owners. A confuses goal with measurement. C confuses goal with necessary conditions. D describes a market constraint, not a goal."}, {"n": 2, "q": "Which statement about <em>necessary conditions</em> is correct?", "opts": {"A": "A necessary condition is by itself sufficient to achieve the goal", "B": "A necessary condition can at the same time be a sufficient condition", "C": "A necessary condition is required, but by itself not sufficient", "D": "Necessary conditions apply only to non-profit organizations"}, "gebied": 1, "a": "C", "e": "A necessary condition is required but by itself not sufficient. A describes a sufficient condition. B does not fit the Dictionary, where a necessary condition is by itself not sufficient. D is incorrect; commercial companies also have necessary conditions."}, {"n": 3, "q": "A company improves the efficiency of all departments by 10 percent, except that of the constraint. What does the chain analogy say about the result?", "opts": {"A": "Output rises by about 10 percent", "B": "Output rises in proportion to the number of departments improved", "C": "Output does not change materially", "D": "Output falls because the constraint becomes overloaded"}, "gebied": 1, "a": "C", "e": "The chain strength is determined by the weakest link. Improvements elsewhere do not materially change the output. A and B follow the additive thinking of the cost world. D is not what the analogy says; at most, extra inventory builds up in front of the constraint."}, {"n": 4, "q": "Which of the following is NOT one of the four fundamental assumptions (pillars) of TOC?", "opts": {"A": "People are good", "B": "Every conflict can be removed", "C": "Every resource must be fully utilized", "D": "Every situation can be substantially improved"}, "gebied": 1, "a": "C", "e": "Full utilization of every resource is precisely something TOC rejects (chapter 2). A, B and D are three of the four pillars; the fourth is \"every situation is exceedingly simple\"."}, {"n": 5, "q": "The term <em>constraints management</em> was coined by:", "opts": {"A": "Goldratt, as a synonym for TOC", "B": "APICS, for the logistics part of TOC", "C": "TOCICO, for the certification program", "D": "Deming, as part of TQM"}, "gebied": 1, "a": "B", "e": "Constraints management is an APICS term for the logistics paradigm (DBR, buffer management, VATI, T, I, OE, TDD, IDD). A, C and D are incorrect."}, {"n": 6, "q": "What does \"never say I know\" mean in TOC?", "opts": {"A": "Managers should not share their knowledge with employees", "B": "Every situation can be substantially improved, so keep asking questions", "C": "Only external consultants may identify constraints", "D": "Knowledge about the system is unreliable and therefore unusable"}, "gebied": 1, "a": "B", "e": "\"Never say I know\" is the summary of the fourth pillar: every situation can be substantially improved, so keep searching. A, C and D distort the meaning."}, {"n": 7, "q": "Which three methods does the Dictionary name as <em>processes of ongoing improvement</em> (POOGI)?", "opts": {"A": "Five focusing steps, throughput accounting, drum-buffer-rope", "B": "Five focusing steps, change question sequence, buffer management", "C": "Evaporating cloud, current reality tree, future reality tree", "D": "Identify, exploit, subordinate"}, "gebied": 1, "a": "B", "e": "The Dictionary names exactly these three POOGIs. A contains throughput accounting and DBR, which are not POOGIs. C are thinking-process tools. D are three of the five steps, not three POOGIs."}, {"n": 8, "q": "In the <em>stages of a science</em>, TOC belongs to the stage:", "opts": {"A": "Classification", "B": "Correlation", "C": "Effect-cause-effect", "D": "Verification"}, "gebied": 1, "a": "C", "e": "TOC is the effect-cause-effect stage; MRP is classification, JIT is correlation. D is not a stage from the Dictionary."}, {"n": 9, "q": "What is a <em>leverage point</em>?", "opts": {"A": "The most expensive component of a system", "B": "A point where a specific action provides significant improvement of the whole system", "C": "The component with the highest local efficiency", "D": "Financial leverage through borrowed capital"}, "gebied": 1, "a": "B", "e": "This is the definition. A and C are misconceptions; the leverage point is the place with the greatest leverage, not the greatest size or highest efficiency. D is a financial term that is not meant here."}, {"n": 10, "q": "The <em>holistic approach</em> of TOC means that:", "opts": {"A": "Every department independently optimizes its own performance", "B": "A change in one place has ramifications elsewhere, so the whole cause-and-effect network must be examined", "C": "All employees work on improvement at the same time", "D": "Costs per department are added up into an overall picture"}, "gebied": 1, "a": "B", "e": "Holistic approach: a change in one place carries through to other parts; therefore the whole cause-and-effect network must be examined. A and D describe cost-world thinking. C is not a definition of holism."}]}, {"id": "ch02", "num": 2, "title": "Constraints and the System", "part": 1, "partShort": "Part 1", "partLong": "TOC Fundamentals Concepts", "gebied": 1, "html": "<h2 id=\"learning-objectives\">Learning Objectives</h2>\n<p>After this chapter you can:</p>\n<ul>\n<li>Recognize the TOCICO definition of <em>constraint</em> and explain why a constraint is the leverage point of a system.</li>\n<li>Distinguish the types of constraints: physical/capacity, market, material, policy, management, measures, dummy, strategic and interactive constraints, and know which of these the Dictionary calls a \"misnomer\".</li>\n<li>Explain the difference between <em>bottleneck resource</em>, <em>capacity-constrained resource</em> (CCR) and <em>non-bottleneck</em> or <em>non-constraint</em>.</li>\n<li>Explain what <em>dependent events</em> and <em>statistical fluctuations</em> together do to a system (Herbie, the match-bowl game).</li>\n<li>Explain why a <em>balanced plant</em> is a bad idea and what role <em>protective capacity</em> plays.</li>\n<li>Place the capacity concepts productive, protective, excess and idle capacity and apply the difference between <em>activation</em> and <em>utilization</em>.</li>\n</ul>\n<h2 id=\"21-what-is-a-constraint\">2.1 What is a constraint?</h2>\n<p>The Dictionary defines a <em>constraint</em> as the factor that ultimately limits the performance of a system or organization. It is the factor that, if the organization could increase it, better exploit it or better subordinate to it, would yield more of the goal.</p>\n<p>Three verbs in that definition already point to the five focusing steps (chapter 3): <em>exploit</em>, <em>subordinate</em> and <em>elevate</em>.</p>\n<p>The Dictionary adds a perspective that summarizes the core of TOC: the existence of constraints, and the fact that you improve performance by identifying them and carefully managing or eliminating them, is the foundation of TOC.</p>\n<p>The example from <em>The Goal</em>: UNICO could not produce fast enough to meet demand. Two resources limited the output: the NCX-10 and the heat treat furnace. When UNICO exploited both, subordinated everything to them and eventually elevated them, profit rose. Later the plant could make more than customers bought. The constraint shifted to the lack of orders: the market became the constraint.</p>\n<h3 id=\"every-system-has-at-least-one\">Every system has at least one</h3>\n<p>A system without a constraint would have infinite output. So every system has at least one constraint, but never many at once: the definition of TOC (chapter 1) speaks of \"a very, very small number of variables, perhaps only one\".</p>\n<h2 id=\"22-types-of-constraints\">2.2 Types of constraints</h2>\n<p>Pay close attention: the Dictionary explicitly calls a number of popular names a <strong>misnomer</strong> (an incorrect name). That is a favorite exam topic.</p>\n<h3 id=\"physical-or-capacity-constraint-internal-resource\">Physical or capacity constraint (internal resource)</h3>\n<p>A physical constraint is a resource (machine, person, department) whose capacity is smaller than market demand, as in <em>The Goal</em>. The Dictionary uses the terms <em>bottleneck resource</em> and <em>capacity-constrained resource</em> for this (see 2.3).</p>\n<h3 id=\"market-constraint\">Market constraint</h3>\n<p>A <em>market constraint</em> is the situation in which market demand is less than the organization's capacity to deliver. Insufficient customer demand is then the constraint.</p>\n<p>This is a real constraint, not a misnomer. Many companies are in this situation. The five focusing steps still work: exploit the market (for example with an unrefusable offer), subordinate production to it (always deliver on time), elevate (open up new markets).</p>\n<h3 id=\"material-constraint\">Material constraint</h3>\n<p>A <em>material constraint</em> is, according to the Dictionary, usually a misnomer. Material shortages are seldom the constraint. They are usually temporary, or the material is available elsewhere or at a higher price. A material shortage mainly <strong>hinders</strong> the exploitation of and subordination to the real constraint. The exception the Dictionary mentions: the worldwide steel shortages in the early 21st century. For a while, steel really was the constraint.</p>\n<h3 id=\"policy-constraint\">Policy constraint</h3>\n<p>A <em>policy constraint</em> is, according to the Dictionary, a common misnomer. Bad policy is not the constraint; it hinders the effective management of the constraint. Example: a policy of producing in \"economic order quantities\" leads to batches that are too large, more work-in-process and periodic starvation of the constraint. The policy is not the constraint, but it blocks its exploitation. The Dictionary notes that policies used to be described as a type of constraint. Older books still do so.</p>\n<h3 id=\"management-constraint\">Management constraint</h3>\n<p>The Dictionary gives two meanings of <em>management constraint</em>:</p>\n<ol>\n<li>A misnomer: poor management is not the constraint, but hinders exploitation and subordination (for example punishing engineers for late tasks, which leads them to build more safety into their estimates).</li>\n<li>The available time of top management, which under traditional management is a constraint because managers pay attention to everything instead of to the leverage points.</li>\n</ol>\n<h3 id=\"measures-constraint\">Measures constraint</h3>\n<p>A <em>measures constraint</em> is likewise a misnomer. Poor measurements are not the constraint; they hinder. Example from the Dictionary: measuring efficiency on all resources drives overproduction at non-bottlenecks and starves the bottleneck. The efficiency measurement is not what you must exploit, but what blocks the exploitation.</p>\n<h3 id=\"dummy-constraint\">Dummy constraint</h3>\n<p>A <em>dummy constraint</em> is a constraint that is inexpensive relative to the other resources in the system. The Dictionary is firm: dummy constraints must always be eliminated. If a machine costing 5,000 euros limits the output of a factory worth 50 million, you simply buy a second one.</p>\n<h3 id=\"strategic-constraint\">Strategic constraint</h3>\n<p>A <em>strategic constraint</em> is the place where top management deliberately wants to have and keep the constraint, with a view to the long-term ability to achieve the goal. The Dictionary explains that the five focusing steps are not intended as an endless loop in which you keep eliminating the next constraint. Management chooses where the constraint should be. Usually a resource is chosen that is scarce, thus expensive or difficult to elevate. The organization then grows until that resource becomes the constraint.</p>\n<h3 id=\"interactive-constraints\">Interactive constraints</h3>\n<p><em>Interactive constraints</em> are two or more factors (for example heavily loaded resources or critical chains) that interact in such a way that the throughput of the system becomes unpredictable or chaotic. The Dictionary calls this a broader term than <em>wandering bottleneck</em>: constraints also include critical chains and markets, while bottlenecks are only about scarce resources in production.</p>\n<h3 id=\"overview\">Overview</h3>\n<table>\n<thead>\n<tr>\n<th>Type</th>\n<th>Real constraint or misnomer?</th>\n<th>Key point</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Physical / capacity</td>\n<td>Real</td>\n<td>Internal resource with too little capacity</td>\n</tr>\n<tr>\n<td>Market</td>\n<td>Real</td>\n<td>Demand less than capacity</td>\n</tr>\n<tr>\n<td>Material</td>\n<td>Usually misnomer</td>\n<td>Hinders exploit/subordinate; seldom real (steel)</td>\n</tr>\n<tr>\n<td>Policy</td>\n<td>Misnomer</td>\n<td>Bad policy hinders</td>\n</tr>\n<tr>\n<td>Management</td>\n<td>Misnomer (meaning 1) / real (meaning 2: management time)</td>\n<td>Hinders, or time of top management</td>\n</tr>\n<tr>\n<td>Measures</td>\n<td>Misnomer</td>\n<td>Bad measurements hinder</td>\n</tr>\n<tr>\n<td>Dummy</td>\n<td>Real but too cheap</td>\n<td>Always eliminate</td>\n</tr>\n<tr>\n<td>Strategic</td>\n<td>Deliberately chosen</td>\n<td>Where management wants to keep the constraint</td>\n</tr>\n<tr>\n<td>Interactive</td>\n<td>Real, undesirable</td>\n<td>Several factors make output chaotic</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"23-bottleneck-ccr-and-non-constraint\">2.3 Bottleneck, CCR and non-constraint</h2>\n<p>This is the most tested distinction in this chapter. The Dictionary itself warns that <em>bottleneck resource</em> is often confused with capacity-constrained resource, drum resource and constraint.</p>\n<h3 id=\"bottleneck-resource\">Bottleneck resource</h3>\n<p>A <em>bottleneck resource</em> is any resource whose capacity is less than or equal to the demand placed on it, within a given time horizon.</p>\n<p>The Dictionary adds that policies (batching rules, efficiency targets, end-of-month syndrome) often wrongly make resources appear to be bottlenecks. After steps 2 and 3 of the five focusing steps they turn out to have ample capacity and the market becomes the constraint.</p>\n<h3 id=\"capacity-constrained-resource-ccr\">Capacity-constrained resource (CCR)</h3>\n<p>A <em>capacity-constrained resource</em> (CCR) is any resource that, if its capacity is not carefully managed, is likely to compromise the throughput of the organization.</p>\n<p>The difference with a bottleneck: a CCR <strong>does</strong> have enough capacity on average, but with so little margin that variation can push output below demand. Example from the Dictionary: of five resources A to E, D has so much variation that throughput falls if D is not managed well. D is a CCR.</p>\n<h3 id=\"non-bottleneck-resource-and-non-constraint\">Non-bottleneck resource and non-constraint</h3>\n<p>A <em>non-bottleneck resource</em> has more capacity than demand. A <em>non-constraint</em> has more capacity (often idle) than the constraint and should not aim for full utilization, but subordinate itself to the constraint.</p>\n<h3 id=\"comparison-table\">Comparison table</h3>\n<table>\n<thead>\n<tr>\n<th>Term</th>\n<th>Capacity versus demand</th>\n<th>Manage?</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Bottleneck resource</td>\n<td>Capacity &lt;= demand</td>\n<td>Yes, always; every lost hour is a system loss</td>\n</tr>\n<tr>\n<td>CCR</td>\n<td>Capacity just &gt; demand, but vulnerable to variation</td>\n<td>Yes, schedule carefully</td>\n</tr>\n<tr>\n<td>Non-bottleneck / non-constraint</td>\n<td>Capacity &gt; demand</td>\n<td>Subordinate; do not maximize utilization</td>\n</tr>\n<tr>\n<td>Constraint</td>\n<td>What limits system performance (can be resource, market, etc.)</td>\n<td>Focus of the five focusing steps</td>\n</tr>\n</tbody>\n</table>\n<p>Important: a constraint is not always a bottleneck (the market can be the constraint). And a system can have a CCR without a bottleneck: the CCR is then the <em>drum</em> (the resource on which the schedule is based) while the market is the constraint.</p>\n<h3 id=\"wandering-temporary-and-permanent-bottleneck\">Wandering, temporary and permanent bottleneck</h3>\n<ul>\n<li><em>Wandering bottleneck</em> (syn. floating bottleneck): an undesirable effect in which the bottleneck jumps relatively often from one resource to another. This is often the result of poor policy (large batches, efficiency targets) and makes the system unmanageable.</li>\n<li><em>Temporary bottleneck</em>: demand on a resource briefly exceeds its capacity.</li>\n<li><em>Permanent bottleneck</em>: functions that remain internal bottlenecks no matter how many resources you assign to them. The Dictionary gives as examples in services the IT function and the sales and marketing function.</li>\n</ul>\n<h2 id=\"24-dependent-events-and-statistical-fluctuations\">2.4 Dependent events and statistical fluctuations</h2>\n<p>Why is a chain different from a sum? Because of two phenomena that occur together in every system in which one part feeds the next.</p>\n<p><em>Dependent events</em> are a series of events in which each event can only be completed after certain preceding events have taken place. Example from the Dictionary: in a restaurant the customer pays only after eating, eats only after being served, is served only after ordering, and orders only after being seated.</p>\n<p><em>Statistical fluctuations</em> is the TOC term for random variation. An operation takes 4 minutes one time and 7 minutes the next. TOC also uses the nickname <em>Murphy</em> (after Murphy's Law: whatever can go wrong, will go wrong) for unplanned variation such as machine breakdowns, quality problems and late deliveries. Buffers serve to protect against Murphy.</p>\n<p>The Dictionary states: the joint occurrence of these two factors is precisely what makes the elements of drum-buffer-rope (production) and critical chain (projects) necessary.</p>\n<h3 id=\"herbie-the-boy-scout-hike\">Herbie: the boy scout hike</h3>\n<p>In <em>The Goal</em> Alex leads a group of boy scouts along a narrow trail (dependent events). Each boy walks at a varying speed (statistical fluctuations). Herbie is the slowest.</p>\n<ul>\n<li>The boys in front of Herbie walk away; the gap grows (inventory piles up in front of the constraint).</li>\n<li>The boys behind Herbie cannot go faster than Herbie and regularly stand still.</li>\n<li>The throughput of the group is Herbie's speed.</li>\n</ul>\n<p>The solution in the book: put Herbie at the front (everyone subordinates), empty his backpack (exploit) and distribute the contents among the others (offload to non-constraints). The group then walks faster than ever.</p>\n<h3 id=\"the-match-bowl-game\">The match-bowl game</h3>\n<p>Also in <em>The Goal</em>: five boys, five bowls in a row, a die, matches. Each round every boy moves as many matches as he rolls to the next bowl, <strong>but never more than there are in his bowl</strong>. On average everyone rolls 3.5, so you expect 3.5 matches per round out of the system. That does not happen: the output is structurally lower and the inventory between the bowls grows. Why?</p>\n<table>\n<thead>\n<tr>\n<th>Round</th>\n<th>Boy 1 rolls</th>\n<th>Boy 2 rolls</th>\n<th>Actually passed on</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>1</td>\n<td>6</td>\n<td>1 (B2's bowl was empty and he received only 1 match; his high roll is lost)</td>\n</tr>\n<tr>\n<td>2</td>\n<td>6</td>\n<td>2</td>\n<td>2 (B2 cannot pass on more than he rolls; 4 matches stay in his bowl)</td>\n</tr>\n</tbody>\n</table>\n<p>A high roll does not help if the previous boy passed on little. A low roll is never made up; it propagates. Variation in a chain of dependent events <strong>accumulates</strong> in the unfavorable direction. This is the reason a chain does not behave like a sum, and why capacities must not be matched to demand.</p>\n<h2 id=\"25-the-balanced-plant-and-why-it-fails\">2.5 The balanced plant and why it fails</h2>\n<p>A <em>balanced plant</em> is a plant in which the capacity of all resources is equal to a given level of output.</p>\n<p>The Dictionary compares three philosophies:</p>\n<table>\n<thead>\n<tr>\n<th>Philosophy</th>\n<th>Ideal</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Traditional</td>\n<td>Balanced plant: every capacity equal to demand (cost minimization)</td>\n</tr>\n<tr>\n<td>Lean</td>\n<td>Balanced plant: capacity equal to daily demand</td>\n</tr>\n<tr>\n<td>TOC</td>\n<td>Balance the <strong>flow</strong>, not the capacity</td>\n</tr>\n</tbody>\n</table>\n<p>Why does the balanced plant fail? Because of dependent events plus statistical fluctuations. If every resource can do exactly 100 units per day and demand is 100, then with every breakdown you lose output that you never make up, because nobody has reserve. TOC's alternative: one resource (the constraint or the drum) sets the pace. All other resources deliberately have <strong>more</strong> capacity, so that they can catch up after disruptions and never let the constraint starve. That is called balancing the flow.</p>\n<h2 id=\"26-types-of-capacity\">2.6 Types of capacity</h2>\n<p>To be able to talk about \"more capacity than needed\", TOC splits the capacity of a non-constraint into parts.</p>\n<table>\n<thead>\n<tr>\n<th>Term</th>\n<th>Meaning</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><em>Productive capacity</em></td>\n<td>Capacity needed to produce enough to cover the demand of the constraint</td>\n</tr>\n<tr>\n<td><em>Idle capacity</em></td>\n<td>All capacity on non-constraints above what is needed to support the constraint; consists of protective plus excess</td>\n</tr>\n<tr>\n<td><em>Protective capacity</em></td>\n<td>The part of idle capacity needed to catch up when Murphy strikes, so that the buffer in front of the constraint is refilled; syn. <em>sprint capacity</em></td>\n</tr>\n<tr>\n<td><em>Excess capacity</em></td>\n<td>Capacity that neither produces throughput nor protects; available for additional sales or for trimming</td>\n</tr>\n</tbody>\n</table>\n<pre><code> Total capacity of non-constraint\n |------------------------|----------------|---------------|\n     productive capacity     protective        excess\n                             (sprint)\n |&lt;------ needed for constraint ----------&gt;|\n |                        |&lt;--------- idle capacity -------&gt;|\n</code></pre>\n<p>The Dictionary says of <em>protective capacity</em> that non-constraints need it to rebuild the \"bank\" (inventory) in front of the constraint or CCR and to protect delivery reliability. Some practitioners hold that the constraint itself should also have some protective capacity for positive surprises, such as unexpected extra demand from an important customer.</p>\n<p>Two relationships the exam likes to test:</p>\n<ul>\n<li><strong>More protective capacity means smaller buffers.</strong> If non-constraints can catch up quickly, the time buffer in front of the constraint need not be as large. That shortens lead time.</li>\n<li><strong>Less variation means less protective capacity needed.</strong> If you reduce Murphy, you need less reserve.</li>\n</ul>\n<p>The traditional perspective sees all idle capacity as waste that should be trimmed. TOC says: part of it, the protective capacity, is vital. Only the excess capacity may be trimmed, and even that is better used for additional sales.</p>\n<p>Sprint capacity is the synonym of protective capacity: the capacity to \"sprint\" and catch up after a disruption.</p>\n<h2 id=\"27-activation-versus-utilization\">2.7 Activation versus utilization</h2>\n<p>This distinction comes straight from <em>The Goal</em> and is a standard exam question.</p>\n<p><em>Activation</em> simply means putting a resource to work. <em>Utilization</em> in TOC means activation of a resource that productively contributes to reaching the goal.</p>\n<p>The difference: a non-constraint that runs full days is 100 percent activated. But if the constraint can process only 60 percent of that output, the non-constraint is only 60 percent utilized. The other 40 percent produces only inventory.</p>\n<p><em>Over activation</em> is activating a resource more than needed to keep up with the constraint, or, after a disruption, more than needed to rebuild the inventory in front of the constraint. Example from the Dictionary: a resource with 7 hours of capacity per shift normally needs to produce 5.5 hours to keep up with the constraint. More than 5.5 hours is over activation, unless there is catching up to do after a breakdown.</p>\n<p>In TOC, non-constraints are activated to the level needed to fully exploit the constraint. The consequence of over activation: extra work-in-process and finished goods. That costs money (investment), lengthens lead times and clogs the plant.</p>\n<h2 id=\"28-garbage-time-and-the-hour-of-the-bottleneck\">2.8 Garbage time and the hour of the bottleneck</h2>\n<p><em>Garbage time</em> is the informal term for time a bottleneck spends on work that either should not be done at all, or should be done by a non-bottleneck. Examples:</p>\n<ul>\n<li>Processing parts that are later rejected (quality inspection should have been placed before the bottleneck).</li>\n<li>Producing for inventory instead of for orders.</li>\n<li>Doing an operation that an older, slower machine could also have done.</li>\n</ul>\n<h3 id=\"an-hour-lost-at-the-bottleneck\">An hour lost at the bottleneck</h3>\n<p>Two famous rules of Jonah from <em>The Goal</em>:</p>\n<ol>\n<li><strong>An hour lost at a bottleneck is an hour lost for the whole system.</strong> The bottleneck determines throughput. Every hour it does not produce never comes back. The lost throughput is not the cost price of that hour of machine time, but the throughput of the whole system in that hour.</li>\n<li><strong>An hour saved at a non-bottleneck is a mirage.</strong> A non-bottleneck already has idle capacity. Saving an hour adds idle capacity, not throughput.</li>\n</ol>\n<p>Calculation example: a plant generates 10,000 euros of throughput per hour. The bottleneck stands still for an hour because of an avoidable setup. Loss: 10,000 euros, even though the machine itself costs only 50 euros per hour. The same setup on a non-bottleneck costs nothing in throughput. That is why TOC makes batch decisions differently at bottlenecks (large batches, few setups) than at non-bottlenecks (small batches, many setups).</p>\n<h2 id=\"29-mini-case-the-laboratory\">2.9 Mini-case: the laboratory</h2>\n<p>A medical lab has four stations: intake, centrifuge, analyzer, reporting. Capacities per hour: 60, 80, 40, 100 samples. Demand: 50 per hour.</p>\n<ul>\n<li>The analyzer (40) is a <strong>bottleneck</strong>: capacity less than demand.</li>\n<li>Everyone is measured on efficiency. Intake processes 60 per hour (over activation). In front of the analyzer 20 samples per hour pile up.</li>\n<li>Mislabeled samples only show up after the analyzer. Every faulty sample has consumed analyzer time: garbage time.</li>\n</ul>\n<p>TOC actions: label check before the analyzer (exploit), intake back to 40 per hour (subordinate), only then a second analyzer (elevate). The centrifuge (80) has 40 productive capacity and the rest protective plus excess. Do not cut that reserve: after a breakdown the centrifuge must be able to catch up quickly so that the analyzer does not starve.</p>\n<h2 id=\"exam-traps\">Exam Traps</h2>\n<ul>\n<li><strong>Bottleneck versus CCR.</strong> Bottleneck: capacity less than or equal to demand. CCR: sufficient capacity on average, but so tight that variation can harm throughput. A plant can have a CCR while the market is the constraint.</li>\n<li><strong>Constraint versus bottleneck.</strong> Constraint is the broader term (can be market, critical chain, resource). Bottleneck is only about resources with too little capacity.</li>\n<li><strong>Misnomers.</strong> Policy, measures, material and management (meaning 1) constraints are, according to the Dictionary, not constraints; they hinder exploit and subordinate. A market constraint, on the other hand, is real.</li>\n<li><strong>Eliminate a dummy constraint, keep a strategic constraint.</strong> Two opposite actions, both correct.</li>\n<li><strong>Activation is not utilization.</strong> A resource that is running is activated; only what contributes to the goal is utilization. Over activation produces inventory, not throughput.</li>\n<li><strong>Idle capacity is not the same as excess capacity.</strong> Idle consists of protective plus excess. Only excess is truly surplus.</li>\n<li><strong>An hour saved at a non-bottleneck is no gain.</strong> Only hours at the bottleneck count for the system.</li>\n</ul>\n<h2 id=\"summary\">Summary</h2>\n<ul>\n<li>A constraint is the factor that ultimately limits system performance; by exploiting it, subordinating to it or elevating it you get more of the goal.</li>\n<li>Every system has at least one constraint, but seldom more than a few.</li>\n<li>Real constraints: internal capacity (bottleneck), market, deliberately chosen strategic constraint. Dummy constraints are real but must always be eliminated.</li>\n<li>Misnomers according to the Dictionary: policy, measures, material and (poor) management. They hinder exploit and subordinate.</li>\n<li>Bottleneck resource: capacity &lt;= demand. CCR: capacity just sufficient but vulnerable. Non-bottleneck: capacity &gt; demand.</li>\n<li>A wandering bottleneck jumps often; a temporary bottleneck is brief; a permanent bottleneck remains despite extra resources (for example IT and sales in services).</li>\n<li>Dependent events plus statistical fluctuations cause variation in a chain to accumulate (match-bowl game, Herbie). That is why the output of a chain is lower than the average of the steps.</li>\n<li>A balanced plant (all capacities equal to demand) therefore fails. TOC balances the flow, not the capacity.</li>\n<li>Capacity of a non-constraint: productive (needed for the constraint) plus idle; idle consists of protective (sprint; catching up after Murphy) plus excess.</li>\n<li>More protective capacity allows smaller buffers and shorter lead times; less variation reduces the need for protective capacity.</li>\n<li>Activation is letting a resource run; utilization is activation that contributes to the goal. Over activation produces only inventory.</li>\n<li>An hour lost at the bottleneck is an hour lost for the whole system; an hour saved at a non-bottleneck is a mirage. Garbage time is bottleneck time spent on work that should not have been done, or should have been done elsewhere.</li>\n</ul>", "q": [{"n": 1, "q": "Which definition of <em>constraint</em> matches the TOCICO Dictionary?", "opts": {"A": "Any resource that is utilized less than 100 percent", "B": "The factor that ultimately limits the performance of the system", "C": "Any policy that slows down production", "D": "The most expensive machine in the system"}, "gebied": 1, "a": "B", "e": "This is the definition from the Dictionary. A confuses constraint with idle capacity. C describes a policy constraint, which the Dictionary calls a misnomer. D confuses leverage with size."}, {"n": 2, "q": "A resource has a capacity of 105 units per day against a demand of 100, but has many breakdowns that regularly cause throughput to fall. This resource is a:", "opts": {"A": "Bottleneck resource", "B": "Capacity-constrained resource (CCR)", "C": "Non-constraint requiring no further attention", "D": "Dummy constraint"}, "gebied": 1, "a": "B", "e": "The capacity is sufficient on average (105 &gt; 100), but variation threatens throughput if the resource is not carefully managed: the definition of a CCR. A requires capacity &lt;= demand. C ignores the risk. D is about cost, not capacity."}, {"n": 3, "q": "Which of the following does the Dictionary call a \"misnomer\" (an incorrect name)?", "opts": {"A": "Market constraint", "B": "Policy constraint", "C": "Strategic constraint", "D": "Interactive constraints"}, "gebied": 1, "a": "B", "e": "Policy constraint (like measures, material and management constraint) is according to the Dictionary a misnomer: bad policy hinders exploit and subordinate, but is not the constraint. A, C and D are real constraint concepts."}, {"n": 4, "q": "What is the correct distinction between <em>activation</em> and <em>utilization</em>?", "opts": {"A": "Activation applies to machines, utilization to people", "B": "Activation is putting a resource to work; utilization is activation that productively contributes to the goal", "C": "Utilization is always higher than activation", "D": "There is no difference; they are synonyms"}, "gebied": 1, "a": "B", "e": "Activation is putting to work; utilization is activation that contributes to the goal. A and C are invented. D is incorrect; the distinction is precisely the point."}, {"n": 5, "q": "What does the match-bowl game from <em>The Goal</em> teach?", "opts": {"A": "Averages of individual steps correctly predict the output of a chain", "B": "Variation in a chain of dependent events accumulates and lowers output below the average", "C": "High rolls fully compensate for low rolls", "D": "More bowls in the row increase the output"}, "gebied": 1, "a": "B", "e": "Because a boy can never pass on more than he has, low rolls are not made up and high rolls are lost; variation accumulates. A and C are precisely what the game refutes. D is incorrect; more steps make the effect worse."}, {"n": 6, "q": "Why does TOC reject a <em>balanced plant</em>?", "opts": {"A": "Because a balanced plant has too much excess capacity", "B": "Because with dependent events and statistical fluctuations lost output is never made up if nobody has reserve", "C": "Because lean prescribes a balanced plant", "D": "Because a balanced plant cannot have a drum"}, "gebied": 1, "a": "B", "e": "Without reserve capacity every loss due to variation becomes permanent. A is the reverse. C is not a reason for TOC. D is not the reason; the question is whether the plant can protect flow."}, {"n": 7, "q": "<em>Idle capacity</em> on a non-constraint consists of:", "opts": {"A": "Productive capacity and excess capacity", "B": "Protective capacity and excess capacity", "C": "Sprint capacity and productive capacity", "D": "Excess capacity only"}, "gebied": 1, "a": "B", "e": "Idle capacity = protective + excess. Productive capacity falls outside idle. C mixes sprint (= protective) with productive. D forgets protective."}, {"n": 8, "q": "A plant generates 8,000 euros of throughput per hour. The bottleneck stands still for an hour because of an avoidable setup. The machine costs 40 euros per hour. What is the loss for the system?", "opts": {"A": "40 euros", "B": "8,000 euros", "C": "8,040 euros", "D": "Nothing, because the setup was necessary"}, "gebied": 1, "a": "B", "e": "An hour lost at the bottleneck is an hour lost for the whole system: 8,000 euros of throughput. A is the cost-world answer. C double counts. D ignores that the setup was avoidable."}, {"n": 9, "q": "According to the Dictionary, what must always happen with a <em>dummy constraint</em>?", "opts": {"A": "Keep it as a strategic constraint", "B": "Protect it with a buffer", "C": "Eliminate it", "D": "Move it to the market"}, "gebied": 1, "a": "C", "e": "The Dictionary: dummy constraints must always be eliminated, because they are inexpensive relative to the rest of the system. A is the opposite. B and D are not actions for a dummy constraint."}, {"n": 10, "q": "Which statement about <em>protective capacity</em> is correct?", "opts": {"A": "More protective capacity requires larger buffers", "B": "Protective capacity is waste that should be trimmed", "C": "More protective capacity allows smaller buffers and shorter lead times", "D": "Only the constraint needs protective capacity"}, "gebied": 1, "a": "C", "e": "More protective capacity means non-constraints catch up faster, hence smaller buffers and shorter lead times. A is the reverse. B is the traditional misconception. D is incorrect; it is precisely non-constraints that need protective capacity."}]}, {"id": "ch03", "num": 3, "title"
