: "The Five Focusing Steps and POOGI", "part": 1, "partShort": "Part 1", "partLong": "TOC Fundamentals Concepts", "gebied": 1, "html": "<h2 id=\"learning-objectives\">Learning Objectives</h2>\n<p>After this chapter you can:</p>\n<ul>\n<li>Name the <em>five focusing steps</em> in the correct order and explain what each step involves.</li>\n<li>Recognize concrete actions as identify, exploit, subordinate or elevate.</li>\n<li>Explain why elevate comes only after exploit and subordinate.</li>\n<li>Place the <em>prerequisite steps</em> and the <em>seven focusing steps</em>, and know which organizations they are intended for.</li>\n<li>Explain what <em>inertia</em> means in step 5 and why TOC warns against it.</li>\n<li>Connect the five focusing steps to buffers, the <em>drum</em>, the <em>Pareto principle</em> and <em>policies, measurements and behaviors</em> (PMBs).</li>\n</ul>\n<h2 id=\"31-the-five-focusing-steps-at-a-glance\">3.1 The five focusing steps at a glance</h2>\n<p>The <em>five focusing steps</em> (5FS) are a systematic five-step approach used to continually improve a system's ability to produce goal units. The Dictionary formulates them as follows:</p>\n<table>\n<thead>\n<tr>\n<th>Step</th>\n<th>Dictionary wording</th>\n<th>Meaning</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>IDENTIFY the system's constraint(s)</td>\n<td>Determine what is currently limiting the system</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Decide how to EXPLOIT the system's constraint(s)</td>\n<td>Decide how to get the most out of the constraint(s)</td>\n</tr>\n<tr>\n<td>3</td>\n<td>SUBORDINATE everything else to the above decision</td>\n<td>Align everything else with that decision</td>\n</tr>\n<tr>\n<td>4</td>\n<td>ELEVATE the system's constraint(s)</td>\n<td>Increase the capacity of the constraint(s)</td>\n</tr>\n<tr>\n<td>5</td>\n<td>WARNING!!!! If in the previous steps a constraint has been broken, go back to step 1, but do not allow INERTIA to cause a system's constraint</td>\n<td>If a constraint has been broken, return to step 1, but do not let inertia become a constraint</td>\n</tr>\n</tbody>\n</table>\n<p>The 5FS are one of the three <em>processes of ongoing improvement</em> (POOGI) of TOC, alongside the change question sequence and buffer management (see chapter 1).</p>\n<p>Note the precise wording of step 2: not \"exploit\", but \"<strong>decide how to</strong> exploit\". It is a decision step. Step 3 refers to \"the above decision\": the decision of step 2. Exams test this kind of detail.</p>\n<h2 id=\"32-step-1-identify\">3.2 Step 1: Identify</h2>\n<p><em>Identify</em> is the process of determining what factor is currently most limiting the attainment of the goal.</p>\n<p>How do you find the constraint in practice?</p>\n<ul>\n<li><strong>Where does work pile up?</strong> In front of a bottleneck the queue grows (Herbie: the boys in front of him walk away, the gap grows).</li>\n<li><strong>Where is there the most fighting?</strong> The resource where everyone wants to give their order priority.</li>\n<li><strong>Where is there the most waiting?</strong> If customers wait because the plant cannot deliver, the constraint is internal. If the plant waits for orders, the market is the constraint.</li>\n<li><strong>Load analysis.</strong> For each resource, compare the hours required (demand times processing time) with the hours available. The resource with the highest percentage is the candidate.</li>\n</ul>\n<p>A pitfall: policy can make a resource look like a bottleneck when it is not. The Dictionary mentions batching policy, \"process batch equal to transfer batch\", managing on efficiency and the end-of-month syndrome. Such resources turn out to have ample capacity after steps 2 and 3. That is why step 1 is never final: you identify the constraint as it is <strong>now</strong>.</p>\n<p>Example: in a software company all projects get stuck at the testing department. The testing department is the candidate constraint. But on closer inspection it receives all its work on the last day of the sprint (batching policy). With an even flow of work it has enough capacity. The real constraint may then be elsewhere, for example in the market or with the architects.</p>\n<h2 id=\"33-step-2-exploit\">3.3 Step 2: Exploit</h2>\n<p><em>Exploit</em>, in the case of an internal resource constraint, means getting more goal units by taking actions that make the best use of the constraint.</p>\n<p>The key phrase is <strong>without major investment</strong>. Exploit is about using cleverly what you have. The Dictionary gives the actions from <em>The Goal</em> at the NCX-10 and lists general actions:</p>\n<table>\n<thead>\n<tr>\n<th>Action</th>\n<th>Why it works</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Staff the constraint during lunch, breaks and shift changes</td>\n<td>Every hour of downtime at the constraint is a system loss</td>\n</tr>\n<tr>\n<td>Place quality inspection <strong>before</strong> the constraint</td>\n<td>Otherwise defective parts waste constraint time (garbage time)</td>\n</tr>\n<tr>\n<td>Make a schedule (drum) for the constraint</td>\n<td>The constraint works on the right orders in the right sequence</td>\n</tr>\n<tr>\n<td>Reduce setup times at the constraint (SMED)</td>\n<td>More productive hours</td>\n</tr>\n<tr>\n<td>Total productive maintenance at the constraint</td>\n<td>Fewer breakdowns at the place where they cost the most</td>\n</tr>\n<tr>\n<td>Offload work to other resources or old machines</td>\n<td>Only work that really has to be done at the constraint stays there</td>\n</tr>\n<tr>\n<td>Produce only what is sold</td>\n<td>No constraint time spent on inventory</td>\n</tr>\n<tr>\n<td>For a market constraint: an <em>unrefusable offer</em></td>\n<td>Win more orders from the existing market</td>\n</tr>\n</tbody>\n</table>\n<p>Note that \"offload\" (taking work away from the constraint) is sometimes placed under exploit and sometimes under elevate in the literature. Under <em>elevate</em> the Dictionary mentions bringing back old machines that can do the same as the NCX-10. The distinction: offloading to existing capacity without investment is exploit; adding capacity (buying back old machines, outsourcing at a cost) is elevate.</p>\n<h3 id=\"exploit-with-a-market-constraint\">Exploit with a market constraint</h3>\n<p>If the market is the constraint, exploit means: get the maximum out of existing demand. Deliver 100 percent on time, lose not a single order through poor service, and make an offer the customer cannot refuse (for example fast and reliable delivery). It is a misconception that the 5FS apply only to factories.</p>\n<h2 id=\"34-step-3-subordinate\">3.4 Step 3: Subordinate</h2>\n<p><em>Subordinate</em> is the third step: subordinate everything else to the exploit decision. The Dictionary calls subordination vital to achieving full exploitation and distinguishes two components:</p>\n<ol>\n<li>All non-constraint resources are managed so that the constraint <strong>always has exactly what it needs, when it needs it</strong>.</li>\n<li>All non-constraint resources must <strong>not process more work than is needed</strong> for the constraint.</li>\n</ol>\n<p>Component 1 is about feeding: the constraint must never starve (starvation) or become blocked (blockage). Component 2 is about holding back: no over activation, no mountains of inventory.</p>\n<p>Example from the Dictionary: non-bottleneck resources must ignore local efficiency and run smaller batches, so that the constraint does not starve.</p>\n<h3 id=\"why-subordinate-is-the-hardest-step\">Why subordinate is the hardest step</h3>\n<p>Step 3 touches behavior and measurements. An operator who has always been judged on output must now sometimes stand idle. A salesperson who is judged on revenue must sometimes refuse an order that would overload the constraint. A buyer who is judged on price must sometimes buy at a higher price so that the constraint does not have to wait. Subordination requires the organization to put the constraint above local performance.</p>\n<h3 id=\"subordination-and-buffers\">Subordination and buffers</h3>\n<p>Buffers are the most important instrument of subordination. A <em>buffer</em> is protection against uncertainty, in the form of time, inventory or capacity. In drum-buffer-rope (part 3) a <em>constraint buffer</em> (a time buffer in front of the constraint) protects against starvation: material is released so much earlier that the constraint always has work, even if something goes wrong somewhere upstream. The <em>rope</em> ties material release to the pace of the constraint, so that non-constraints do not process more than needed. Both are concrete forms of \"subordinate everything else\".</p>\n<p>The <em>protective capacity</em> on non-constraints (chapter 2) is also subordination: non-constraints keep reserve to refill the buffer in front of the constraint after Murphy.</p>\n<h3 id=\"the-drum\">The drum</h3>\n<p>In operations, the <em>drum</em> is the schedule of the constraint, the drumbeat of the organization. The drum is the result of step 2 (decide how the constraint is exploited, in what sequence) and the starting point of step 3 (everything is aligned with the drum). The <em>drum resource</em> is the resource that serves as the drum: a constraint or a CCR. In simplified drum-buffer-rope the market is the drum and any CCR receives secondary attention.</p>\n<h2 id=\"35-step-4-elevate\">3.5 Step 4: Elevate</h2>\n<p><em>Elevate</em> means: taking actions that do not exploit or subordinate, but that nevertheless lead to the system producing more goal units. These actions usually require investment or outsourcing.</p>\n<p>Examples:</p>\n<ul>\n<li>Buy a second machine.</li>\n<li>Hire extra staff or start an extra shift.</li>\n<li>Outsource work to a supplier.</li>\n<li>For a market constraint: open new markets or segments, launch a new product.</li>\n</ul>\n<p>The example from <em>The Goal</em>: after all the exploit and subordinate actions UNICO still could not meet demand. They brought back old, less efficient machines that could do the same as the NCX-10.</p>\n<h3 id=\"why-elevate-only-after-exploit-and-subordinate\">Why elevate only after exploit and subordinate?</h3>\n<p>This is a classic exam question. Three reasons:</p>\n<ol>\n<li><strong>Exploit and subordinate cost little and often deliver a lot.</strong> In many companies the constraint turns out not to be a constraint at all after steps 2 and 3. Investing in step 4 would then waste money on capacity you do not need.</li>\n<li><strong>Without subordination, elevate is pointless.</strong> If non-constraints cannot feed the new capacity, the expensive new machine stands idle too.</li>\n<li><strong>Only after exploit do you know how much to elevate.</strong> The real capacity of the constraint only becomes clear after optimal use.</li>\n</ol>\n<p>Rule of thumb: never invest in the constraint before you are sure you are already exploiting it to the maximum.</p>\n<h2 id=\"36-step-5-go-back-and-watch-out-for-inertia\">3.6 Step 5: Go back, and watch out for inertia</h2>\n<p>If in the previous steps the constraint has been broken (it is no longer a constraint), go back to step 1. There is now a new constraint. That can be another resource, or the market.</p>\n<p>The warning: <strong>do not allow inertia to cause a system's constraint.</strong> <em>Inertia</em> here means that rules, policies and behaviors that were introduced to manage the old constraint continue to exist after that constraint has disappeared. Those old rules then limit the new situation.</p>\n<p>Example: when the heat treat furnace was the constraint, the rule was \"large batches on the furnace\". Now that the furnace has ample capacity, large batches are only harmful: they lengthen lead time and make the new constraint wait. If nobody withdraws the rule, the rule itself becomes the limitation.</p>\n<p>The Dictionary also describes inertia as an <em>engine of disharmony</em> (a process that works against the goal): many people carry out tasks for which the reason no longer exists.</p>\n<p>Step 5 turns the 5FS into a cycle: a POOGI. Without step 5 it is a one-time project.</p>\n<pre><code>        +---&gt; 1. IDENTIFY ---&gt; 2. EXPLOIT ---&gt; 3. SUBORDINATE ---&gt; 4. ELEVATE ---+\n        |                                                                          |\n        +------------- 5. constraint broken? go back; beware of INERTIA &lt;----------+\n</code></pre>\n<h2 id=\"37-prerequisite-steps-and-the-seven-focusing-steps\">3.7 Prerequisite steps and the seven focusing steps</h2>\n<p>The 5FS assume that you know what \"the system\" and \"the goal\" are. In practice that is not always the case. That is why TOC has <em>prerequisite steps</em>:</p>\n<ol>\n<li>Define the system and its boundaries.</li>\n<li>Define the goal of the system.</li>\n<li>Define the measurements by which you determine whether the system is getting closer to the goal.</li>\n</ol>\n<p>The Dictionary formalizes this as the <em>seven focusing steps</em>: the original five focusing steps plus two additional steps inserted at the beginning:</p>\n<table>\n<thead>\n<tr>\n<th>Step</th>\n<th>Content</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>State the goal of the organization</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Define global performance measures</td>\n</tr>\n<tr>\n<td>3-7</td>\n<td>Identify, exploit, subordinate, elevate, go back</td>\n</tr>\n</tbody>\n</table>\n<p>The Dictionary states explicitly who this is intended for: <strong>not-for-profit and government organizations</strong>, where the goal is different from making money and where a clear definition of throughput in goal units is therefore needed first in order to build a global measurement system. For a commercial company the goal and measurements (T, I, OE) are already known and the five steps suffice.</p>\n<h2 id=\"38-pareto-principle-and-focus\">3.8 Pareto principle and focus</h2>\n<p>The <em>Pareto principle</em> states that in many phenomena approximately 80 percent of the effects result from 20 percent of the causes.</p>\n<p>Goldratt went further. The Dictionary quotes his position: Pareto applies to <strong>independent</strong> items. In most systems, however, there is dependency. With dependent items the ratio is far more skewed than 80/20: for example 0.1 percent of the items cause 99.9 percent of the effects.</p>\n<p>This is the justification for the 5FS. If one constraint determines virtually all output, focusing on that one constraint is not merely \"efficient\", but the only approach that works. Improvement programs that improve everywhere at once (classic TQM, kaizen without focus) spread the effort over the 99.9 percent that does not matter.</p>\n<h2 id=\"39-policies-measurements-and-behaviors-pmbs\">3.9 Policies, measurements and behaviors (PMBs)</h2>\n<p>Why do people behave the way they do? The Dictionary describes <em>policies, measurements and behaviors</em> (PMBs) as a series of three entities that document the cause-and-effect relationship between a policy, the corresponding measurement and the resulting behavior.</p>\n<pre><code> POLICY                    --&gt;  MEASUREMENT               --&gt;  BEHAVIOR\n &quot;Keep everyone busy,           Local efficiency and           Work is released\n  that lowers unit cost&quot;        resource utilization           too early; overproduction\n</code></pre>\n<p>The example from the Dictionary: based on the assumption that higher local efficiency is desirable, there is an (informal) policy to always keep employees busy. The measurements are local efficiency and utilization. The behavior is that work is released early. The undesirable effects: too much work-in-process and finished goods, diluted priorities, poor delivery reliability, low cash position.</p>\n<p>PMBs matter for the 5FS for two reasons:</p>\n<ul>\n<li><strong>Subordinate (step 3) fails if the PMBs do not change.</strong> You cannot ask operators to stand idle if they are judged on efficiency. \"Tell me how you measure me and I will tell you how I will behave\" is a well-known saying of Goldratt.</li>\n<li><strong>Inertia (step 5) is often a PMB that has lingered.</strong> The old constraint is gone, but the policy and measurement that belonged to it still drive behavior.</li>\n</ul>\n<p>When building a current reality tree (part 2), PMB sequences are recorded explicitly, because they are often the source of several undesirable effects.</p>\n<h2 id=\"310-mini-case-the-bicycle-factory\">3.10 Mini-case: the bicycle factory</h2>\n<p>Bicycle factory Velo makes 400 bicycles per week; the market demands 500. The paint line can handle 400 frames per week. All other departments can do 550 or more.</p>\n<p><strong>Step 1, identify.</strong> Racks full of frames stand in front of the paint line. The paint line is the constraint (bottleneck: capacity 400 &lt; demand 500).</p>\n<p><strong>Step 2, exploit.</strong> Analysis of the paint line:\n- The paint line stands still every day for 45 minutes at shift change and 30 minutes at lunch. Continuous staffing: +8 percent capacity.\n- 5 percent of the painted frames are rejected because of welding defects that were already visible before painting. Weld inspection before the paint line: +5 percent.\n- The paint line also paints frames for a cheap model that is made to stock and sells poorly. Paint only to order: +4 percent.\nResult: about 470 frames per week, without investment.</p>\n<p><strong>Step 3, subordinate.</strong> The welding team is no longer judged on output, but on delivering on time and without defects exactly the frames the paint line needs. Material release is tied to the paint schedule (rope). A buffer of two days of work is maintained in front of the paint line. The welding shop keeps reserve (protective capacity) to catch up quickly after a breakdown.</p>\n<p><strong>Step 4, elevate.</strong> There are still 30 bicycles per week missing. Only now is there investment: a second drying oven in the paint line, which takes capacity to 560.</p>\n<p><strong>Step 5, go back.</strong> The paint line (560) now has more capacity than the market (500). The market is the new constraint. Sales must now exploit the constraint. And the old rule \"large paint batches per color\" must be withdrawn, otherwise inertia causes long lead times that drive customers away.</p>\n<h2 id=\"exam-traps\">Exam Traps</h2>\n<ul>\n<li><strong>Order.</strong> Identify, exploit, subordinate, elevate, go back. An answer option with elevate before exploit is wrong.</li>\n<li><strong>\"Decide how to exploit\".</strong> Step 2 is a decision; step 3 subordinates to \"the above decision\". The exam may quote literally.</li>\n<li><strong>Exploit versus elevate.</strong> Exploit: use better without material investment. Elevate: add capacity, usually with investment or outsourcing. Quality inspection before the constraint is exploit; buying a second machine is elevate.</li>\n<li><strong>Subordinate has two sides.</strong> Feeding (the constraint must lack nothing) and holding back (do not produce more than the constraint needs).</li>\n<li><strong>Inertia</strong> is not laziness, but letting rules persist for a constraint that no longer exists.</li>\n<li><strong>Seven focusing steps</strong> are the 5FS plus \"state the goal\" and \"define global measures\" beforehand, intended for non-profit and government.</li>\n<li><strong>Pareto.</strong> Goldratt holds that 80/20 applies to independent items; with dependency the ratio is far more skewed (for example 0.1/99.9).</li>\n<li><strong>PMB order.</strong> Policy leads to measurement leads to behavior. Not the other way round.</li>\n</ul>\n<h2 id=\"summary\">Summary</h2>\n<ul>\n<li>The five focusing steps: 1 identify, 2 decide how to exploit, 3 subordinate everything else to that decision, 4 elevate, 5 if the constraint is broken go back to step 1 but don't let inertia become the constraint.</li>\n<li>The 5FS are one of the three POOGIs of TOC.</li>\n<li>Identify: determine what is currently most limiting the goal; watch out for policy that wrongly makes a resource look like a bottleneck.</li>\n<li>Exploit: get the maximum out of the constraint without major investment (staffing during breaks, quality inspection before it, drum schedule, setup time, TPM, only to order, unrefusable offer for a market constraint).</li>\n<li>Subordinate: non-constraints give the constraint exactly what it needs and do no more than that; buffers, rope and protective capacity are the instruments.</li>\n<li>The drum is the schedule of the constraint, result of exploit and basis for subordinate.</li>\n<li>Elevate: add capacity, usually with investment; only after exploit and subordinate, because those are often sufficient and otherwise you invest in unused capacity.</li>\n<li>Step 5 turns the 5FS into a cycle; inertia (old rules that linger) is the danger.</li>\n<li>Prerequisite steps: define system, goal and measurements; the seven focusing steps add \"state the goal\" and \"define global measures\", mainly for non-profit and government.</li>\n<li>Pareto: 80/20 for independent items; with dependency far more skewed, which justifies focus on one constraint.</li>\n<li>PMBs: policy leads to measurements leads to behavior; subordination and avoiding inertia require adjusting PMBs.</li>\n</ul>", "q": [{"n": 1, "q": "What is the correct order of the five focusing steps?", "opts": {"A": "Identify, elevate, exploit, subordinate, go back", "B": "Identify, exploit, subordinate, elevate, go back", "C": "Exploit, identify, subordinate, elevate, go back", "D": "Identify, subordinate, exploit, elevate, go back"}, "gebied": 1, "a": "B", "e": "Identify, exploit, subordinate, elevate, go back is the order from the Dictionary. A, C and D swap steps."}, {"n": 2, "q": "A plant places quality inspection directly before the bottleneck, so that defective parts no longer consume bottleneck time. This is an example of:", "opts": {"A": "Identify", "B": "Exploit", "C": "Elevate", "D": "Inertia"}, "gebied": 1, "a": "B", "e": "Quality inspection before the constraint prevents garbage time and gets more out of the existing constraint without investment: exploit. A is finding the constraint. C requires capacity expansion. D is the danger from step 5."}, {"n": 3, "q": "Why does <em>elevate</em> come only after <em>exploit</em> and <em>subordinate</em>?", "opts": {"A": "Because elevate is legally required after subordinate", "B": "Because exploit and subordinate are often already sufficient and otherwise you invest in capacity you do not need", "C": "Because elevate can only be applied to the market", "D": "Because subordinate is only possible after investment"}, "gebied": 1, "a": "B", "e": "Exploit and subordinate are cheap and often already sufficient; investing before that leads to unused capacity. A, C and D are invented."}, {"n": 4, "q": "Which two components does <em>subordinate</em> have according to the Dictionary?", "opts": {"A": "Lowering costs and raising efficiency", "B": "Always giving the constraint exactly what it needs, and not letting non-constraints do more than the constraint needs", "C": "Replacing the constraint and expanding the market", "D": "Removing buffers and enlarging batches"}, "gebied": 1, "a": "B", "e": "These are the two components from the Dictionary: feeding and holding back. A is cost-world thinking. C and D are not subordination; D is even the opposite."}, {"n": 5, "q": "What does the warning in step 5 mean: \"do not allow inertia to cause a system's constraint\"?", "opts": {"A": "Employees must work harder after an improvement", "B": "Rules and measurements that belonged to the old constraint can limit the new situation if they are not adjusted", "C": "The constraint must never be moved", "D": "Investments in the old constraint must be recovered"}, "gebied": 1, "a": "B", "e": "Inertia is letting rules and measurements persist that belonged to a constraint that has disappeared. A confuses inertia with effort. C is incorrect; the constraint does move. D is not a TOC principle."}, {"n": 6, "q": "According to the Dictionary, for which type of organization are the <em>seven focusing steps</em> mainly intended?", "opts": {"A": "Publicly listed manufacturing companies", "B": "Not-for-profit and government organizations", "C": "Project organizations", "D": "Distribution companies"}, "gebied": 1, "a": "B", "e": "The Dictionary explicitly names not-for-profit and government, because there the goal is not money and throughput in goal units must first be defined. A, C and D are not what the Dictionary says."}, {"n": 7, "q": "Which two steps are placed before the five focusing steps in the seven focusing steps?", "opts": {"A": "Define the buffer; define the rope", "B": "State the goal; define global performance measures", "C": "Identify the market; identify the drum", "D": "Exploit the constraint; elevate the constraint"}, "gebied": 1, "a": "B", "e": "State the goal and define global performance measures. A and C are DBR concepts. D are existing steps."}, {"n": 8, "q": "What does Goldratt say about the <em>Pareto principle</em> according to the Dictionary?", "opts": {"A": "It applies in all situations exactly as 80/20", "B": "It applies to independent items; with dependency the ratio is far more skewed", "C": "It does not apply to TOC", "D": "It applies only to inventory management"}, "gebied": 1, "a": "B", "e": "Goldratt: Pareto applies to independent items; with dependency 0.1 percent of the items can cause 99.9 percent of the effects. A, C and D are incorrect."}, {"n": 9, "q": "A policy \"keep everyone busy\" leads to the measurement \"local efficiency\" and the behavior \"releasing work too early\". What does the Dictionary call this sequence?", "opts": {"A": "Five focusing steps", "B": "Policies, measurements and behaviors (PMBs)", "C": "Engines of harmony", "D": "Dependent events"}, "gebied": 1, "a": "B", "e": "Policy, measurement, behavior: exactly the PMB sequence from the Dictionary. A is the improvement process. C is the opposite (engines of harmony support the goal). D is about dependent events."}, {"n": 10, "q": "A company buys a second machine for the constraint operation after exploit and subordinate proved insufficient. Which step is this?", "opts": {"A": "Exploit", "B": "Subordinate", "C": "Elevate", "D": "Identify"}, "gebied": 1, "a": "C", "e": "Adding capacity with investment is elevate. A and B are the cheap steps before it. D is finding the constraint."}]}];

<script>
(function(){
const $ = s => document.querySelector(s);
const main = $('#main'), title = $('#title'), back = $('#back'), bnav = $('#bnav'), timerEl = $('#timer');
const store = {
  get(k, d){ try { const v = localStorage.getItem('tocfc.'+k); return v===null? d : JSON.parse(v);} catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem('tocfc.'+k, JSON.stringify(v)); } catch(e){} }
};
const CH = Object.fromEntries(DATA.map(c=>[c.id,c]));
const PARTS = [];
DATA.forEach(c=>{ let p = PARTS.find(x=>x.idx===c.part); if(!p){p={idx:c.part,short:c.partShort,long:c.partLong,ch:[]};PARTS.push(p);} p.ch.push(c); });
const GEB_NAMES = T.areaNames;
for(const l of T.langs){ const a = document.createElement('a'); a.className = 'langbtn'; a.href = l.href; a.textContent = l.label; a.lang = l.code; $('#langs').appendChild(a); }

// font size
let fs = store.get('fs', 17);
const applyFs = ()=>document.documentElement.style.setProperty('--fs', fs+'px');
applyFs();
$('#fontBtn').onclick = ()=>{ fs = fs>=21 ? 15 : fs+2; store.set('fs', fs); applyFs(); };

// router
let state = { view:'home' };
let timerId = null;
function go(s){ state = s; history.pushState(s, ''); render(); window.scrollTo(0,0); }
window.onpopstate = e => { if(e.state){ state = e.state; render(); } else { state={view:'home'}; render(); } };
$('#homeBtn').onclick = ()=>go({view:'home'});
back.onclick = ()=>history.length>1 ? history.back() : go({view:'home'});

function esc(s){ return s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } timerEl.classList.add('hidden'); }

function render(){
  stopTimer();
  bnav.classList.add('hidden'); bnav.innerHTML='';
  back.classList.toggle('hidden', state.view==='home');
  ({home, chapter, quiz, result}[state.view] || home)();
}

function bestOf(id){ return store.get('best.'+id, null); }

function home(){
  title.textContent = T.appTitle;
  const allQ = DATA.filter(c=>c.gebied).reduce((n,c)=>n+c.q.length,0);
  const done = DATA.filter(c=>store.get('read.'+c.id,false)).length;
  const hasExam = !!CH['ch15'];
  let h = T.trial ? buyCard() : '';
  h += `<div class="card"><h2>${T.progress}</h2>
    <div>${fmt(T.readOf,{d:done,n:DATA.length})}</div>
    <div class="prog"><i style="width:${Math.round(done/DATA.length*100)}%"></i></div>
    <div class="grid2" style="margin-top:12px">
      <button class="btn" id="mixBtn">${T.mix}</button>
      ${hasExam ? `<button class="btn sec" id="examBtn">${T.exam}</button>` : ''}
    </div>
    <p class="small muted" style="margin:10px 0 0">${fmt(T.homeNote,{q:allQ})}</p>
  </div>`;
  for(const p of PARTS){
    h += `<div class="card"><h2>${p.short} · ${p.long}</h2>`;
    for(const c of p.ch){
      const b = bestOf(c.id);
      const read = store.get('read.'+c.id,false);
      const sc = c.q.length ? (b!==null ? `<span class="zone ${zone(b)}">${b}%</span>` : `<span class="s">${c.q.length} ${T.questions}</span>`) : '';
      h += `<div class="row" data-ch="${c.id}"><div class="n">${c.num}</div><div class="t"><b>${esc(c.title)}</b><small>${read?T.read:T.unread}${c.q.length?' · '+c.q.length+' '+T.questions:''}</small></div>${sc}</div>`;
    }
    h += `</div>`;
  }
  if(T.trial){
    h += `<div class="card"><h2>${esc(T.trial.lockedHead)}</h2>`;
    for(const l of T.trial.locked){
      h += `<div class="row locked"><div class="n">${l.num}</div><div class="t"><b>${esc(l.title)}</b><small>${esc(T.trial.lockedNote)}</small></div><span class="s">🔒</span></div>`;
    }
    h += `</div>` + buyCard();
  }
  main.innerHTML = h;
  main.querySelectorAll('.row:not(.locked)').forEach(r=>r.onclick=()=>go({view:'chapter', id:r.dataset.ch}));
  main.querySelectorAll('.row.locked').forEach(r=>r.onclick=()=>window.open(T.trial.buyUrl,'_blank','noopener'));
  $('#mixBtn').onclick = ()=>mixSetup();
  if(hasExam) $('#examBtn').onclick = ()=>examSetup();
}

function buyCard(){
  return `<div class="card buy"><h2>${esc(T.trial.head)}</h2><p style="margin:0 0 10px">${esc(T.trial.text)}</p>
    <a class="btn block" href="${T.trial.buyUrl}" target="_blank" rel="noopener">${esc(T.trial.button)}</a></div>`;
}

function mixSetup(){
  title.textContent = T.mix;
  back.classList.remove('hidden');
  main.innerHTML = `<div class="card"><h2>${T.chooseArea}</h2>
    ${[1,2,3].map(g=>`<label class="chk"><input type="checkbox" class="g" value="${g}" checked> ${T.area} ${g} · ${T.areaNames[g]} (${T.areaRanges[g]})</label>`).join('')}
    <h2 style="margin-top:14px">${T.numQuestions}</h2>
    <div class="grid2"><button class="btn sec" data-n="10">10</button><button class="btn sec" data-n="20">20</button><button class="btn sec" data-n="40">40</button><button class="btn sec" data-n="999">${T.all}</button></div>
    <label class="chk" style="margin-top:12px"><input type="checkbox" id="onlyWrong"> ${T.onlyWrong}</label>
  </div>`;
  main.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{
    const gs = [...main.querySelectorAll('.g:checked')].map(x=>+x.value);
    const wrong = store.get('wrong', {});
    let pool = [];
    DATA.filter(c=>c.gebied && gs.includes(c.gebied)).forEach(c=>c.q.forEach(q=>pool.push({...q, ch:c.id, chTitle:c.title, key:c.id+':'+q.n})));
    if($('#onlyWrong').checked) pool = pool.filter(q=>wrong[q.key]);
    if(!pool.length){ alert(T.noQuestions); return; }
    shuffle(pool);
    pool = pool.slice(0, +b.dataset.n);
    go({view:'quiz', mode:'mix', qs:pool, i:0, ans:{}, label:fmt(T.mixLabel,{n:pool.length})});
  });
}

function examSetup(){
  const c = CH['ch15'];
  title.textContent = T.exam;
  back.classList.remove('hidden');
  const b = bestOf('ch15');
  main.innerHTML = `<div class="card content">${c.html}</div>
    <div class="card"><h2>${T.settings}</h2>
    <label class="chk"><input type="checkbox" id="exFeedback"> ${T.directFeedback}</label>
    <label class="chk"><input type="checkbox" id="exTimer" checked> ${T.showTimer}</label>
    ${b!==null?`<p class="small muted">${T.bestSoFar} <b>${b}%</b></p>`:''}
    <button class="btn block" id="startEx">${T.startExam}</button></div>`;
  $('#startEx').onclick = ()=>{
    const qs = c.q.map(q=>({...q, ch:'ch15', key:'ch15:'+q.n}));
    go({view:'quiz', mode:'exam', qs, i:0, ans:{}, label:T.exam, feedback:$('#exFeedback').checked, timer:$('#exTimer').checked, start:Date.now()});
  };
}

function chapter(){
  const c = CH[state.id];
  title.textContent = T.chAbbr+c.num+' · '+c.title;
  store.set('read.'+c.id, true);
  if(c.id==='ch15'){ examSetup(); return; }
  const qbtn = c.q.length ? `<button class="btn block" id="startQ">${T.practiceBtn} (${c.q.length}) →</button>` : '';
  const search = c.id==='ch16' ? `<input class="search sans" id="srch" placeholder="${T.searchTerm}">` : '';
  const tail = (T.trial && DATA.indexOf(c)===DATA.length-1) ? buyCard() : '';
  main.innerHTML = `${search}<div class="card content" id="cnt"><h1>${T.chapterWord} ${c.num}. ${esc(c.title)}</h1>${c.html}</div>${qbtn}${tail}`;
  if(c.q.length){
    $('#startQ').onclick = startChapterQuiz;
    bnav.classList.remove('hidden');
    bnav.innerHTML = `<button class="btn sec" id="prevCh">‹ ${T.prev}</button><button class="btn" id="quizNav">${T.practiceBtn}</button><button class="btn sec" id="nextCh">${T.next} ›</button>`;
    $('#quizNav').onclick = startChapterQuiz;
  } else {
    bnav.classList.remove('hidden');
    bnav.innerHTML = `<button class="btn sec" id="prevCh">‹ ${T.prev}</button><button class="btn sec" id="nextCh">${T.next} ›</button>`;
  }
  const idx = DATA.indexOf(c);
  $('#prevCh').disabled = idx===0; $('#nextCh').disabled = idx===DATA.length-1;
  $('#prevCh').onclick = ()=>go({view:'chapter', id:DATA[idx-1].id});
  $('#nextCh').onclick = ()=>go({view:'chapter', id:DATA[idx+1].id});
  function startChapterQuiz(){
    const qs = c.q.map(q=>({...q, ch:c.id, key:c.id+':'+q.n}));
    go({view:'quiz', mode:'chapter', id:c.id, qs, i:0, ans:{}, label:T.chAbbr+c.num+' · '+T.practiceBtn, feedback:true});
  }
  if(c.id==='ch16'){
    const cnt = $('#cnt');
    const items = [...cnt.querySelectorAll('p, li')];
    $('#srch').oninput = e=>{
      const v = e.target.value.trim().toLowerCase();
      items.forEach(el=>el.classList.toggle('hidden', v.length>1 && !el.textContent.toLowerCase().includes(v)));
      cnt.querySelectorAll('h2').forEach(h=>h.classList.toggle('hidden', v.length>1));
    };
  }
}

function quiz(){
  const st = state, q = st.qs[st.i], n = st.qs.length;
  const feedback = st.mode==='exam' ? !!st.feedback : true;
  title.textContent = `${st.label}  ${st.i+1}/${n}`;
  if(st.mode==='exam' && st.timer){
    timerEl.classList.remove('hidden');
    const tick = ()=>{ const left = 150*60*1000 - (Date.now()-st.start); const s = Math.max(0,Math.floor(left/1000)); timerEl.textContent = `${Math.floor(s/3600)}:${String(Math.floor(s%3600/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; if(left<=0){ stopTimer(); finish(); } };
    tick(); timerId = setInterval(tick, 1000);
  }
  const given = st.ans[st.i];
  const src = st.mode==='mix' ? `<span class="pill">${esc(CH[q.ch].title)}</span>` : (q.gebied && st.mode==='exam' ? `<span class="pill">${T.area} ${q.gebied}</span>`:'');
  let h = `<div class="prog"><i style="width:${Math.round(st.i/n*100)}%"></i></div>
    <div class="card"><p class="q"><span class="nr">${src}${fmt(T.questionOf,{i:st.i+1,n})}</span>${q.q}</p>`;
  for(const k of Object.keys(q.opts)){
    let cls = 'opt';
    if(given!==undefined){
      if(feedback){ if(k===q.a) cls+=' ok'; else if(k===given) cls+=' bad'; }
      else if(k===given) cls+=' sel';
    }
    h += `<button class="${cls}" data-k="${k}" ${given!==undefined && feedback?'disabled':''}><b>${k}</b><span>${q.opts[k]}</span></button>`;
  }
  if(given!==undefined && feedback){
    const ok = given===q.a;
    h += `<div class="expl ${ok?'ok':'bad'}"><span class="v">${ok?T.correct:T.wrongIs+q.a}</span>${q.e}</div>`;
  }
  h += `</div>`;
  main.innerHTML = h;
  main.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(feedback && st.ans[st.i]!==undefined) return;
    st.ans[st.i] = b.dataset.k;
    const wrong = store.get('wrong', {});
    if(b.dataset.k===q.a) delete wrong[q.key]; else wrong[q.key]=1;
    store.set('wrong', wrong);
    history.replaceState(st,'');
    if(feedback) render(); else next();
  });
  bnav.classList.remove('hidden');
  const answered = Object.keys(st.ans).length;
  bnav.innerHTML = `<button class="btn sec" id="pq" ${st.i===0?'disabled':''}>‹</button>
    ${st.i<n-1 ? `<button class="btn" id="nq">${T.next} ›</button>` : `<button class="btn" id="fin">${T.finish} (${answered}/${n})</button>`}
    ${st.mode==='exam' && st.i<n-1 ? `<button class="btn sec" id="fin2">${T.stop}</button>`:''}`;
  $('#pq').onclick = ()=>{ st.i--; history.replaceState(st,''); render(); window.scrollTo(0,0); };
  const nq = $('#nq'); if(nq) nq.onclick = next;
  const f = $('#fin'); if(f) f.onclick = finish;
  const f2 = $('#fin2'); if(f2) f2.onclick = ()=>{ if(confirm(T.confirmFinish)) finish(); };
  function next(){ if(st.i<n-1){ st.i++; history.replaceState(st,''); render(); window.scrollTo(0,0);} else finish(); }
  function finish(){
    stopTimer();
    let correct = 0; const perG = {};
    st.qs.forEach((qq,i)=>{ const g = qq.gebied||0; perG[g] = perG[g]||{c:0,n:0}; perG[g].n++; if(st.ans[i]===qq.a){ correct++; perG[g].c++; } });
    const pct = Math.round(correct/n*100);
    const bestKey = st.mode==='chapter' ? st.id : (st.mode==='exam' ? 'ch15' : null);
    if(bestKey){ const b = bestOf(bestKey); if(b===null || pct>b) store.set('best.'+bestKey, pct); }
    go({view:'result', qs:st.qs, ans:st.ans, correct, pct, perG, mode:st.mode, id:st.id, label:st.label, feedback:st.feedback});
  }
}

function result(){
  const st = state, n = st.qs.length;
  title.textContent = T.result;
  let h = `<div class="card score"><div class="big ${zone(st.pct)}">${st.pct}%</div><div class="sub">${fmt(T.ofCorrect,{c:st.correct,n})} · ${st.pct>=80?T.msg80:st.pct>=70?T.msg70:T.msgLow}</div>`;
  if(st.mode==='exam'){
    h += `<table style="width:100%;font-size:.95em;border-collapse:collapse"><tr><th style="text-align:left">${T.colArea}</th><th>${T.colCorrect}</th><th>${T.colRepeat}</th></tr>`;
    for(const g of [1,2,3]){ const p = st.perG[g]; if(!p) continue; h += `<tr><td style="text-align:left">${g} · ${GEB_NAMES[g]}</td><td>${p.c}/${p.n}</td><td>${p.c/p.n<0.8?T.areaRanges[g]:'–'}</td></tr>`; }
    h += `</table>`;
  }
  h += `<div class="grid2" style="margin-top:14px"><button class="btn" id="again">${T.again}</button><button class="btn sec" id="wrongOnly">${T.wrongOnly}</button></div></div>`;
  h += `<div class="card"><h2>${T.overview}</h2>`;
  st.qs.forEach((q,i)=>{
    const g = st.ans[i], ok = g===q.a;
    h += `<div style="padding:10px 0;border-top:1px solid var(--line)"><div class="small muted">${fmt(T.questionOf,{i:i+1,n})} · ${ok?'<span style="color:var(--ok)">'+T.good+'</span>':(g===undefined?T.unanswered:'<span style="color:var(--bad)">'+T.wrong+' ('+g+')</span>')} · ${T.right}: ${q.a}</div><div>${q.q}</div><div class="small" style="margin-top:4px"><b>${q.a}.</b> ${q.opts[q.a]}</div><div class="small muted" style="margin-top:4px">${q.e}</div></div>`;
  });
  h += `</div>`;
  main.innerHTML = h;
  $('#again').onclick = ()=>go({view:'quiz', mode:st.mode, id:st.id, qs:shuffle([...st.qs]), i:0, ans:{}, label:st.label, feedback:st.feedback, timer:false, start:Date.now()});
  $('#wrongOnly').onclick = ()=>{
    const qs = st.qs.filter((q,i)=>st.ans[i]!==q.a);
    if(!qs.length){ alert(T.noWrong); return; }
    go({view:'quiz', mode:st.mode==='exam'?'mix':st.mode, id:st.id, qs, i:0, ans:{}, label:fmt(T.retake,{n:qs.length}), feedback:true});
  };
}

function zone(p){ return p>=80?'g':p>=60?'y':'r'; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

history.replaceState(state,'');
render();
})();
</script>
</body>
